              !isNewsDigestCard(it) &&
              !isPromotionalSelfPost(it) &&
              !isSubjectiveStyleStory(it)
            ))).sort(compareLaunchFirst);
            if (broadPool.length) {
              filtered = broadPool.slice(0, HOT_LIMIT);

        }
        if (!filtered.length) {
          const forcePool = dedupeByGuidOrLink(
            (Array.isArray(items) ? items : [])
              .filter((it) => String(it?.sourceFeed || "").trim() === "aitimes_industry")

          if (forcePool.length) {

        }

        elGrid.classList.add("hotList");

        log("render-hot", { total: filtered.length });

        const renderTopupCandidates = dedupeByGuidOrLink(

              .filter((it) => {

          .sort(compareLaunchFirst)

          if (isNoisySummaryText(summaryText)) summaryText = "";
          if (!summaryText) summaryText = t("summary_empty");

            if (

          if (currentLang === "en") {

          if (currentLang === "ko" && summaryText && !isSummaryEmptyText(summaryText) && !/[가-힣]/.test(summaryText)) {

              if (emergencyKo && /[가-힣]/.test(emergencyKo)) {

                it,
                titleText,

                buildArticleLeadSummaryText(it.__articleBodyText || it.summaryText || "", titleText, "en"),

              sanitizeEnglishCardSummaryText(buildEnglishFallbackSummaryFromItem(it, titleText), it, titleText),

              .replace(/\s+/g, " ")

                !isSummaryEmptyText(summaryText) &&
                !/[가-힣]/.test(summaryText) &&
                !isGenericEnglishFallbackSummaryText(summaryText, titleText) &&
                isReliableEnglishText(summaryText, 12) &&
                normalizeCompareText(summaryText).length >= 45;
              if (
                isGenericEnglishFallbackTitle(titleText) ||
                !summaryText ||
                /[가-힣]/.test(summaryText) ||
                isGenericEnglishFallbackSummaryText(summaryText, titleText) ||
                !isReliableEnglishText(summaryText, 12) ||
                normalizeCompareText(summaryText).length < 45
              ) {
                if (!fallbackEnUsable) summaryText = buildTitleBasedFallbackSummary(it, titleText, "en");
              }
            } else {
              summaryText = sanitizeKoreanCardSummaryText(summaryText, titleText) || summaryText;
              const fallbackKoUsable =
                !!summaryText && !isSummaryEmptyText(summaryText) && isReliableKoreanText(summaryText, 10);
              if ((!summaryText || !isReliableKoreanText(summaryText, 10)) && !fallbackKoUsable) {
                summaryText = buildTitleBasedFallbackSummary(it, titleText, "ko");
              }
            }
          }
          if (STRICT_API_SUMMARY_ONLY && USE_BACKEND) {
            const apiQualityScore = getAiSummaryQualityScore(it, provider, lang);
            const highQualityApiSummary = Number.isFinite(apiQualityScore) && apiQualityScore >= AI_SUMMARY_MIN_QUALITY_SCORE;
            const apiSummaryRaw = decodeHtmlEntitiesText(
              getAiCardText(it, "__aiSummary", currentAiProvider, currentLang) ||
                (currentLang === "ko" ? it.__apiCardSummaryKo : it.__apiCardSummaryEn) ||
                (highQualityApiSummary ? (currentLang === "ko" ? it.cardSummaryKo || it.summaryKo : it.cardSummaryEn || it.summaryEn) : "") ||
                "",
            )
              .replace(/\s+/g, " ")
              .trim();
            const apiSummaryCandidate =
              currentLang === "ko"
                ? sanitizeKoreanCardSummaryText(apiSummaryRaw, titleText) || apiSummaryRaw
                : sanitizeEnglishCardSummaryText(apiSummaryRaw, it, titleText) || apiSummaryRaw;
            const apiSummarySentenceCount = splitSentencesLocalized(apiSummaryCandidate, currentLang).length;
            const apiSummaryHasEnoughBody =
              normalizeCompareText(apiSummaryCandidate).length >= (currentLang === "ko" ? 52 : 70) &&
              (apiSummarySentenceCount >= 2 || highQualityApiSummary) &&
              !/(?:자동이다|자동입니다)\.?$/i.test(apiSummaryCandidate);
            const apiSummaryUsable =
              currentLang === "ko"
                ? !!apiSummaryCandidate &&
                  !isSummaryEmptyText(apiSummaryCandidate) &&
                  !isNoisySummaryText(apiSummaryCandidate) &&
                  apiSummaryHasEnoughBody &&
                  (highQualityApiSummary || !isSummaryMismatchedToTitle(apiSummaryCandidate, titleText, "ko")) &&
                  isReliableKoreanText(apiSummaryCandidate, 10)
                : !!apiSummaryCandidate &&
                  !isSummaryEmptyText(apiSummaryCandidate) &&
                  !isNoisySummaryText(apiSummaryCandidate) &&
                  apiSummaryHasEnoughBody &&
                  (highQualityApiSummary || !isSummaryMismatchedToTitle(apiSummaryCandidate, titleText, "en")) &&
                  !/[가-힣]/.test(apiSummaryCandidate) &&
                  !isGenericEnglishFallbackSummaryText(apiSummaryCandidate, titleText) &&
                  isReliableEnglishText(apiSummaryCandidate, 12);
            if (!apiSummaryUsable) continue;
            summaryText = apiSummaryCandidate;
            if (
              !summaryText ||
              isNoisySummaryText(summaryText) ||
              (!highQualityApiSummary && isSummaryMismatchedToTitle(summaryText, titleText, currentLang))
            ) {
              continue;
            }
          } else {
            summaryText = formatCardNewsSummary(summaryText, it, currentLang, titleText);
            if (isNoisySummaryText(summaryText) || isSummaryMismatchedToTitle(summaryText, titleText, currentLang)) {
              const hardFallbacks =
                currentLang === "ko"
                  ? [
                      sanitizeKoreanCardSummaryText(buildArticleLeadSummaryText(it.__articleBodyText || it.summaryText || "", titleText, "ko"), titleText),
                      sanitizeKoreanCardSummaryText(buildEmergencySummaryText(it.summaryText || "", titleText), titleText),
                      sanitizeKoreanCardSummaryText(buildTitleBasedFallbackSummary(it, titleText, "ko"), titleText),
                    ]
                  : [
                      sanitizeEnglishCardSummaryText(buildArticleLeadSummaryText(it.__articleBodyText || it.summaryText || "", titleText, "en"), it, titleText),
                      sanitizeEnglishCardSummaryText(buildEmergencySummaryText(it.summaryText || "", titleText), it, titleText),
                      sanitizeEnglishCardSummaryText(buildEnglishFallbackSummaryFromItem(it, titleText), it, titleText),
                    ];
              const recovered = hardFallbacks.find(
                (s) => s && !isNoisySummaryText(s) && !isSummaryMismatchedToTitle(s, titleText, currentLang),
              );
              summaryText = recovered || "";
            }
            if (!summaryText || isSummaryEmptyText(summaryText)) {
              summaryText =
                currentLang === "ko"
                  ? buildMinimalKoreanSummaryFromTitle(titleText)
                  : buildMinimalEnglishSummaryFromTitle(titleText);
            }
            const concreteSummary = rebuildConcreteSummaryFromSource(it, titleText, currentLang);
            if (
              concreteSummary &&
              (!summaryText || isSummaryMismatchedToTitle(summaryText, titleText, currentLang) || isNoisySummaryText(summaryText))
            ) {
              summaryText = concreteSummary;
            }
          }
          if (currentLang === "en") {
            titleText = normalizeEnglishCardTitleForRender(titleText, summaryText, it) || titleText;
            summaryText = normalizeEnglishCardSummaryForRender(summaryText, titleText, it) || summaryText;
          }
          const creatorText = getLocalizedCreatorText(it, currentLang);
          const date = it.pubDate ? new Date(it.pubDate) : null;
          const dateText =
            date && !Number.isNaN(date.valueOf())
              ? date.toLocaleDateString(getLocale(), { year: "numeric", month: "2-digit", day: "2-digit" })
              : "";
          const rank = cardHtml.length + 1;
          const rankLabel = `AI HOT - ${String(rank).padStart(2, "0")}`;
          const sourceText = getArticleSource(it.link || it.creator);
          const sourceMarkup = it.link
            ? `<a class="hotSourceLink" href="${escapeHtml(it.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(sourceText)}</a>`
            : `<span class="hotSourceText">${escapeHtml(sourceText)}</span>`;
          const topicLabel = getCardTopicLabel(it);
          let devInsightText = "";
          if (DEV_INSIGHT_ENABLED) {
            const aiInsightText = getAiCardText(it, "__aiInsight", currentAiProvider, currentLang);
            const aiInsightErrorType = getAiCardMeta(it, "__aiInsightError", currentAiProvider, currentLang);
            const hasAiInsightAttempt = hasAiCardText(it, "__aiInsight", currentAiProvider, currentLang);
            const aiInsightUsable =
              aiInsightText &&
              !isInsightTooSimilarToSummary(aiInsightText, summaryText, currentLang) &&
              isInsightRelevantToContext(aiInsightText, it, titleText, summaryText, currentLang);
            const fallbackInsightText = !USE_BACKEND ? buildLocalInsightText(it, titleText, summaryText, currentLang) : "";
            if (aiInsightUsable) {
              devInsightText = aiInsightText;
            } else if (!USE_BACKEND) {

          const bgInfo = bgAssignments[idx] || {

            fallbackCardBgQuaternary: "./HUMAN-AI.jpg",

          const sourceImageMarkup = primaryCardBg
            ? `<span class="hotCardSourceImage" aria-hidden="true"><img src="${escapeHtml(primaryCardBg)}" alt="" loading="lazy" decoding="async"></span>`
            : "";
          const cardClass = bgInfo.hasSourceImage ? "hotCard hotCardBg hasImage" : "hotCard hotCardBg noImage";
          cardHtml.push(`
            <article class="${cardClass}" style="--delay:${(cardHtml.length - 1) * 70}ms;">
              <div class="hotCardOverlay"></div>
              <div class="hotBody">
                <div class="hotTopline">
                  <span class="hotRank">${rankLabel}</span>
                </div>
                <h3 class="hotHeadline">
                  <a href="${escapeHtml(it.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(titleText)}</a>
                </h3>
                <div class="hotMeta">
                  ${creatorText ? `<span>${escapeHtml(creatorText)}</span>` : ""}
                  ${dateText ? `<span>${escapeHtml(dateText)}</span>` : ""}
                  <span class="hotTopicPill">${escapeHtml(topicLabel)}</span>
                </div>
                <p class="summaryLabel">${t("summary_label")}</p>
                <div class="hotSummaryFrame">

                ${shouldRenderInsight
                  ? `<div class="hotInsight">
                      <p class="hotInsightLabel">${t("dev_insight_label")}</p>

                    </div>`

                <div class="hotFoot">

                    ${sourceMarkup}

          renderItems.push(it);
        }

        if (!cardHtml.length) {
          renderedHotCardCount = 0;
          updateDynamicHotLabels(0);
          updateAiNetworkStatus([]);
          updateFooterSources([]);
          elGrid.innerHTML = `<div class="note">${t("no_items")}</div>`;
          if (BILINGUAL_CONTENT_SYNC && USE_BACKEND) {
            const warmupLimit = HOT_LIMIT * 2;
            const warmupTargets = dedupeByGuidOrLink(renderTopupCandidates).slice(0, warmupLimit);
            if (warmupTargets.length) hydrateAiCardTexts(warmupTargets, items);
          }
          return;
        }

        renderedHotCardCount = cardHtml.length;
        updateDynamicHotLabels(renderedHotCardCount);
        updateAiNetworkStatus(renderItems);
        updateFooterSources(renderItems);
        elGrid.innerHTML = `
          <div class="hotHeader">

          </div>

        `;

        preloadAllImagesInOrder(renderItems, 0);
        hydrateMissingImages(renderItems, items);
        const hydrateTargets =
          BILINGUAL_CONTENT_SYNC && USE_BACKEND
            ? dedupeByGuidOrLink([...renderItems, ...renderTopupCandidates]).slice(0, HOT_LIMIT * 2)
            : renderItems;
        hydrateAiCardTexts(hydrateTargets, items);
      }

      async function fetchFeedJson(cat, dateStr) {
        const params = new URLSearchParams({ cat });
        if (dateStr) params.set("date", dateStr);
        const url = `${BACKEND_API}?${params.toString()}`;
        log("fetch-feed", { url });
        const res = await fetchWithTimeout(url, { method: "GET", cache: "no-store" }, NETWORK_FETCH_TIMEOUT_MS);
        if (res.status === 404) {
          log("fetch-feed-404", { url });
          return { meta: { title: "", link: "", updated: "" }, items: [] };
        }
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        return await res.json();
      }

      async function fetchBackendSourceItems(sourceKey, dateStr) {
        const source = FEEDS.find((f) => f.key === sourceKey);
        const feed = await fetchFeedJson(sourceKey, dateStr);
        const items = Array.isArray(feed?.items) ? feed.items : [];
        return dedupeByGuidOrLink(
          items.map((it) => ({
            ...it,
            sourceFeed: sourceKey,
            sourceFeedTitle: String(it?.sourceFeedTitle || source?.label || "").trim(),
          })),
        );
      }

      async function fetchRssXml(url) {
        // 브라우저 CORS 문제를 피하기 위해 프록시 사용
        return await fetchTextWithProxyRetry(url);
      }

      function toAbsoluteUrl(url, baseUrl) {
        const raw = String(url || "").trim();
        if (!raw) return "";
        try {
          return new URL(raw, baseUrl || location.href).href;
        } catch (e) {
          return raw;
        }
      }

      function normalizeAiTimesPubDate(rawDateText) {
        const raw = decodeHtmlEntitiesText(rawDateText || "");
        if (!raw) return "";

        const full = raw.match(/^(\d{4})[.-](\d{2})[.-](\d{2})(?:\s+(\d{2}):(\d{2}))?$/);
        if (full) {
          const y = Number(full[1]);
          const m = Number(full[2]);
          const d = Number(full[3]);
          const hh = Number(full[4] || "0");
          const mm = Number(full[5] || "0");
          const utcMs = Date.UTC(y, m - 1, d, hh - 9, mm, 0);
          if (!Number.isNaN(utcMs)) return new Date(utcMs).toISOString();
          return "";
        }

        const md = raw.match(/^(\d{2})-(\d{2})\s+(\d{2}):(\d{2})$/);
        if (md) {
          const now = new Date();
          let y = now.getFullYear();
          const m = Number(md[1]);
          const d = Number(md[2]);
          const hh = Number(md[3]);
          const mm = Number(md[4]);
          let utcMs = Date.UTC(y, m - 1, d, hh - 9, mm, 0);
          if (utcMs - Date.now() > 36 * 60 * 60 * 1000) {
            y -= 1;
            utcMs = Date.UTC(y, m - 1, d, hh - 9, mm, 0);
          }
          if (!Number.isNaN(utcMs)) return new Date(utcMs).toISOString();
        }
        return "";
      }

      function parseAiTimesList(htmlText, source) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(String(htmlText || ""), "text/html");
        const feedUrl = String(source?.url || "");
        const feedLabel = String(source?.label || "AI Times - AI Industry");

        const titleNode = doc.querySelector(".altlist-title");
        const titleRaw = titleNode?.childNodes?.[0]?.textContent || titleNode?.textContent || "";
        const feedTitle = decodeHtmlEntitiesText(titleRaw).replace(/\s+/g, " ").trim() || feedLabel;
        lastFeedMeta = { title: feedTitle, link: feedUrl, updated: "" };

        const rows = Array.from(doc.querySelectorAll("li.altlist-webzine-item"));
        const mapped = rows
          .map((row) => {
            const subjectLink =
              row.querySelector("h2.altlist-subject a") ||
              row.querySelector(".altlist-subject a") ||
              row.querySelector("a[href*='articleView.html']");
            const href = toAbsoluteUrl(subjectLink?.getAttribute("href") || "", feedUrl);
            const titleText = decodeHtmlEntitiesText(subjectLink?.textContent || "");
            const summaryText = decodeHtmlEntitiesText(row.querySelector(".altlist-summary")?.textContent || "");
            const imgNode = row.querySelector("a.altlist-image img, .altlist-image img");
            const imgRaw = toAbsoluteUrl(
              imgNode?.getAttribute("src") || imgNode?.getAttribute("data-src") || imgNode?.getAttribute("data-original") || "",
              feedUrl,
            );
            const info = Array.from(row.querySelectorAll(".altlist-info .altlist-info-item")).map((n) =>
              decodeHtmlEntitiesText(n?.textContent || ""),
            );
            const category = info[0] || "AI산업";
            const creator = info[1] || "AI Times";
            const pubDate = normalizeAiTimesPubDate(info[2] || "") || new Date().toISOString();
            const idxMatch = href.match(/[?&]idxno=(\d+)/i);
            const guid = idxMatch?.[1] ? `aitimes-${idxMatch[1]}` : href || titleText;
            if (!href || !titleText) return null;
            return {
              title: titleText,
              link: href,
              guid,
              pubDate,
              creator,
              categories: category ? [category] : ["AI산업"],
              summaryText,
              imgUrl: normalizeImageUrl(imgRaw),
            };
          })
          .filter(Boolean);

        const dedupe = (items) => {
          const seen = new Set();
          const out = [];
          for (const it of items || []) {
            const key = String(it?.guid || it?.link || it?.title || "").trim();
            if (!key || seen.has(key)) continue;
            seen.add(key);
            out.push(it);
          }
          return out;
        };

        const strictItems = dedupe(mapped);
        if (strictItems.length) return strictItems;

        // Fallback parser: recover list when AI Times markup classes change.
        const fallback = [];
        const fallbackSeen = new Set();
        const anchors = Array.from(doc.querySelectorAll("a[href*='articleView.html']"));
        anchors.forEach((anchor) => {
          if (fallback.length >= 120) return;
          const href = toAbsoluteUrl(anchor.getAttribute("href") || "", feedUrl);
          if (!href || !/[?&]idxno=\d+/i.test(href)) return;
          const idxMatch = href.match(/[?&]idxno=(\d+)/i);
          const guid = idxMatch?.[1] ? `aitimes-${idxMatch[1]}` : href;
          if (!guid || fallbackSeen.has(guid)) return;

          const titleText = decodeHtmlEntitiesText(anchor.textContent || "").replace(/\s+/g, " ").trim();
          if (!titleText || titleText.length < 10) return;

          const block = anchor.closest("li,article,section,div") || anchor.parentElement || anchor;
          const blockText = decodeHtmlEntitiesText(block?.textContent || "").replace(/\s+/g, " ").trim();
          let summaryText =
            decodeHtmlEntitiesText(
              block?.querySelector(".altlist-summary, .summary, .article-summary, .list-summary, p")?.textContent || "",
            )
              .replace(/\s+/g, " ")
              .trim() || "";
          if (!summaryText && blockText) {
            summaryText = blockText.replace(titleText, " ").replace(/\s+/g, " ").trim();
          }

          const imgNode = block?.querySelector("img");
          const imgRaw = toAbsoluteUrl(
            imgNode?.getAttribute("src") || imgNode?.getAttribute("data-src") || imgNode?.getAttribute("data-original") || "",
            feedUrl,
          );

          const dateMatch = blockText.match(/(\d{4}[./-]\d{1,2}[./-]\d{1,2}\s+\d{1,2}:\d{2})|(\d{2}[./-]\d{2}\s+\d{1,2}:\d{2})/);
          const creatorMatch = blockText.match(/([가-힣]{2,4}\s*기자)/);
          const categoryMatch = blockText.match(/(산업일반|메타버스|AI 기업|AI기업|영어뉴스|English News|기타|정책|AI산업)/i);
          const creator = decodeHtmlEntitiesText(creatorMatch?.[1] || "AI Times").replace(/\s+/g, " ").trim();
          const category = decodeHtmlEntitiesText(categoryMatch?.[1] || "AI산업").replace(/\s+/g, " ").trim();
          const pubDate =
            normalizeAiTimesPubDate(dateMatch?.[0] || "") ||
            normalizeLooseHtmlPubDate(dateMatch?.[0] || "") ||
            new Date().toISOString();

          fallbackSeen.add(guid);
          fallback.push({
            title: titleText,
            link: href,
            guid,
            pubDate,
            creator,
            categories: category ? [category] : ["AI산업"],
            summaryText,
            imgUrl: normalizeImageUrl(imgRaw),
          });
        });

        return dedupe(fallback);
      }

      function normalizeLooseHtmlPubDate(rawDateText) {
        const raw = decodeHtmlEntitiesText(rawDateText || "").replace(/\s+/g, " ").trim();
        if (!raw) return "";
        const parsed = new Date(raw);
        if (!Number.isNaN(parsed.valueOf())) return parsed.toISOString();
        const ymd = raw.match(/(\d{4})[./-](\d{1,2})[./-](\d{1,2})/);
        if (ymd) {
          const utcMs = Date.UTC(Number(ymd[1]), Number(ymd[2]) - 1, Number(ymd[3]), 0, 0, 0);
          if (!Number.isNaN(utcMs)) return new Date(utcMs).toISOString();
        }
        return "";
      }

      function parseGenericAnchorFeed(htmlText, source, options = {}) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(String(htmlText || ""), "text/html");
        const feedUrl = String(source?.url || "");
        const titleNode = doc.querySelector("title");
        lastFeedMeta = {
          title: decodeHtmlEntitiesText(titleNode?.textContent || source?.label || source?.key || "").replace(/\s+/g, " ").trim(),
          link: feedUrl,
          updated: "",
        };

        const hrefPattern = options.hrefPattern instanceof RegExp ? options.hrefPattern : /.*/i;
        const anchors = Array.from(doc.querySelectorAll("a[href]"));
        const items = [];
        const seen = new Set();

        for (const anchor of anchors) {
          const href = toAbsoluteUrl(anchor.getAttribute("href") || "", feedUrl);
          const titleText = decodeHtmlEntitiesText(anchor.textContent || "").replace(/\s+/g, " ").trim();
          if (!href || !titleText || titleText.length < 14) continue;
          if (!hrefPattern.test(href)) continue;
          if (options.excludePattern && options.excludePattern.test(href)) continue;

          const key = href.toLowerCase();
          if (seen.has(key)) continue;
          seen.add(key);

          const container = anchor.closest("article, li, section, div") || anchor.parentElement || anchor;
          const summaryText = decodeHtmlEntitiesText(
            container?.querySelector("p")?.textContent ||
              container?.querySelector("[class*='summary'], [class*='excerpt'], [class*='dek']")?.textContent ||
              "",
          )
            .replace(/\s+/g, " ")
            .trim();
          const timeNode = container?.querySelector("time");
          const pubDate =
            normalizeLooseHtmlPubDate(timeNode?.getAttribute("datetime") || timeNode?.textContent || "") || new Date().toISOString();
          const imgNode = container?.querySelector("img");
          const imgRaw = toAbsoluteUrl(
            imgNode?.getAttribute("src") || imgNode?.getAttribute("data-src") || imgNode?.getAttribute("srcset")?.split(",")?.[0]?.trim()?.split(" ")?.[0] || "",
            feedUrl,
          );
          items.push({
            title: titleText,
            link: href,
            guid: href,
            pubDate,
            creator: source?.label || "",
            categories: options.category ? [options.category] : [],
            summaryText,
            imgUrl: normalizeImageUrl(imgRaw),
          });
          if (items.length >= 60) break;
        }

        return dedupeByGuidOrLink(items);
      }

      function parseTldrAiDigest(htmlText, source) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(String(htmlText || ""), "text/html");
        const feedUrl = String(source?.url || "https://tldr.tech/ai");
        const pageTitle = decodeHtmlEntitiesText(doc.querySelector("title")?.textContent || source?.label || "TLDR AI")
          .replace(/\s+/g, " ")
          .trim();
        const headingText = decodeHtmlEntitiesText(doc.querySelector("h1")?.textContent || "");
        const dateMatch = headingText.match(/(\d{4})-(\d{2})-(\d{2})/);
        const pubDate =
          dateMatch
            ? new Date(Date.UTC(Number(dateMatch[1]), Number(dateMatch[2]) - 1, Number(dateMatch[3]), 0, 0, 0)).toISOString()
            : new Date().toISOString();
        lastFeedMeta = {
          title: pageTitle || source?.label || "TLDR AI",
          link: "https://tldr.tech/ai",
          updated: pubDate,
        };

        const items = [];
        const seen = new Set();
        Array.from(doc.querySelectorAll("section")).forEach((section) => {
          const sectionTitle = decodeHtmlEntitiesText(section.querySelector("header h3")?.textContent || "")
            .replace(/\s+/g, " ")
            .trim();
          Array.from(section.querySelectorAll("article")).forEach((article) => {
            const linkEl = article.querySelector("a[href]");
            const href = toAbsoluteUrl(linkEl?.getAttribute("href") || "", "https://tldr.tech/");
            const titleText = decodeHtmlEntitiesText(linkEl?.querySelector("h3")?.textContent || linkEl?.textContent || "")
              .replace(/\s+/g, " ")
              .trim();
            const summaryText = decodeHtmlEntitiesText(article.querySelector(".newsletter-html")?.textContent || "")
              .replace(/\s+/g, " ")
              .trim();
            if (!href || !titleText) return;
            if (/sponsor/i.test(titleText) || /sponsor/i.test(sectionTitle)) return;
            const guid = `tldr:${href}`;
            if (seen.has(guid)) return;
            seen.add(guid);
            items.push({
              title: titleText,
              link: href,
              guid,
              pubDate,
              creator: "TLDR AI",
              categories: sectionTitle ? [sectionTitle] : ["Newsletter"],
              summaryText,
              imgUrl: "",
            });
          });
        });

        return dedupeByGuidOrLink(items);
      }

      function parseFeedPayloadForSource(source, payloadText) {
        const parserType = String(source?.parser || "");
        if (parserType === "aitimes_list" || source?.key === "aitimes_industry") {
          return parseAiTimesList(payloadText, source);
        }
        if (parserType === "rundown_ai") {
          return parseGenericAnchorFeed(payloadText, source, {
            hrefPattern: /\/p\/[^/?#]+/i,
            category: "Newsletter",
          });
        }
        if (parserType === "superhuman_ai") {
          return parseGenericAnchorFeed(payloadText, source, {
            hrefPattern: /\/p\/[^/?#]+/i,
            category: "Newsletter",
          });
        }
        if (parserType === "tldr_ai_digest") {
          return parseTldrAiDigest(payloadText, source);
        }
        if (parserType === "anthropic_news") {
          return parseGenericAnchorFeed(payloadText, source, {
            hrefPattern: /\/news\/[^/]+/i,
            category: "Company",
          });
        }
        if (parserType === "meta_ai_blog") {
          return parseGenericAnchorFeed(payloadText, source, {
            hrefPattern: /\/blog\/[^/]+/i,
            excludePattern: /\/blog\/?$/i,
            category: "Technology",
          });
        }
        if (parserType === "anandtech_ai") {
          return parseGenericAnchorFeed(payloadText, source, {
            hrefPattern: /\/show\/\d+/i,
            category: "Hardware",
          });
        }
        return parseRss(payloadText);
      }

      function buildAiTimesPagedUrl(baseUrl, page) {
        const safePage = Math.max(1, Number(page) || 1);
        try {
          const u = new URL(String(baseUrl || ""), location.href);
          if (safePage <= 1) {
            u.searchParams.delete("page");
            u.searchParams.delete("pageNo");
            return u.href;
          }
          u.searchParams.set("page", String(safePage));
          return u.href;
        } catch (e) {
          const raw = String(baseUrl || "").trim();
          if (!raw || safePage <= 1) return raw;
          return `${raw}${raw.includes("?") ? "&" : "?"}page=${safePage}`;
        }
      }

      async function fetchAiTimesPagedItems(source, maxPages = AITIMES_MAX_PAGES) {
        if (!source?.url) return [];
        const rawPages = Number(maxPages);
        const pages = Number.isFinite(rawPages) ? Math.max(1, rawPages) : Number.POSITIVE_INFINITY;
        const seen = new Set();
        const out = [];
        const startedAt = Date.now();

        for (let page = 1; page <= pages; page++) {
          if (Date.now() - startedAt > AITIMES_FETCH_SOFT_TIMEOUT_MS) break;
          const pageUrl = buildAiTimesPagedUrl(source.url, page);
          let payloadText = "";
          try {
            payloadText = await fetchRssXml(pageUrl);
          } catch (e) {
            if (page === 1) throw e;
            break;
          }

          const parsed = parseAiTimesList(payloadText, { ...source, url: pageUrl });
          if (!Array.isArray(parsed) || !parsed.length) break;
          let added = 0;
          for (const it of parsed || []) {
            const key = String(it?.guid || it?.link || it?.title || "").trim();
            if (!key || seen.has(key)) continue;
            seen.add(key);
            out.push(it);
            added++;
          }
          if (page > 1 && added === 0) break;
        }

        return out;
      }

      async function fetchSourceItemsWithParser(source) {
        if (!source?.url) return [];
        const parserType = String(source?.parser || "");
        if (parserType === "aitimes_list" || source?.key === "aitimes_industry") {
          return await fetchAiTimesPagedItems(source);
        }
        const payloadText = await fetchRssXml(source.url);
        return parseFeedPayloadForSource(source, payloadText);
      }

      function parseRss(xmlText) {
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");

        // 파서 체크
        const parserError = xml.querySelector("parsererror");
        if (parserError) {
          throw new Error("RSS XML 파싱 실패 (parsererror)");
        }

        const channel = xml.querySelector("channel");
        const feedTitle = channel?.querySelector("title")?.textContent?.trim?.() ?? "";
        const feedLink = channel?.querySelector("link")?.textContent?.trim?.() ?? "";
        const updated = channel?.querySelector("lastBuildDate")?.textContent?.trim?.() ?? "";
        lastFeedMeta = { title: feedTitle, link: feedLink, updated };

        const items = Array.from(xml.querySelectorAll("item")).map(mapItem);

        // 중복 제거(guid 기준)
        const seen = new Set();
        const deduped = [];
        for (const it of items) {
          if (seen.has(it.guid)) continue;
          seen.add(it.guid);
          deduped.push(it);
        }
        return deduped;
      }

      async function loadCurrentFeed() {
        const selectedValue = String(elCategory?.value || "").trim();
        let selected =
          selectedValue === "hot_sources"
            ? { key: "hot_sources", label: "AI Times + TechCrunch" }
            : FEEDS.find((f) => f.key === selectedValue) || FEEDS.find((f) => f.key === "aitimes_industry") || FEEDS[0];
        if (selected.key !== "hot_sources" && selected.key !== "aitimes_industry" && selected.key !== "tc_ai") {
          selected = { key: "hot_sources", label: "AI Times + TechCrunch" };
          if (elCategory) elCategory.value = "hot_sources";
        }
        const todayStr = new Date().toISOString().slice(0, 10);
        const dateStr = AUTO_END_DATE_BY_TODAY ? todayStr : (elDatePick.value || "").trim();
        if (AUTO_END_DATE_BY_TODAY && elDatePick && elDatePick.value !== todayStr) {
          elDatePick.value = todayStr;
        }
        hotWindowLabel = "";
        hotWeekMeta = null;
        hotSortBasis = "issue";
        cardBgShuffleSalt = Date.now();
        lastAiTimesCandidateItems = [];

        setStatus("warn", t("status_loading"), "status_loading");
        updateAiNetworkStatus([]);
        elGrid.innerHTML = `<div class="note" style="grid-column: 1 / -1;">${t("status_loading")}</div>`;

        try {
          log("load-feed", { cat: selected.key, date: dateStr });
          if (USE_BACKEND) {
            try {
              if (selected.key === "hot_sources" || selected.key === "all_ai") {
                let allItems = [];
                const sourceKeys = ["aitimes_industry", "tc_ai"];
                const settled = await Promise.allSettled(
                  sourceKeys.map(async (key) => {
                    const src = FEEDS.find((f) => f.key === key);
                    if (!src?.url) return [];
                    const parsed =
                      key === "aitimes_industry" || key === "tc_ai"
                        ? await fetchBackendSourceItems(key, dateStr)
                        : await fetchSourceItemsWithParser(src);
                    return parsed.map((it) => ({ ...it, sourceFeed: key, sourceFeedTitle: src.label || it?.sourceFeedTitle || "" }));
                  }),
                );
                settled.forEach((r) => {
                  if (r.status === "fulfilled" && Array.isArray(r.value)) allItems.push(...r.value);
                });
                const bundle = buildHotBundleFromItems(allItems, dateStr);
                const directPool = dedupeByGuidOrLink(allItems).sort((a, b) => {
                  const priorityDelta = getLaunchPriorityScore(b) - getLaunchPriorityScore(a);
                  if (priorityDelta !== 0) return priorityDelta;
                  return toDateMs(b?.pubDate || "") - toDateMs(a?.pubDate || "");
                });
                lastFeedMeta = bundle.meta || { title: "", link: "", updated: "" };
                lastItems = directPool.length ? directPool : bundle.items || [];
                hotWindowLabel = bundle.windowLabel || "";
                hotWeekMeta = bundle.weekMeta || null;
                hotSortBasis = bundle.sortBasis || "issue";
              } else if (selected.key === "aitimes_industry" || selected.key === "tc_ai") {
                const parsed = await fetchBackendSourceItems(selected.key, dateStr);
                const normalized = dedupeByGuidOrLink(
                  (parsed || []).map((it) => ({
                    ...it,
                    sourceFeed: selected.key,
                    sourceFeedTitle: selected.label || it?.sourceFeedTitle || "",
                  })),
                );
                if (selected.key === "aitimes_industry" && normalized.length) {
                  await prefetchArticleBodiesForSourceItems(normalized, "aitimes_industry", AITIMES_PREFETCH_LIMIT);
                }
                const bundle = buildHotBundleFromItems(normalized, dateStr);
                const directPool = dedupeByGuidOrLink(normalized).sort((a, b) => {
                  const priorityDelta = getLaunchPriorityScore(b) - getLaunchPriorityScore(a);
                  if (priorityDelta !== 0) return priorityDelta;
                  return toDateMs(b?.pubDate || "") - toDateMs(a?.pubDate || "");
                });
                lastFeedMeta = bundle.meta || { title: "", link: "", updated: "" };
                lastItems = directPool.length ? directPool : bundle.items || [];
                hotWindowLabel = bundle.windowLabel || "";
                hotWeekMeta = bundle.weekMeta || null;
                hotSortBasis = bundle.sortBasis || "issue";
              } else {
                const weekly = await fetchWeeklyHotItems(selected.key, dateStr);
                lastFeedMeta = weekly.meta || { title: "", link: "", updated: "" };
                lastItems = weekly.items || [];
                hotWindowLabel = weekly.windowLabel || "";
                hotWeekMeta = weekly.weekMeta || null;
                hotSortBasis = weekly.sortBasis || "issue";
              }
            } catch (backendErr) {
              log("backend-fallback", { error: String(backendErr?.message || backendErr) });
              let allItems = [];
              if (selected.key === "hot_sources" || selected.key === "all_ai") {
                const sourceKeys = ["aitimes_industry", "tc_ai"];
                const settled = await Promise.allSettled(
                  sourceKeys.map(async (key) => {
                    const src = FEEDS.find((f) => f.key === key);
                    if (!src?.url) return [];
                    const parsed =
                      key === "aitimes_industry" || key === "tc_ai"
                        ? await fetchBackendSourceItems(key, dateStr)
                        : await fetchSourceItemsWithParser(src);
                    return parsed.map((it) => ({ ...it, sourceFeed: key }));
                  }),
                );
                settled.forEach((r) => {
                  if (r.status === "fulfilled" && Array.isArray(r.value)) allItems.push(...r.value);
                });
              } else {
                allItems =
                  selected.key === "aitimes_industry" || selected.key === "tc_ai"
                    ? await fetchBackendSourceItems(selected.key, dateStr)
                    : await fetchSourceItemsWithParser(selected);
              }
              const bundle = buildHotBundleFromItems(allItems, dateStr);
              const directPool = dedupeByGuidOrLink(allItems).sort((a, b) => {
                const priorityDelta = getLaunchPriorityScore(b) - getLaunchPriorityScore(a);
                if (priorityDelta !== 0) return priorityDelta;
                return toDateMs(b?.pubDate || "") - toDateMs(a?.pubDate || "");
              });
              lastItems = directPool.length ? directPool : bundle.items;
              hotSortBasis = bundle.sortBasis;
              hotWindowLabel = bundle.windowLabel;
              hotWeekMeta = bundle.weekMeta || null;
            }
          } else {
            let allItems = [];
            if (selected.key === "hot_sources" || selected.key === "all_ai") {
              const sourceKeys = ["aitimes_industry", "tc_ai"];
              const settled = await Promise.allSettled(
                sourceKeys.map(async (key) => {
                  const src = FEEDS.find((f) => f.key === key);
                  if (!src?.url) return [];
                  const parsed =
                    key === "aitimes_industry" || key === "tc_ai"
                      ? await fetchBackendSourceItems(key, dateStr)
                      : await fetchSourceItemsWithParser(src);
                  return parsed.map((it) => ({ ...it, sourceFeed: key }));
                }),
              );
              settled.forEach((r) => {
                if (r.status === "fulfilled" && Array.isArray(r.value)) allItems.push(...r.value);
              });
            } else {
              allItems = await fetchSourceItemsWithParser(selected);
            }
            const bundle = buildHotBundleFromItems(allItems, dateStr);
            const directPool = dedupeByGuidOrLink(allItems).sort((a, b) => {
              const priorityDelta = getLaunchPriorityScore(b) - getLaunchPriorityScore(a);
              if (priorityDelta !== 0) return priorityDelta;
              return toDateMs(b?.pubDate || "") - toDateMs(a?.pubDate || "");
            });
            lastItems = directPool.length ? directPool : bundle.items;
            hotSortBasis = bundle.sortBasis;
            hotWindowLabel = bundle.windowLabel;
            hotWeekMeta = bundle.weekMeta || null;
          }
          if (USE_BACKEND && selected.key === "all_ai") {
            try {
              const fallbackFeed = await fetchFeedJson("all_ai", dateStr);
              const fallbackItems = Array.isArray(fallbackFeed?.items) ? fallbackFeed.items : [];
              if (fallbackItems.length) {
                const mergedPool = dedupeByGuidOrLink([
                  ...(Array.isArray(lastItems) ? lastItems : []),
                  ...fallbackItems.map((it) => ({
                    ...it,
                    sourceFeed: String(it?.sourceFeed || "").trim() || "all_ai",
                    sourceFeedTitle: String(it?.sourceFeedTitle || fallbackFeed?.meta?.title || "ALL AI (Aggregated)"),
                  })),
                ]);
                const poolLimit = Math.max(HOT_LIMIT * 4, 24);
                lastItems = mergedPool.slice(0, poolLimit);
              }
            } catch (fallbackErr) {
              log("all-ai-pool-fallback-error", { error: String(fallbackErr?.message || fallbackErr) });
            }
          }
          if (lastItems.length) {
            const selectedKey = String(selected?.key || "").trim();
            if (selectedKey === "aitimes_industry" || selectedKey === "tc_ai") {
              lastItems = lastItems.map((it) => ({
                ...it,
                sourceFeed: String(it?.sourceFeed || "").trim() || selectedKey,
                sourceFeedTitle: String(it?.sourceFeedTitle || "").trim() || (selected?.label || ""),
              }));
            }
            lastItems.forEach((it) => ensureCanonicalCardText(it));
            await localizeItemsToEnglish(lastItems);
          }
          if (lastItems.length) {
            if (BILINGUAL_CONTENT_SYNC) {
              await synchronizeBilingualCardTexts(lastItems);
            } else if (currentLang === "ko") {
              await localizeItemsToKorean(lastItems);
            }
          }
          if (!lastItems.length) {
            const aiTimesFeed = FEEDS.find((f) => f.key === "aitimes_industry");
            if (aiTimesFeed) {
              try {
                const parsed = USE_BACKEND
                  ? await fetchBackendSourceItems("aitimes_industry", dateStr)
                  : await fetchSourceItemsWithParser(aiTimesFeed);
                const directItems = dedupeByGuidOrLink(
                  (parsed || []).map((it) => ({
                    ...it,
                    sourceFeed: "aitimes_industry",
                    sourceFeedTitle: aiTimesFeed.label || "AI Times - AI Industry",
                  })),
                );
                if (directItems.length) {
                  await prefetchArticleBodiesForSourceItems(directItems, "aitimes_industry", AITIMES_PREFETCH_LIMIT);
                  lastItems = directItems;
                  if (BILINGUAL_CONTENT_SYNC) {
                    await synchronizeBilingualCardTexts(lastItems);
                  } else if (currentLang === "ko") {
                    await localizeItemsToKorean(lastItems);
                  }
                }
              } catch (directFallbackErr) {
                log("aitimes-direct-fallback-error", { error: String(directFallbackErr?.message || directFallbackErr) });
              }
            }
          }
          log("load-feed-done", { items: lastItems.length });
          setStatus("ok", t("status_done"), "status_done");
          setMetaText();
          render(lastItems);
        } catch (err) {
          console.error(err);
          log("load-feed-error", { error: String(err?.message || err) });
          setStatus("err", t("status_failed"), "status_failed");
          setMetaText();
          elGrid.innerHTML = `
            <div class="note" style="grid-column: 1 / -1;">
              <div style="font-weight:600; color: rgba(255,255,255,0.92);">${t("err_title")}</div>
              <div style="margin-top:6px;">${t("err_label")} <code>${escapeHtml(String(err?.message || err))}</code></div>
              <div style="margin-top:8px;">
                <ul style="margin: 0; padding-left: 18px;">
                  <li>${t("err_tip1")}</li>
                  <li>${t("err_tip2")}</li>
                  <li>${t("err_tip3")}</li>
                </ul>
              </div>
            </div>
          `;
        }
      }

      function init() {
        loadOgCacheFromStorage();
        loadKoTranslateCacheFromStorage();
        loadEnTranslateCacheFromStorage();
        loadActiveSourcesFromStorage();
        loadAiProviderFromStorage();
        applyI18n();
        // Options
        const visibleCategoryKeys = new Set(["aitimes_industry", "tc_ai"]);
        elCategory.innerHTML = [
          `<option value="hot_sources">AI Times + TechCrunch</option>`,
          ...FEEDS.filter((f) => visibleCategoryKeys.has(String(f?.key || ""))).map(
            (f) => `<option value="${f.key}">${f.label}</option>`,
          ),
        ].join("");
        elCategory.value = "hot_sources";
        elDatePick.value = new Date().toISOString().slice(0, 10);
        elQ.value = "";
        renderSourceToggles();

        elCategory.addEventListener("change", () => {
          renderSourceToggles();
          setMetaText();
          loadCurrentFeed();
        });
        elDatePick.addEventListener("change", loadCurrentFeed);
        elReload.addEventListener("click", loadCurrentFeed);
        elQ.addEventListener("input", () => render(lastItems));
        elAiProviderSelect?.addEventListener("change", () => {
          currentAiProvider = normalizeAiProvider(elAiProviderSelect.value);
          if (currentAiProvider !== "auto" && currentAiProvider !== "groq") currentAiProvider = "auto";
          applyAiProviderUi();
          saveAiProviderToStorage();
          setMetaText();
          if (lastItems.length) render(lastItems);
        });
        elSourceToggles?.addEventListener("click", (e) => {
          const btn = e.target && e.target.closest ? e.target.closest(".sourceChip") : null;
          if (!btn) return;
          const key = btn.getAttribute("data-source-key") || "";
          if (!AGGREGATE_SOURCE_KEYS.includes(key)) return;
          const isRequiredSource = REQUIRED_AGGREGATE_SOURCE_KEYS.includes(key);

          const next = new Set(activeAggregateSourceKeys);
          if (next.has(key)) {
            if (isRequiredSource) return;
            if (next.size === 1) return;
            next.delete(key);
          } else {
            next.add(key);
          }

          activeAggregateSourceKeys = new Set(withRequiredAggregateSourceKeys(Array.from(next)));
          saveActiveSourcesToStorage();
          renderSourceToggles();
          setMetaText();
          loadCurrentFeed();
        });
        elLangToggle?.addEventListener("click", async () => {
          const prevStatus = { ...lastStatus };
          currentLang = currentLang === "ko" ? "en" : "ko";
          try {
            localStorage.setItem("lang", currentLang);
          } catch (e) {}
          applyI18n();
          renderSourceToggles();
          setMetaText();
          if (lastItems.length) {
            lastItems.forEach((it) => ensureCanonicalCardText(it));
            setStatus("warn", t("status_loading"), "status_loading");
            await localizeItemsToEnglish(lastItems);
            if (BILINGUAL_CONTENT_SYNC) {
              await synchronizeBilingualCardTexts(lastItems);
            } else if (currentLang === "ko") {
              await localizeItemsToKorean(lastItems);
            }
          }
          setStatus(prevStatus.kind, t(prevStatus.key), prevStatus.key);
          render(lastItems);
        });
        elGrid.addEventListener(
          "click",
          (e) => {
            const btn = e.target && e.target.closest ? e.target.closest(".navBtn") : null;
            if (!btn) return;
            if (btn.id === "navPrev") {
              if (navHandlers.prev) navHandlers.prev();
              else log("nav-miss", { dir: "prev" });
            } else if (btn.id === "navNext") {
              if (navHandlers.next) navHandlers.next();
              else log("nav-miss", { dir: "next" });
            }
          },
          true,
        );

        setStatus("", t("status_idle"), "status_idle");
        setMetaText();
        loadCurrentFeed();
      }

init();
    </script>
