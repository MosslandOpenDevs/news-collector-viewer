<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WEEKLY AI HOT 10 - Medium Layout</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #121625;
        --card: #151a2b;
        --text: #e8ecff;
        --muted: #a8b1d9;
        --border: rgba(255, 255, 255, 0.1);
        --accent: #35c5f0;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        --radius: 16px;
        --radius-sm: 12px;
        --glass: rgba(255, 255, 255, 0.08);
        --shadow-strong: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          "Noto Sans KR",
          Arial,
          "Apple SD Gothic Neo",
          "Malgun Gothic",
          sans-serif;
        background:
          radial-gradient(1200px 700px at 30% -10%, rgba(53, 197, 240, 0.18), transparent 55%),
          radial-gradient(900px 500px at 90% 10%, rgba(124, 92, 255, 0.12), transparent 55%), var(--bg);
        color: var(--text);
        line-height: 1.45;
      }

      header {
        padding: 20px 16px 8px;
        max-width: 640px;
        margin: 0 auto;
      }

      .title {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.2px;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 10px 16px 30px;
      }

      .panel {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 14px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        align-items: center;
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      select,
      input {
        width: 100%;
        padding: 11px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.18);
        color: var(--text);
        outline: none;
      }

      select:focus,
      input:focus {
        border-color: rgba(53, 197, 240, 0.55);
        box-shadow: 0 0 0 4px rgba(53, 197, 240, 0.12);
      }

      button {
        padding: 11px 14px;
        border-radius: 12px;
        border: 1px solid rgba(53, 197, 240, 0.35);
        background: rgba(53, 197, 240, 0.15);
        color: var(--text);
        cursor: pointer;
        transition:
          transform 120ms ease,
          background 120ms ease;
        white-space: nowrap;
      }

      button:hover {
        background: rgba(53, 197, 240, 0.22);
      }

      button:active {
        transform: translateY(1px);
      }

      .metaRow {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .status {
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.25);
      }

      .dot.ok {
        background: rgba(38, 208, 124, 0.85);
      }
      .dot.warn {
        background: rgba(255, 196, 46, 0.9);
      }
      .dot.err {
        background: rgba(255, 78, 78, 0.9);
      }

      .stage {
        margin-top: 16px;
        position: relative;
        border-radius: 26px;
        overflow: hidden;
        min-height: 62vh;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: var(--shadow-strong);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
      }

      .stageBg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        filter: saturate(1.05);
        transform: scale(1.02);
        pointer-events: none;
      }

      .stageBg.loading {
        background-image:
          linear-gradient(110deg, rgba(255, 255, 255, 0.08) 8%, rgba(255, 255, 255, 0.18) 18%, rgba(255, 255, 255, 0.08) 33%),
          linear-gradient(180deg, rgba(20, 24, 38, 0.9), rgba(10, 12, 20, 0.9));
        background-size:
          200% 100%,
          100% 100%;
        animation: shimmer 1.2s ease-in-out infinite;
      }

      .stageBg.ready {
        animation: none;
      }

      .stageBg.noimage {
        background-image:
          radial-gradient(180px 180px at 20% 10%, rgba(53, 197, 240, 0.15), transparent 60%),
          radial-gradient(260px 260px at 90% 20%, rgba(124, 92, 255, 0.18), transparent 60%),
          linear-gradient(180deg, rgba(10, 12, 20, 0.9), rgba(7, 9, 16, 0.98));
        animation: none;
      }

      @keyframes shimmer {
        0% {
          background-position:
            200% 0,
            0 0;
        }
        100% {
          background-position:
            -200% 0,
            0 0;
        }
      }

      .stageShade {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(8, 10, 16, 0.05) 0%, rgba(8, 10, 16, 0.35) 50%, rgba(8, 10, 16, 0.78) 100%);
        pointer-events: none;
      }

      .stageContent {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 62vh;
        padding: 18px;
      }

      .chipRow {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.2);
        color: rgba(255, 255, 255, 0.88);
        font-size: 12px;
        backdrop-filter: blur(6px);
      }

      .headline {
        margin: 10px 0 0;
        font-size: 22px;
        letter-spacing: -0.4px;
        line-height: 1.25;
      }

      .headline a {
        color: #ffffff;
        text-decoration: none;
      }

      .headline a:hover {
        text-decoration: underline;
        text-decoration-color: rgba(255, 255, 255, 0.65);
      }

      .byline {
        margin-top: 8px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.75);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .desc {
        margin: 10px 0 0;
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        display: block;
        overflow: visible;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 12px;
        margin-top: 10px;
      }

      .footer a {
        color: #ffffff;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      .pageFooter {
        width: var(--content-width);
        margin: 28px auto 0;
        padding: 0 0 26px;
        display: grid;
        gap: 22px;
      }

      .pageFooterCard {
        padding: 20px 22px;
        border-radius: 22px;
        border: 1px solid rgba(86, 134, 220, 0.22);
        background:
          radial-gradient(320px 180px at 0% 0%, rgba(52, 120, 255, 0.16), transparent 74%),
          radial-gradient(280px 180px at 100% 100%, rgba(74, 213, 255, 0.12), transparent 72%),
          linear-gradient(180deg, #08152f 0%, #071126 100%);
        box-shadow:
          0 18px 36px rgba(10, 26, 60, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .pageFooterCardTitle {
        margin: 0;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #f3f8ff;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .pageFooterCardTitle::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: radial-gradient(circle at 35% 35%, #8fdcff, #4e7dff 62%, #2144bf 100%);
        box-shadow: 0 0 0 4px rgba(91, 141, 255, 0.12);
      }

      .pageFooterCardDesc {
        margin: 14px 0 0;
        color: rgba(214, 228, 250, 0.84);
        font-size: 13px;
        line-height: 1.72;
      }

      .pageFooterChips {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pageFooterLinks {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid rgba(130, 167, 232, 0.16);
      }

      .pageFooterLinksTitle {
        margin: 0 0 10px;
        color: rgba(243, 248, 255, 0.96);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .pageFooterLinkList {
        margin: 0;
        padding-left: 18px;
        display: grid;
        gap: 7px;
        color: rgba(214, 228, 250, 0.78);
        font-size: 12px;
        line-height: 1.55;
      }

      .pageFooterLinkList a {
        color: rgba(231, 241, 255, 0.94);
        text-decoration: none;
        overflow-wrap: anywhere;
      }

      .pageFooterLinkList a:hover {
        text-decoration: underline;
      }

      .pageFooterBrand .pageFooterLinks {
        width: min(100%, 920px);
        margin-top: 0;
        padding-top: 14px;
        border-top: 1px solid rgba(84, 102, 136, 0.16);
        text-align: left;
      }

      .pageFooterBrand .pageFooterLinksTitle {
        color: #213c68;
      }

      .pageFooterBrand .pageFooterLinkList {
        color: rgba(58, 75, 106, 0.82);
      }

      .pageFooterBrand .pageFooterLinkList a {
        color: #2a5c95;
      }

      .pageFooterChip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 11px;
        border-radius: 8px;
        border: 1px solid rgba(130, 167, 232, 0.18);
        background: rgba(134, 172, 255, 0.08);
        color: rgba(225, 237, 255, 0.92);
        font-size: 12px;
        letter-spacing: 0.01em;
      }

      .pageFooterBrand {
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
      }

      .pageFooterBrandTitle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #213c68;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .pageFooterBrandTitle::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: radial-gradient(circle at 35% 35%, #6fbaff, #3b73ff 72%, #1f47ca 100%);
        box-shadow: 0 0 16px rgba(62, 125, 255, 0.42);
      }

      .pageFooterBadgeRow {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .pageFooterTag {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 42px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid rgba(101, 133, 196, 0.16);
        background:
          linear-gradient(180deg, rgba(15, 31, 61, 0.96), rgba(11, 22, 46, 0.98)),
          linear-gradient(135deg, rgba(78, 141, 255, 0.14), rgba(98, 209, 255, 0.12));
        color: #f6fbff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.01em;
        box-shadow:
          0 10px 22px rgba(14, 33, 70, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .pageFooterTagMark {
        color: #78d7ff;
        font-size: 14px;
        line-height: 1;
      }

      .pageFooterTagBrand {
        color: #ffffff;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .pageFooterDivider {
        color: rgba(74, 100, 145, 0.42);
        font-size: 15px;
      }

      .pageFooterCopyright {
        color: rgba(84, 102, 136, 0.86);
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .pageFooter {
          gap: 18px;
        }

        .pageFooterCard {
          padding: 16px 16px;
        }

        .pageFooterCardTitle {
          font-size: 14px;
        }

        .pageFooterCardDesc,
        .pageFooterChip,
        .pageFooterTag,
        .pageFooterCopyright {
          font-size: 11px;
        }

        .pageFooterTag {
          min-height: 38px;
          padding: 0 14px;
        }
      }

      .noImageBadge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.45);
        color: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.18);
        font-size: 12px;
        margin-top: 10px;
        backdrop-filter: blur(6px);
      }

      .navBtn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 3;
        width: 42px;
        height: 42px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 20px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        touch-action: manipulation;
      }

      .navBtn:hover {
        background: rgba(0, 0, 0, 0.5);
      }
      .navPrev {
        left: 12px;
      }
      .navNext {
        right: 12px;
      }

      .counter {
        position: absolute;
        right: 12px;
        top: 12px;
        z-index: 3;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        color: rgba(255, 255, 255, 0.9);
        font-size: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(6px);
      }

      .stage.hotList {
        min-height: 72vh;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .hotHeader {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 10px;
        padding: 4px 2px 0;
      }

      .hotTitle {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        letter-spacing: -0.25px;
      }

      .hotSub {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .hotScroller {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-right: 2px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scroll-snap-type: y proximity;
      }

      .hotCard {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 12px;
        padding: 10px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
        scroll-snap-align: start;
      }

      .hotThumb {
        position: relative;
        min-height: 132px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background-size: cover;
        background-position: center;
      }

      .hotThumbFallback {
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.82);
        font-size: 12px;
        background:
          radial-gradient(190px 120px at 0% 0%, rgba(53, 197, 240, 0.26), transparent 70%),
          linear-gradient(150deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03));
      }

      .hotRank {
        position: absolute;
        left: 8px;
        top: 8px;
        z-index: 2;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.26);
      }

      .hotBody {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .hotHeadline {
        margin: 0;
        font-size: 16px;
        line-height: 1.33;
        letter-spacing: -0.2px;
      }

      .hotHeadline a {
        color: #fff;
        text-decoration: none;
      }

      .hotHeadline a:hover {
        text-decoration: underline;
        text-decoration-color: rgba(255, 255, 255, 0.68);
      }

      .hotMeta {
        margin-top: 7px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        color: rgba(255, 255, 255, 0.74);
        font-size: 12px;
      }

      .hotMetric {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.3);
        color: rgba(255, 255, 255, 0.9);
      }

      .hotDesc {
        margin: 7px 0 0;
        color: rgba(255, 255, 255, 0.88);
        font-size: 13px;
        display: block;
        overflow: visible;
      }

      .hotCats {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .hotCard .pill {
        font-size: 11px;
        padding: 4px 8px;
      }

      @media (max-width: 700px) {
        .hotCard {
          grid-template-columns: 148px minmax(0, 1fr);
          gap: 10px;
        }
        .hotThumb {
          min-height: 110px;
        }
        .hotHeadline {
          font-size: 15px;
        }
      }

      .note {
        margin-top: 14px;
        padding: 12px 12px;
        border-radius: 12px;
        border: 1px dashed rgba(255, 255, 255, 0.18);
        color: var(--muted);
        font-size: 12px;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.95em;
        color: rgba(232, 236, 255, 0.9);
      }

      /* Trend UI overrides */
      @import url("https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap");

      body {
        font-family: "Sora", "Noto Sans KR", "Segoe UI", sans-serif;
        background:
          radial-gradient(900px 500px at 0% 0%, rgba(253, 181, 102, 0.24), transparent 68%),
          radial-gradient(720px 460px at 100% 0%, rgba(60, 181, 205, 0.2), transparent 66%),
          linear-gradient(180deg, #f3f0e9 0%, #f7f6f4 100%);
        color: #1d2128;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      body::before {
        background-image: radial-gradient(rgba(14, 22, 36, 0.06) 1px, transparent 1px);
        background-size: 22px 22px;
        opacity: 0.18;
      }

      body::after {
        background:
          radial-gradient(380px 200px at 8% 18%, rgba(255, 177, 100, 0.24), transparent 70%),
          radial-gradient(320px 180px at 92% 22%, rgba(67, 157, 210, 0.2), transparent 72%);
        animation: auraShift 12s ease-in-out infinite alternate;
      }

      @keyframes auraShift {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        100% {
          transform: translate3d(0, -14px, 0) scale(1.05);
        }
      }

      .blogShell {
        width: min(1060px, 92vw);
        margin: 28px auto 50px;
        position: relative;
        z-index: 1;
      }

      .heroSection {
        max-width: none;
        margin: 0;
        padding: 0;
      }

      .heroThumb {
        position: relative;
        border-radius: 28px;
        overflow: hidden;
        min-height: 320px;
        border: 1px solid rgba(19, 20, 24, 0.2);
        background:
          radial-gradient(760px 360px at -6% -8%, rgba(255, 178, 109, 0.58), transparent 66%),
          radial-gradient(760px 380px at 102% 120%, rgba(88, 188, 210, 0.38), transparent 70%),
          linear-gradient(130deg, #171a22 0%, #2a2f39 45%, #1d2f43 100%);
        box-shadow:
          0 30px 70px rgba(18, 27, 45, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        animation: heroIntro 700ms cubic-bezier(0.2, 0.9, 0.18, 1) both;
      }

      @keyframes heroIntro {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .heroThumb::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.24);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .heroShade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(120deg, rgba(0, 0, 0, 0.62) 8%, rgba(0, 0, 0, 0.18) 54%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.45));
      }

      .heroContent {
        position: relative;
        z-index: 1;
        padding: 30px 34px;
        color: #fff;
      }

      .heroKicker {
        margin: 0;
        letter-spacing: 1.3px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        opacity: 0.92;
      }

      .heroContent h1 {
        margin: 11px 0 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(40px, 6vw, 76px);
        line-height: 0.92;
        letter-spacing: -1.3px;
      }

      .heroDesc {
        margin: 16px 0 0;
        max-width: 560px;
        font-size: 15px;
        color: rgba(255, 255, 255, 0.92);
      }

      .heroThumb {
        position: relative;
        width: var(--content-width);
        margin-inline: auto;
        min-height: 430px;
        isolation: isolate;
        overflow: hidden;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        background:
          linear-gradient(rgba(12, 22, 42, 0.12), rgba(12, 22, 42, 0.12)),
          linear-gradient(128deg, #f4f7fc 0%, #ffffff 100%);
        background-repeat: no-repeat;
        background-size: cover, cover;
        background-position: center, center;
        background-blend-mode: normal, normal;
        background-clip: padding-box;
        filter: none;
        box-shadow: none;
      }

      .heroThumb::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: transparent;
        opacity: 0.28;
        pointer-events: none;
        animation: heroGloss 16s ease-in-out infinite;
        mix-blend-mode: normal;
      }

      @keyframes heroGloss {
        0% {
          transform: translateX(-8px) translateY(0px) scale(1);
          opacity: 0.22;
        }
        50% {
          transform: translateX(8px) translateY(4px) scale(1.01);
          opacity: 0.35;
        }
        100% {
          transform: translateX(-8px) translateY(0px) scale(1);
          opacity: 0.22;
        }
      }

      @keyframes heroGrain {
        0% {
          background-position: 0 0, 0 0;
        }
        100% {
          background-position: 38px 38px, 20px 20px;
        }
      }

      .heroThumb::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background:
          radial-gradient(circle at 15% 16%, rgba(255, 255, 255, 0.05), transparent 42%),
          radial-gradient(circle at 88% 84%, rgba(93, 214, 255, 0.06), transparent 48%);
        opacity: 0.1;
        background-size: auto, auto;
        mix-blend-mode: normal;
        animation: heroGrain 6.5s steps(2) infinite;
      }

      .heroShade {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
        background:
          linear-gradient(120deg, rgba(11, 24, 49, 0.06) 10%, rgba(36, 14, 63, 0.09) 54%, rgba(8, 16, 34, 0.22) 100%),
          linear-gradient(180deg, rgba(4, 9, 21, 0.01), rgba(4, 9, 21, 0.16) 72%, rgba(19, 30, 58, 0.28)),
          radial-gradient(circle at 84% 18%, rgba(255, 117, 211, 0.2), transparent 45%);
        backdrop-filter: blur(0.6px);
      }

      .heroShade::after {
        content: "";
        position: absolute;
        inset: -20%;
        border-radius: inherit;
        background:
          radial-gradient(500px 220px at 22% 38%, rgba(255, 255, 255, 0.18), transparent 62%),
          radial-gradient(620px 260px at 82% 66%, rgba(120, 214, 255, 0.16), transparent 64%);
        mix-blend-mode: soft-light;
        opacity: 0.32;
        animation: heroSweep 14s linear infinite;

          transform: translate3d(2%, 1%, 0) rotate(1.4deg);

        100% {
          transform: translate3d(-2%, -1%, 0) rotate(0deg);
        }
      }

      function classifyAiCardError(error) {

      function normalizeArticleBodyText(text, maxChars = 3600) {
        return decodeHtmlEntitiesText(text || "")

          .split(/(?<=[.!?。！？])\s+|(?<=다\.)\s+|(?<=니다\.)\s+|(?<=했다\.)\s+/)

      function buildArticleLeadSummaryText(bodyText, titleText, lang = currentLang) {
        const clean = normalizeArticleBodyText(bodyText, lang === "en" ? 900 : 700);

      async function fetchArticleBodyFromBackend(item) {
        const params = new URLSearchParams({

        const res = await fetchWithTimeout(`${BACKEND_ARTICLE_BODY_API}?${params.toString()}`, { method: "GET", cache: "no-store" }, NETWORK_FETCH_TIMEOUT_MS);
        if (!res.ok) {
          let details = "";
          try {
            const errJson = await res.json();
            details = String(errJson?.error || "").trim();
          } catch (e) {
            details = await res.text().catch(() => "");
          }
          throw new Error(`ARTICLE_HTTP_${res.status}${details ? `:${details}` : ""}`);
        }
        const json = await res.json();
        return {
          bodyText: normalizeArticleBodyText(json?.bodyText || "", 4200),
          summaryText: normalizeArticleBodyText(json?.summary || "", 600),
        };

      async function ensureArticleBodyTextForItem(item) {

          item.__articleBodyText = nextBody;

          return false;
        }

      async function prefetchArticleBodiesForSourceItems(items = [], sourceKey = "", limit = 18) {
        const key = String(sourceKey || "").trim();
        if (!key) return false;
        const pool = dedupeByGuidOrLink(
          (Array.isArray(items) ? items : [])
            .filter((it) => String(it?.sourceFeed || key).trim() === key)
            .filter((it) => shouldFetchArticleBodyForItem({ ...it, sourceFeed: key }))
            .sort((a, b) => {
              const launchDelta = getLaunchPriorityScore(b) - getLaunchPriorityScore(a);
              if (launchDelta !== 0) return launchDelta;
              return toDateMs(b?.pubDate || "") - toDateMs(a?.pubDate || "");
            })
            .slice(0, Math.max(1, Number(limit) || 18)),
        );
        if (!pool.length) return false;

        let changed = false;
        let cursor = 0;
        const concurrency = Math.max(1, Math.min(3, pool.length));
        const worker = async () => {
          while (cursor < pool.length) {
            const idx = cursor++;
            const item = pool[idx];
            if (!item) continue;
            const updated = await ensureArticleBodyTextForItem(item);
            const sourceLang = key === "aitimes_industry" ? "ko" : "en";
            const leadSummary = buildArticleLeadSummaryText(item.__articleBodyText || "", item.title || "", sourceLang);
            if (leadSummary && (!item.summaryText || item.summaryText.length < (sourceLang === "en" ? 140 : 80))) {
              item.summaryText = leadSummary;
              changed = true;
              continue;
            }
            if (updated) changed = true;
          }
        };
        await Promise.allSettled(Array.from({ length: concurrency }, () => worker()));
        return changed;
      }

      function extractInsightSubject(titleText, lang = currentLang) {
        const cleaned = decodeHtmlEntitiesText(titleText || "")
          .replace(/\s+/g, " ")
          .replace(/\s+[|｜]\s+.*$/g, "")
          .trim();

        let subject =
          cleaned
            .split(/\s*[:：]\s*|\s+-\s+|,\s+/)
            .map((part) => part.trim())
            .find(Boolean) || cleaned;
        if (lang !== "en") {

        const maxChars = lang === "en" ? 44 : 24;
        if (subject.length > maxChars) subject = `${subject.slice(0, maxChars).trim()}...`;

      async function fetchAiSummaryFromBackend(titleText, summaryText, bodyText = "", lang = currentLang, provider = currentAiProvider) {
        const payload = {
          title: decodeHtmlEntitiesText(titleText || "").replace(/\s+/g, " ").trim().slice(0, 240),
          summary: decodeHtmlEntitiesText(summaryText || "").replace(/\s+/g, " ").trim().slice(0, 420),
          bodyText: normalizeArticleBodyText(bodyText || "", 520),
          lang: lang === "en" ? "en" : "ko",
          provider: normalizeAiProvider(provider),
        };
        const res = await fetchWithTimeout(
          BACKEND_SUMMARY_API,
          {
            method: "POST",
            cache: "no-store",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          },
          TRANSLATE_FETCH_TIMEOUT_MS,
        );
        if (!res.ok) {
          let details = "";
          try {
            const errJson = await res.json();
            details = String(errJson?.error || "").trim();
          } catch (e) {
            details = await res.text().catch(() => "");
          }
          throw new Error(`SUMMARY_HTTP_${res.status}${details ? `:${details}` : ""}`);
        }
        const json = await res.json();
        const qualityScore = Number(json?.qualityScore);
        return {
          summary: decodeHtmlEntitiesText(json?.summary || "").replace(/\s+/g, " ").trim(),
          source: String(json?.source || "").trim(),
          provider: String(json?.provider || "").trim(),
          model: String(json?.model || "").trim(),
          qualityScore: Number.isFinite(qualityScore) ? qualityScore : Number.NaN,
          shouldSkip: Boolean(json?.shouldSkip),
          usedFallback: Boolean(json?.usedFallback),
        };
      }

      async function fetchAiInsightFromBackend(titleText, summaryText, bodyText = "", lang = currentLang, provider = currentAiProvider) {
        const payload = {
          title: decodeHtmlEntitiesText(titleText || "").replace(/\s+/g, " ").trim().slice(0, 240),
          summary: decodeHtmlEntitiesText(summaryText || "").replace(/\s+/g, " ").trim().slice(0, 420),
          bodyText: normalizeArticleBodyText(bodyText || "", 520),
          lang: lang === "en" ? "en" : "ko",
          provider: normalizeAiProvider(provider),
        };
        const res = await fetchWithTimeout(
          BACKEND_INSIGHT_API,
          {
            method: "POST",
            cache: "no-store",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          },
          TRANSLATE_FETCH_TIMEOUT_MS,
        );
        if (!res.ok) {
          let details = "";
          try {
            const errJson = await res.json();
            details = String(errJson?.error || "").trim();
          } catch (e) {
            details = await res.text().catch(() => "");
          }
          throw new Error(`INSIGHT_HTTP_${res.status}${details ? `:${details}` : ""}`);
        }
        const json = await res.json();
        return decodeHtmlEntitiesText(json?.insight || "").replace(/\s+/g, " ").trim();
      }

      async function ensureAiCardTextsForItem(item, lang = currentLang, provider = currentAiProvider) {
        if (!item || !USE_BACKEND) return false;
        const requestedProvider = normalizeAiProvider(provider);
        ensureCurrentAiSummaryEpoch(item, requestedProvider);
        const requestedLang = lang === "en" ? "en" : "ko";
        const sourceFeedKey = String(item?.sourceFeed || "").trim();
        const sourceTitleRaw = decodeHtmlEntitiesText(item?.title || "").trim();
        const isKoreanSourceItem = sourceFeedKey === "aitimes_industry" || /[가-힣]/.test(sourceTitleRaw);
        // Korean sources: KO first then EN translation. Others: EN first then KO translation.
        const fetchLang = isKoreanSourceItem ? "ko" : "en";
        const mirrorLang = fetchLang === "ko" ? "en" : "ko";
        let changed = false;
        const articleBodyUpdated = await ensureArticleBodyTextForItem(item);
        if (articleBodyUpdated) {
          clearAiCardText(item, "__aiSummary", requestedProvider, "en");
          clearAiCardText(item, "__aiSummary", requestedProvider, "ko");
          clearAiCardText(item, "__aiInsight", requestedProvider, "en");
          clearAiCardText(item, "__aiInsight", requestedProvider, "ko");
          clearAiCardText(item, "__aiSummaryError", requestedProvider, "en");
          clearAiCardText(item, "__aiSummaryError", requestedProvider, "ko");
          clearAiCardText(item, "__aiInsightError", requestedProvider, "en");
          clearAiCardText(item, "__aiInsightError", requestedProvider, "ko");
          clearAiCardText(item, "__aiSummaryQuality", requestedProvider, "en");
          clearAiCardText(item, "__aiSummarySkip", requestedProvider, "en");
          clearAiCardText(item, "__aiSummaryFallbackPreferred", requestedProvider, "en");
          clearAiCardText(item, "__aiSummaryUsedFallback", requestedProvider, "en");
          clearAiCardMetaGlobal(item, "__aiSummaryQuality", requestedProvider);
          clearAiCardMetaGlobal(item, "__aiSummarySkip", requestedProvider);
          clearAiCardMetaGlobal(item, "__aiSummaryFallbackPreferred", requestedProvider);
          clearAiCardMetaGlobal(item, "__aiSummaryUsedFallback", requestedProvider);
          changed = true;
        }
        const { titleText, summaryText, bodyText } = buildAiCardRequestText(item, fetchLang);
        if (!titleText && !summaryText && !bodyText) return false;

        // Base-language AI summary exists: populate mirror language by translation.
        let nextSummary = getAiCardText(item, "__aiSummary", requestedProvider, fetchLang);
        if (nextSummary && isNoisySummaryText(nextSummary)) {
          clearAiCardText(item, "__aiSummary", requestedProvider, fetchLang);
          clearAiCardText(item, "__aiSummary", requestedProvider, mirrorLang);
          setAiCardMeta(item, "__aiSummaryError", "offtopic", requestedProvider, fetchLang);
          nextSummary = "";
          changed = true;
        }
        if (
          nextSummary &&
          (!STRICT_API_SUMMARY_ONLY || mirrorLang === requestedLang) &&
          !hasAiCardText(item, "__aiSummary", requestedProvider, mirrorLang)
        ) {
          try {
            if (mirrorLang === "ko") {
              const translatedKo = await translateTextToKo(nextSummary, "summary");
              if (translatedKo && isReliableKoreanText(translatedKo, 10)) {
                const polishedKo = proofreadKoreanSummaryText(stylizeKoreanSummaryText(translatedKo, titleText) || translatedKo) || translatedKo;
                setAiCardText(item, "__aiSummary", polishedKo, requestedProvider, "ko");
                changed = true;
              }
            } else {
              const translatedEn = await translateTextToEn(nextSummary, "summary");
              if (translatedEn && isReliableEnglishText(translatedEn, 18) && !/[가-힣]/.test(translatedEn)) {
                const polishedEn = proofreadEnglishSummaryText(translatedEn, titleText) || translatedEn;
                setAiCardText(item, "__aiSummary", polishedEn, requestedProvider, "en");
                changed = true;
              }
            }
          } catch (_e) {}
        }
        nextSummary =
          getAiCardText(item, "__aiSummary", requestedProvider, fetchLang) ||
          getAiCardText(item, "__aiSummary", requestedProvider, requestedLang);
        if (
          !hasAiCardText(item, "__aiSummary", requestedProvider, fetchLang) ||
          (!hasAiCardText(item, "__aiSummaryQuality", requestedProvider, fetchLang) &&
            !getAiCardMetaGlobal(item, "__aiSummaryQuality", requestedProvider))
        ) {
          try {
            const generatedSummaryResult = await fetchAiSummaryFromBackend(titleText, summaryText, bodyText, fetchLang, requestedProvider);
            const generatedSummaryRaw = decodeHtmlEntitiesText(generatedSummaryResult?.summary || "").replace(/\s+/g, " ").trim();
            const generatedSummary = stripSummaryNoiseText(generatedSummaryRaw);
            const isAiTimesSource = String(item?.sourceFeed || "").trim() === "aitimes_industry";
            const generatedQuality = Number(generatedSummaryResult?.qualityScore);
            const qualityScore = Number.isFinite(generatedQuality) ? generatedQuality : Number.NaN;
            const isAiGeneratedSummary =
              String(generatedSummaryResult?.source || "").trim().toLowerCase() === "ai" &&
              !Boolean(generatedSummaryResult?.usedFallback);
            const lowQualitySkip =
              !isAiGeneratedSummary ||
              Boolean(generatedSummaryResult?.shouldSkip) ||
              (Number.isFinite(qualityScore) && qualityScore < AI_SUMMARY_MIN_QUALITY_SCORE);
            const fallbackPreferredRaw =
              Number.isFinite(qualityScore) &&
              qualityScore >= Math.max(40, AI_SUMMARY_MIN_QUALITY_SCORE - 15) &&
              qualityScore < AI_SUMMARY_MIN_QUALITY_SCORE;
            const fallbackPreferred = !isAiTimesSource && fallbackPreferredRaw;

            setAiCardMeta(item, "__aiSummaryQuality", Number.isFinite(qualityScore) ? String(Math.round(qualityScore)) : "", requestedProvider, fetchLang);
            setAiCardMeta(item, "__aiSummarySkip", lowQualitySkip ? "1" : "", requestedProvider, fetchLang);
            setAiCardMeta(
              item,
              "__aiSummaryFallbackPreferred",
              !lowQualitySkip && fallbackPreferred ? "1" : "",
              requestedProvider,
              fetchLang,
            );
            setAiCardMeta(
              item,
              "__aiSummaryUsedFallback",
              generatedSummaryResult?.usedFallback ? "1" : "",
              requestedProvider,
              fetchLang,
            );
            setAiCardMetaGlobal(
              item,
              "__aiSummaryQuality",
              Number.isFinite(qualityScore) ? String(Math.round(qualityScore)) : "",
              requestedProvider,
              false,
            );
            setAiCardMetaGlobal(item, "__aiSummarySkip", lowQualitySkip ? "1" : "", requestedProvider, false);
            setAiCardMetaGlobal(
              item,
              "__aiSummaryFallbackPreferred",
              !lowQualitySkip && fallbackPreferred ? "1" : "",
              requestedProvider,
              false,
            );
            setAiCardMetaGlobal(
              item,
              "__aiSummaryUsedFallback",
              generatedSummaryResult?.usedFallback ? "1" : "",
              requestedProvider,
              false,
            );

            if (lowQualitySkip) {
              setAiCardText(item, "__aiSummary", "", requestedProvider, fetchLang);
              setAiCardText(item, "__aiSummary", "", requestedProvider, mirrorLang);
              setAiCardMeta(item, "__aiSummaryError", "skip", requestedProvider, fetchLang);
              changed = true;
              return changed;
            }

            if (fallbackPreferred) {
              setAiCardText(item, "__aiSummary", "", requestedProvider, fetchLang);
              setAiCardText(item, "__aiSummary", "", requestedProvider, mirrorLang);
              setAiCardMeta(item, "__aiSummaryError", "fallback_preferred", requestedProvider, fetchLang);
              changed = true;
              return changed;
            }

            const generatedHasHangul = /[가-힣]/.test(generatedSummary || "");
            const generatedLooksEnglish =
              !generatedHasHangul && isReliableEnglishText(generatedSummary || "", 18) && !isWeakGeneratedSummary(generatedSummary, "en");
            const generatedLooksKorean =
              generatedHasHangul && isReliableKoreanText(generatedSummary || "", 10) && !isWeakGeneratedSummary(generatedSummary, "ko");
            const languageValid =
              (fetchLang === "en" ? generatedLooksEnglish : generatedLooksKorean) && !isNoisySummaryText(generatedSummary);
            if (
              generatedSummary &&
              languageValid &&
              !isSummarySameAsTitle(generatedSummary, titleText) &&
              !isWeakGeneratedSummary(generatedSummary, fetchLang)
            ) {
              if (fetchLang === "en") {
                const polishedEn = proofreadEnglishSummaryText(generatedSummary, titleText) || generatedSummary;
                setAiCardText(item, "__aiSummary", polishedEn, requestedProvider, "en");
                item.__apiCardSummaryEn = polishedEn;
                item.cardSummaryEn = polishedEn;
                item.summaryEn = polishedEn;
                setAiCardMeta(item, "__aiSummaryError", "", requestedProvider, "en");
                nextSummary = polishedEn;
              } else {
                const polishedKo =
                  proofreadKoreanSummaryText(stylizeKoreanSummaryText(generatedSummary, titleText) || generatedSummary) ||
                  generatedSummary;
                setAiCardText(item, "__aiSummary", polishedKo, requestedProvider, "ko");
                item.__apiCardSummaryKo = polishedKo;
                item.cardSummaryKo = polishedKo;
                item.summaryKo = polishedKo;
                setAiCardMeta(item, "__aiSummaryError", "", requestedProvider, "ko");
                nextSummary = polishedKo;
              }
              if (!STRICT_API_SUMMARY_ONLY || mirrorLang === requestedLang) {
                try {
                  if (mirrorLang === "ko") {
                    const translatedKo = await translateTextToKo(nextSummary, "summary");
                    if (translatedKo && isReliableKoreanText(translatedKo, 10)) {
                      const polishedKo = proofreadKoreanSummaryText(stylizeKoreanSummaryText(translatedKo, titleText) || translatedKo) || translatedKo;
                      setAiCardText(item, "__aiSummary", polishedKo, requestedProvider, "ko");
                    }
                  } else {
                    const translatedEn = await translateTextToEn(nextSummary, "summary");
                    if (translatedEn && isReliableEnglishText(translatedEn, 18) && !/[가-힣]/.test(translatedEn)) {
                      const polishedEn = proofreadEnglishSummaryText(translatedEn, titleText) || translatedEn;
                      setAiCardText(item, "__aiSummary", polishedEn, requestedProvider, "en");
                    }
                  }
                } catch (_e) {}
              }
              changed = true;
            } else {
              setAiCardText(item, "__aiSummary", "", requestedProvider, fetchLang);
              setAiCardText(item, "__aiSummary", "", requestedProvider, mirrorLang);
              const errorKind = !generatedSummary ? "empty" : languageValid ? "short" : "offtopic";
              setAiCardMeta(item, "__aiSummaryError", errorKind, requestedProvider, fetchLang);
              changed = true;
            }
          } catch (e) {
            console.warn("[AI summary fallback]", requestedProvider, requestedLang, String(e?.message || e));
            setAiCardText(item, "__aiSummary", "", requestedProvider, fetchLang);
            setAiCardText(item, "__aiSummary", "", requestedProvider, mirrorLang);
            setAiCardMeta(item, "__aiSummaryError", classifyAiCardError(e), requestedProvider, fetchLang);
            setAiCardMeta(item, "__aiSummaryQuality", "", requestedProvider, fetchLang);
            setAiCardMeta(item, "__aiSummarySkip", "", requestedProvider, fetchLang);
            setAiCardMeta(item, "__aiSummaryFallbackPreferred", "", requestedProvider, fetchLang);
            setAiCardMeta(item, "__aiSummaryUsedFallback", "", requestedProvider, fetchLang);
            changed = true;
          }
        }

        if (DEV_INSIGHT_ENABLED && !hasAiCardText(item, "__aiInsight", requestedProvider, requestedLang)) {
          try {
            const insightSeed = nextSummary || summaryText;
            const generatedInsight = await fetchAiInsightFromBackend(titleText, insightSeed, bodyText, requestedLang, requestedProvider);
            const isUsableInsight =
              generatedInsight &&
              !isWeakGeneratedInsight(generatedInsight, requestedLang) &&
              !isInsightTooSimilarToSummary(generatedInsight, insightSeed, requestedLang) &&
              isInsightRelevantToContext(generatedInsight, item, titleText, insightSeed, requestedLang);
            if (isUsableInsight) {
              setAiCardText(item, "__aiInsight", generatedInsight, requestedProvider, requestedLang);
              setAiCardMeta(item, "__aiInsightError", "", requestedProvider, requestedLang);
              changed = true;
            } else {
              setAiCardText(item, "__aiInsight", "", requestedProvider, requestedLang);
              const errorKind = !generatedInsight
                ? "empty"
                : isWeakGeneratedInsight(generatedInsight, requestedLang)
                  ? "short"
                  : "offtopic";
              setAiCardMeta(item, "__aiInsightError", errorKind, requestedProvider, requestedLang);
              changed = true;
            }
          } catch (e) {
            console.warn("[AI insight fallback]", requestedProvider, requestedLang, String(e?.message || e));
            setAiCardText(item, "__aiInsight", "", requestedProvider, requestedLang);
            setAiCardMeta(item, "__aiInsightError", classifyAiCardError(e), requestedProvider, requestedLang);
            changed = true;
          }
        } else if (!DEV_INSIGHT_ENABLED && !hasAiCardText(item, "__aiInsight", requestedProvider, requestedLang)) {
          setAiCardText(item, "__aiInsight", "", requestedProvider, requestedLang);
          setAiCardMeta(item, "__aiInsightError", "disabled", requestedProvider, requestedLang);

      function hydrateAiCardTexts(filteredItems, sourceItems) {
        if (aiCardTextRefreshPending || !USE_BACKEND) return;
        const provider = normalizeAiProvider(currentAiProvider);
        const lang = currentLang === "en" ? "en" : "ko";
        (filteredItems || []).forEach((it) => ensureCurrentAiSummaryEpoch(it, provider));
        const hydrationLimit = STRICT_API_SUMMARY_ONLY
          ? HOT_LIMIT * 2
          : HOT_LIMIT;
        const targets = (filteredItems || []).slice(0, hydrationLimit).filter(
          (it) =>
            !hasAiCardText(it, "__aiSummary", provider, lang) ||
            (!hasAiCardText(it, "__aiSummaryQuality", provider, lang) &&
              !getAiCardMetaGlobal(it, "__aiSummaryQuality", provider)) ||
            (DEV_INSIGHT_ENABLED && !hasAiCardText(it, "__aiInsight", provider, lang)),
        );
        if (!targets.length) return;
        aiCardTextRefreshPending = true;

        const queue = targets.slice();
        const concurrency = 1;
        let cursor = 0;

        const worker = async () => {
          let changed = false;
          while (cursor < queue.length) {
            const idx = cursor++;
            const item = queue[idx];
            if (!item) continue;
            const updated = await ensureAiCardTextsForItem(item, lang, provider);
            if (updated) {
              changed = true;
              render(sourceItems);
            }
            if (cursor < queue.length) {
              await new Promise((resolve) => setTimeout(resolve, 1400));
            }
          }
          return changed;
        };

        Promise.allSettled(Array.from({ length: concurrency }, () => worker()))
          .then((results) => {
            const hasChanged = results.some((r) => r.status === "fulfilled" && r.value);
            if (hasChanged) render(sourceItems);
          })
          .finally(() => {
            aiCardTextRefreshPending = false;
          });
      }

      function isReliableEnglishText(value, minLetters = 6) {
        const text = decodeHtmlEntitiesText(value || "").replace(/\s+/g, " ").trim();
        if (!text) return false;
        if (isNoisySummaryText(text)) return false;
        if (/[가-힣]/.test(text)) return false;
        const letters = (text.match(/[A-Za-z]/g) || []).length;
        if (letters < Math.max(1, minLetters)) return false;
        const compactLen = text.replace(/\s+/g, "").length || 1;
        const ratio = letters / compactLen;
        if (ratio >= 0.18) return true;
        return /\b(ai|api|sdk|model|launch|release|update|feature|platform|technology|product|service)\b/i.test(text);

        if (isGenericEnglishFallbackSummaryText(summary, title)) return false;
        return isReliableEnglishText(title, 3) && isReliableEnglishText(summary, 14);

      async function fetchWithTimeout(url, options = {}, timeoutMs = NETWORK_FETCH_TIMEOUT_MS) {
        const controller = new AbortController();
        const safeTimeout = Math.max(1000, Number(timeoutMs) || NETWORK_FETCH_TIMEOUT_MS);
        const timer = setTimeout(() => controller.abort(), safeTimeout);
        try {
          const nextOptions = { ...(options || {}), signal: controller.signal };
          return await fetch(url, nextOptions);
        } finally {
          clearTimeout(timer);
        }
      }

      async function translateTextViaPublicGoogle(text, from = "auto", to = "ko") {
        const q = decodeHtmlEntitiesText(text || "")
          .replace(/\s+/g, " ")
          .trim();
        if (!q) return "";
        const params = new URLSearchParams({
          client: "gtx",
          sl: from || "auto",
          tl: to || "ko",
          dt: "t",
          q,
        });
        const url = `https://translate.googleapis.com/translate_a/single?${params.toString()}`;
        const res = await fetchWithTimeout(url, { method: "GET", cache: "no-store" }, TRANSLATE_FETCH_TIMEOUT_MS);
        if (!res.ok) throw new Error(`PUBLIC_TRANSLATE_HTTP_${res.status}`);
        const json = await res.json();
        if (!Array.isArray(json) || !Array.isArray(json[0])) return "";
        const translated = json[0]
          .map((part) => (Array.isArray(part) && typeof part[0] === "string" ? part[0] : ""))
          .join("")
          .trim();
        return decodeHtmlEntitiesText(translated || "");
      }

      async function translateTextToKo(text, kind) {
        const safeKind = kind === "title" ? "title" : "summary";
        const normalized = decodeHtmlEntitiesText(text)
          .replace(/\s+/g, " ")
          .trim();
        if (!normalized) return "";
        const clipped = normalized.slice(0, KO_TRANSLATE_MAX_TEXT);
        if (/[가-힣]/.test(clipped) && !/[A-Za-z]/.test(clipped)) return clipped;
        const from = /[A-Za-z]/.test(clipped) ? "en" : "auto";

        const cacheKey = makeKoTranslateCacheKey(clipped, safeKind);
        const cached = koTranslateCache.get(cacheKey);
        if (cached && cached !== clipped) {
          const hasHangul = /[가-힣]/.test(cached);
          if (hasHangul) return cached;
        }

        try {
          const params = new URLSearchParams({
            text: clipped,
            to: "ko",
            from,
            kind: safeKind,
          });
          const res = await fetchWithTimeout(
            `${BACKEND_TRANSLATE_API}?${params.toString()}`,
            { method: "GET", cache: "no-store" },
            TRANSLATE_FETCH_TIMEOUT_MS,
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const translated = decodeHtmlEntitiesText(json?.translated || clipped) || clipped;
          koTranslateCache.set(cacheKey, translated);
          return translated;
        } catch (e) {
          try {
            const translatedPublic = await translateTextViaPublicGoogle(clipped, from, "ko");
            if (translatedPublic && translatedPublic !== clipped) {
              koTranslateCache.set(cacheKey, translatedPublic);
              return translatedPublic;
            }
          } catch (_fallbackErr) {}
          return clipped;
        }
      }

      async function translateTextToEn(text, kind) {
        const safeKind = kind === "title" ? "title" : "summary";
        const normalized = decodeHtmlEntitiesText(text)
          .replace(/\s+/g, " ")
          .trim();
        if (!normalized) return "";
        const clipped = normalized.slice(0, KO_TRANSLATE_MAX_TEXT);
        if (/[A-Za-z]/.test(clipped) && !/[가-힣]/.test(clipped)) return clipped;
        const from = /[가-힣]/.test(clipped) ? "ko" : "auto";

        const cacheKey = makeEnTranslateCacheKey(clipped, safeKind);
        const cached = enTranslateCache.get(cacheKey);
        if (cached && isReliableEnglishText(cached, safeKind === "title" ? 3 : 12)) return cached;

        try {
          const params = new URLSearchParams({
            text: clipped,
            to: "en",
            from,
            kind: safeKind,
          });
          const res = await fetchWithTimeout(
            `${BACKEND_TRANSLATE_API}?${params.toString()}`,
            { method: "GET", cache: "no-store" },
            TRANSLATE_FETCH_TIMEOUT_MS,
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const translated = decodeHtmlEntitiesText(json?.translated || clipped) || clipped;
          if (isReliableEnglishText(translated, safeKind === "title" ? 3 : 12)) {
            enTranslateCache.set(cacheKey, translated);
            return translated;
          }
        } catch (e) {}

        try {
          const translatedPublic = await translateTextViaPublicGoogle(clipped, from, "en");
          if (isReliableEnglishText(translatedPublic, safeKind === "title" ? 3 : 12)) {
            enTranslateCache.set(cacheKey, translatedPublic);
            return translatedPublic;
          }
        } catch (e) {}
        return clipped;

          .map((v) => stripSummaryNoiseText(v || ""))

            .split(/(?<=[.!?])\s+|\n+/)

          (sourceItems || [])
            .filter((it) => !isBlockedCardSourceKey(it?.sourceFeed || ""))
            .filter((it) => !isNewsDigestCard(it) && !isPromotionalSelfPost(it) && !isSubjectiveStyleStory(it))
            .sort(compareItemsBySourceOrder),
        );
        return dedupeByGuidOrLink([...(relaxedPool || []), ...(loosePool || [])]);
      }

      function saveActiveSourcesToStorage() {

      function prioritizeAggregateSourceKeys(keys) {

        const valid = uniq.filter((k) => AGGREGATE_SOURCE_KEYS.includes(k));

      function getSelectedAggregateSourceKeys() {

      function getHotTitleText() {

      function formatHeroWeekLabel(meta) {
        if (!meta) return "";

      }

      function setHeroWeekLabel() {

        const meta = hotWeekMeta || fallbackMeta;
