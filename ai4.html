<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WEEKLY AI HOT 10</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #121625;
        --card: #151a2b;
        --text: #e8ecff;
        --muted: #a8b1d9;
        --border: rgba(255, 255, 255, 0.1);
        --accent: #35c5f0;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        --radius: 16px;
        --radius-sm: 12px;
        --glass: rgba(255, 255, 255, 0.08);
        --shadow-strong: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          "Noto Sans KR",
          Arial,
          "Apple SD Gothic Neo",
          "Malgun Gothic",
          sans-serif;
        background:
          radial-gradient(1200px 700px at 30% -10%, rgba(53, 197, 240, 0.18), transparent 55%),
          radial-gradient(900px 500px at 90% 10%, rgba(124, 92, 255, 0.12), transparent 55%), var(--bg);
        color: var(--text);
        line-height: 1.45;
      }

      header {
        padding: 20px 16px 8px;
        max-width: 640px;
        margin: 0 auto;
      }

      .title {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.2px;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 10px 16px 30px;
      }

      .panel {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 14px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        align-items: center;
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      select,
      input {
        width: 100%;
        padding: 11px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.18);
        color: var(--text);
        outline: none;
      }

      select:focus,
      input:focus {
        border-color: rgba(53, 197, 240, 0.55);
        box-shadow: 0 0 0 4px rgba(53, 197, 240, 0.12);
      }

      button {
        padding: 11px 14px;
        border-radius: 12px;
        border: 1px solid rgba(53, 197, 240, 0.35);
        background: rgba(53, 197, 240, 0.15);
        color: var(--text);
        cursor: pointer;
        transition:
          transform 120ms ease,
          background 120ms ease;
        white-space: nowrap;
      }

      button:hover {
        background: rgba(53, 197, 240, 0.22);
      }

      button:active {
        transform: translateY(1px);
      }

      .metaRow {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .status {
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.25);
      }

      .dot.ok {
        background: rgba(38, 208, 124, 0.85);
      }
      .dot.warn {
        background: rgba(255, 196, 46, 0.9);
      }
      .dot.err {
        background: rgba(255, 78, 78, 0.9);
      }

      .stage {
        margin-top: 16px;
        position: relative;
        border-radius: 26px;
        overflow: hidden;
        min-height: 62vh;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: var(--shadow-strong);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
      }

      .stageBg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        filter: saturate(1.05);
        transform: scale(1.02);
        pointer-events: none;
      }

      .stageBg.loading {
        background-image:
          linear-gradient(110deg, rgba(255, 255, 255, 0.08) 8%, rgba(255, 255, 255, 0.18) 18%, rgba(255, 255, 255, 0.08) 33%),
          linear-gradient(180deg, rgba(20, 24, 38, 0.9), rgba(10, 12, 20, 0.9));
        background-size:
          200% 100%,
          100% 100%;
        animation: shimmer 1.2s ease-in-out infinite;
      }

      .stageBg.ready {
        animation: none;
      }

      .stageBg.noimage {
        background-image:
          radial-gradient(180px 180px at 20% 10%, rgba(53, 197, 240, 0.15), transparent 60%),
          radial-gradient(260px 260px at 90% 20%, rgba(124, 92, 255, 0.18), transparent 60%),
          linear-gradient(180deg, rgba(10, 12, 20, 0.9), rgba(7, 9, 16, 0.98));
        animation: none;
      }

      @keyframes shimmer {
        0% {
          background-position:
            200% 0,
            0 0;
        }
        100% {
          background-position:
            -200% 0,
            0 0;
        }
      }

      .stageShade {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(8, 10, 16, 0.05) 0%, rgba(8, 10, 16, 0.35) 50%, rgba(8, 10, 16, 0.78) 100%);
        pointer-events: none;
      }

      .stageContent {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 62vh;
        padding: 18px;
      }

      .chipRow {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.2);
        color: rgba(255, 255, 255, 0.88);
        font-size: 12px;
        backdrop-filter: blur(6px);
      }

      .headline {
        margin: 10px 0 0;
        font-size: 22px;
        letter-spacing: -0.4px;
        line-height: 1.25;
      }

      .headline a {
        color: #ffffff;
        text-decoration: none;
      }

      .headline a:hover {
        text-decoration: underline;
        text-decoration-color: rgba(255, 255, 255, 0.65);
      }

      .byline {
        margin-top: 8px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.75);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .desc {
        margin: 10px 0 0;
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        display: block;
        overflow: visible;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 12px;
        margin-top: 10px;
      }

      .footer a {
        color: #ffffff;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      .pageFooter {
        width: var(--content-width);
        margin: 28px auto 0;
        padding: 0 0 26px;
        display: grid;
        gap: 22px;
      }

      .pageFooterCard {
        padding: 20px 22px;
        border-radius: 22px;
        border: 1px solid rgba(86, 134, 220, 0.22);
        background:
          radial-gradient(320px 180px at 0% 0%, rgba(52, 120, 255, 0.16), transparent 74%),
          radial-gradient(280px 180px at 100% 100%, rgba(74, 213, 255, 0.12), transparent 72%),
          linear-gradient(180deg, #08152f 0%, #071126 100%);
        box-shadow:
          0 18px 36px rgba(10, 26, 60, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .pageFooterCardTitle {
        margin: 0;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #f3f8ff;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .pageFooterCardTitle::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: radial-gradient(circle at 35% 35%, #8fdcff, #4e7dff 62%, #2144bf 100%);
        box-shadow: 0 0 0 4px rgba(91, 141, 255, 0.12);
      }

      .pageFooterCardDesc {
        margin: 14px 0 0;
        color: rgba(214, 228, 250, 0.84);
        font-size: 13px;
        line-height: 1.72;
      }

      .pageFooterChips {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pageFooterChip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 11px;
        border-radius: 8px;
        border: 1px solid rgba(130, 167, 232, 0.18);
        background: rgba(134, 172, 255, 0.08);
        color: rgba(225, 237, 255, 0.92);
        font-size: 12px;
        letter-spacing: 0.01em;
      }

      .pageFooterBrand {
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
      }

      .pageFooterBrandTitle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #213c68;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .pageFooterBrandTitle::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: radial-gradient(circle at 35% 35%, #6fbaff, #3b73ff 72%, #1f47ca 100%);
        box-shadow: 0 0 16px rgba(62, 125, 255, 0.42);
      }

      .pageFooterBadgeRow {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .pageFooterTag {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 42px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid rgba(101, 133, 196, 0.16);
        background:
          linear-gradient(180deg, rgba(15, 31, 61, 0.96), rgba(11, 22, 46, 0.98)),
          linear-gradient(135deg, rgba(78, 141, 255, 0.14), rgba(98, 209, 255, 0.12));
        color: #f6fbff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.01em;
        box-shadow:
          0 10px 22px rgba(14, 33, 70, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .pageFooterTagMark {
        color: #78d7ff;
        font-size: 14px;
        line-height: 1;
      }

      .pageFooterTagBrand {
        color: #ffffff;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .pageFooterDivider {
        color: rgba(74, 100, 145, 0.42);
        font-size: 15px;
      }

      .pageFooterCopyright {
        color: rgba(84, 102, 136, 0.86);
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .pageFooter {
          gap: 18px;
        }

        .pageFooterCard {
          padding: 16px 16px;
        }

        .pageFooterCardTitle {
          font-size: 14px;
        }

        .pageFooterCardDesc,
        .pageFooterChip,
        .pageFooterTag,
        .pageFooterCopyright {
          font-size: 11px;
        }

        .pageFooterTag {
          min-height: 38px;
          padding: 0 14px;
        }
      }

      .noImageBadge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.45);
        color: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.18);
        font-size: 12px;
        margin-top: 10px;
        backdrop-filter: blur(6px);
      }

      .navBtn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 3;
        width: 42px;
        height: 42px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 20px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        touch-action: manipulation;
      }

      .navBtn:hover {
        background: rgba(0, 0, 0, 0.5);
      }
      .navPrev {
        left: 12px;
      }
      .navNext {
        right: 12px;
      }

      .counter {
        position: absolute;
        right: 12px;
        top: 12px;
        z-index: 3;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        color: rgba(255, 255, 255, 0.9);
        font-size: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(6px);
      }

      .stage.hotList {
        min-height: 72vh;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .hotHeader {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 10px;
        padding: 4px 2px 0;
      }

      .hotTitle {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        letter-spacing: -0.25px;
      }

      .hotSub {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .hotScroller {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-right: 2px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scroll-snap-type: y proximity;
      }

      .hotCard {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 12px;
        padding: 10px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
        scroll-snap-align: start;
      }

      .hotThumb {
        position: relative;
        min-height: 132px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background-size: cover;
        background-position: center;
      }

      .hotThumbFallback {
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.82);
        font-size: 12px;
        background:
          radial-gradient(190px 120px at 0% 0%, rgba(53, 197, 240, 0.26), transparent 70%),
          linear-gradient(150deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03));
      }

      .hotRank {
        position: absolute;
        left: 8px;
        top: 8px;
        z-index: 2;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.26);
      }

      .hotBody {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .hotHeadline {
        margin: 0;
        font-size: 16px;
        line-height: 1.33;
        letter-spacing: -0.2px;
      }

      .hotHeadline a {
        color: #fff;
        text-decoration: none;
      }

      .hotHeadline a:hover {
        text-decoration: underline;
        text-decoration-color: rgba(255, 255, 255, 0.68);
      }

      .hotMeta {
        margin-top: 7px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        color: rgba(255, 255, 255, 0.74);
        font-size: 12px;
      }

      .hotMetric {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.3);
        color: rgba(255, 255, 255, 0.9);
      }

      .hotDesc {
        margin: 7px 0 0;
        color: rgba(255, 255, 255, 0.88);
        font-size: 13px;
        display: block;
        overflow: visible;
      }

      .hotCats {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .hotCard .pill {
        font-size: 11px;
        padding: 4px 8px;
      }

      @media (max-width: 700px) {
        .hotCard {
          grid-template-columns: 148px minmax(0, 1fr);
          gap: 10px;
        }
        .hotThumb {
          min-height: 110px;
        }
        .hotHeadline {
          font-size: 15px;
        }
      }

      .note {
        margin-top: 14px;
        padding: 12px 12px;
        border-radius: 12px;
        border: 1px dashed rgba(255, 255, 255, 0.18);
        color: var(--muted);
        font-size: 12px;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.95em;
        color: rgba(232, 236, 255, 0.9);
      }

      /* Trend UI overrides */
      @import url("https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap");

      body {
        font-family: "Sora", "Noto Sans KR", "Segoe UI", sans-serif;
        background:
          radial-gradient(900px 500px at 0% 0%, rgba(253, 181, 102, 0.24), transparent 68%),
          radial-gradient(720px 460px at 100% 0%, rgba(60, 181, 205, 0.2), transparent 66%),
          linear-gradient(180deg, #f3f0e9 0%, #f7f6f4 100%);
        color: #1d2128;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      body::before {
        background-image: radial-gradient(rgba(14, 22, 36, 0.06) 1px, transparent 1px);
        background-size: 22px 22px;
        opacity: 0.18;
      }

      body::after {
        background:
          radial-gradient(380px 200px at 8% 18%, rgba(255, 177, 100, 0.24), transparent 70%),
          radial-gradient(320px 180px at 92% 22%, rgba(67, 157, 210, 0.2), transparent 72%);
        animation: auraShift 12s ease-in-out infinite alternate;
      }

      @keyframes auraShift {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        100% {
          transform: translate3d(0, -14px, 0) scale(1.05);
        }
      }

      .blogShell {
        width: min(1060px, 92vw);
        margin: 28px auto 50px;
        position: relative;
        z-index: 1;
      }

      .heroSection {
        max-width: none;
        margin: 0;
        padding: 0;
      }

      .heroThumb {
        position: relative;
        border-radius: 28px;
        overflow: hidden;
        min-height: 320px;
        border: 1px solid rgba(19, 20, 24, 0.2);
        background:
          radial-gradient(760px 360px at -6% -8%, rgba(255, 178, 109, 0.58), transparent 66%),
          radial-gradient(760px 380px at 102% 120%, rgba(88, 188, 210, 0.38), transparent 70%),
          linear-gradient(130deg, #171a22 0%, #2a2f39 45%, #1d2f43 100%);
        box-shadow:
          0 30px 70px rgba(18, 27, 45, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        animation: heroIntro 700ms cubic-bezier(0.2, 0.9, 0.18, 1) both;
      }

      @keyframes heroIntro {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .heroThumb::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.24);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .heroShade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(120deg, rgba(0, 0, 0, 0.62) 8%, rgba(0, 0, 0, 0.18) 54%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.45));
      }

      .heroContent {
        position: relative;
        z-index: 1;
        padding: 30px 34px;
        color: #fff;
      }

      .heroKicker {
        margin: 0;
        letter-spacing: 1.3px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        opacity: 0.92;
      }

      .heroContent h1 {
        margin: 11px 0 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(40px, 6vw, 76px);
        line-height: 0.92;
        letter-spacing: -1.3px;
      }

      .heroDesc {
        margin: 16px 0 0;
        max-width: 560px;
        font-size: 15px;
        color: rgba(255, 255, 255, 0.92);
      }

      .heroPills {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .heroPill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.34);
        background: rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(8px);
      }

      .blogMain {
        max-width: none;
        padding: 18px 0 0;
      }

      .blogPanel {
        padding: 0;
        border: 0;
        box-shadow: none;
        background: transparent;
      }

      .metaLine {
        margin: 0 0 12px;
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 12px;
        color: #4f5662;
        border: 1px solid rgba(24, 31, 45, 0.11);
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(8px);
      }

      .srOnlyControls {
        display: none;
      }

      .stage {
        border: 0;
        border-radius: 0;
        overflow: visible;
        min-height: auto;
        box-shadow: none;
        background: transparent;
      }

      .stage.hotList {
        min-height: auto;
        padding: 0;
        gap: 12px;

      /* Neo Magazine refresh */
      body {
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(77, 226, 255, 0.2), transparent 60%),
          radial-gradient(900px 540px at 98% -12%, rgba(255, 142, 116, 0.22), transparent 62%),
          linear-gradient(180deg, #eef4ff 0%, #f7fbff 100%);

      .blogShell {
        --content-width: min(88%, 900px);
        width: min(1120px, 93vw);
        position: relative;
        z-index: 2;
      }

      .heroThumb {
        position: relative;
        width: var(--content-width);
        margin-inline: auto;
        min-height: 430px;
        isolation: isolate;
        overflow: hidden;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        background:
          linear-gradient(rgba(12, 22, 42, 0.12), rgba(12, 22, 42, 0.12)),
          linear-gradient(128deg, #f4f7fc 0%, #ffffff 100%);
        background-repeat: no-repeat;
        background-size: cover, cover;
        background-position: center, center;
        background-blend-mode: normal, normal;
        background-clip: padding-box;
        filter: none;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.46) inset,
          0 18px 36px rgba(10, 16, 34, 0.26),
          0 10px 22px rgba(47, 30, 95, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 -28px 48px rgba(3, 11, 32, 0.44);
      }

      .heroThumb::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: transparent;
        opacity: 0.28;
        pointer-events: none;
        animation: heroGloss 16s ease-in-out infinite;
        mix-blend-mode: normal;
      }

      @keyframes heroGloss {
        0% {
          transform: translateX(-8px) translateY(0px) scale(1);
          opacity: 0.22;
        }
        50% {
          transform: translateX(8px) translateY(4px) scale(1.01);
          opacity: 0.35;
        }
        100% {
          transform: translateX(-8px) translateY(0px) scale(1);
          opacity: 0.22;
        }
      }

      @keyframes heroGrain {
        0% {
          background-position: 0 0, 0 0;
        }
        100% {
          background-position: 38px 38px, 20px 20px;
        }
      }

      .heroThumb::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background:
          radial-gradient(circle at 15% 16%, rgba(255, 255, 255, 0.05), transparent 42%),
          radial-gradient(circle at 88% 84%, rgba(93, 214, 255, 0.06), transparent 48%);
        opacity: 0.1;
        background-size: auto, auto;
        mix-blend-mode: normal;
        animation: heroGrain 6.5s steps(2) infinite;
      }

      .heroShade {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
        background:
          linear-gradient(120deg, rgba(11, 24, 49, 0.06) 10%, rgba(36, 14, 63, 0.09) 54%, rgba(8, 16, 34, 0.22) 100%),
          linear-gradient(180deg, rgba(4, 9, 21, 0.01), rgba(4, 9, 21, 0.16) 72%, rgba(19, 30, 58, 0.28)),
          radial-gradient(circle at 84% 18%, rgba(255, 117, 211, 0.2), transparent 45%);
        backdrop-filter: blur(0.6px);
      }

      .heroShade::after {
        content: "";
        position: absolute;
        inset: -20%;
        border-radius: inherit;
        background:
          radial-gradient(500px 220px at 22% 38%, rgba(255, 255, 255, 0.18), transparent 62%),
          radial-gradient(620px 260px at 82% 66%, rgba(120, 214, 255, 0.16), transparent 64%);
        mix-blend-mode: soft-light;
        opacity: 0.32;
        animation: heroSweep 14s linear infinite;
        pointer-events: none;
      }

      @keyframes heroSweep {
        0% {
          transform: translate3d(-2%, -1%, 0) rotate(0deg);
        }
        50% {
          transform: translate3d(2%, 1%, 0) rotate(1.4deg);
        }
        100% {
          transform: translate3d(-2%, -1%, 0) rotate(0deg);
        }
      }

      .heroContent::before {
        display: none;
      }

      .heroContent {
        position: absolute;
        inset: 0;
        display: block;
        text-align: center;
        padding: 0 40px;

        overflow: hidden;

      function getAiSummaryQualityScore(item, provider = currentAiProvider, lang = currentLang) {

          if (Number.isFinite(globalScore)) return globalScore;
        }
        const raw = getAiCardMeta(item, "__aiSummaryQuality", provider, lang);
        if (!raw) return Number.NaN;

      function classifyAiCardError(error) {
        const message = String(error?.message || error || "");
        if (/(network_error|timeout_|HTTP_502|HTTP_504)/i.test(message)) return "network";
        if (/(api_key_missing|summary_model_missing|insight_model_missing|HTTP_503|HTTP_4\d\d)/i.test(message)) return "provider";
        if (message) return "unknown";

      function normalizeArticleBodyText(text, maxChars = 3600) {
        return decodeHtmlEntitiesText(text || "")
          .replace(/\u00a0/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, Math.max(1, maxChars));
      }

      function shouldFetchArticleBodyForItem(item) {
        if (!USE_BACKEND) return false;
        if (!item?.link) return false;
        return ARTICLE_BODY_SOURCE_KEYS.has(String(item?.sourceFeed || "").trim());
      }

      function splitArticleSentences(text) {
        return decodeHtmlEntitiesText(text || "")
          .replace(/\s+/g, " ")
          .trim()
          .split(/(?<=[.!?。！？])\s+|(?<=다\.)\s+|(?<=니다\.)\s+|(?<=했다\.)\s+/)
          .map((part) => part.trim())
          .filter((part) => part && part.length >= 24);
      }

      function buildArticleLeadSummaryText(bodyText, titleText, lang = currentLang) {
        const clean = normalizeArticleBodyText(bodyText, lang === "en" ? 900 : 700);
        if (!clean) return "";
        const sentences = splitArticleSentences(clean);
        if (sentences.length >= 2) {
          return sentences.slice(0, 2).join(" ");
        }
        const clipped = clean.slice(0, lang === "en" ? 320 : 220).trim();
        if (!clipped) return "";
        if (lang === "en") {
          return proofreadEnglishSummaryText(clipped, titleText) || clipped;
        }
        return proofreadKoreanSummaryText(stylizeKoreanSummaryText(clipped, titleText) || clipped) || clipped;
      }

      async function fetchArticleBodyFromBackend(item) {
        const params = new URLSearchParams({
          url: String(item?.link || "").trim(),
        });
        const res = await fetchWithTimeout(`${BACKEND_ARTICLE_BODY_API}?${params.toString()}`, { method: "GET", cache: "no-store" }, NETWORK_FETCH_TIMEOUT_MS);
        if (!res.ok) {
          let details = "";
          try {
            const errJson = await res.json();
            details = String(errJson?.error || "").trim();
          } catch (e) {
            details = await res.text().catch(() => "");
          }
          throw new Error(`ARTICLE_HTTP_${res.status}${details ? `:${details}` : ""}`);
        }
        const json = await res.json();
        return {
          bodyText: normalizeArticleBodyText(json?.bodyText || "", 4200),
          summaryText: normalizeArticleBodyText(json?.summary || "", 600),
        };
      }

      async function ensureArticleBodyTextForItem(item) {
        if (!shouldFetchArticleBodyForItem(item)) return false;
        if (item.__articleBodyLoaded) return false;
        item.__articleBodyLoaded = true;
        try {
          const article = await fetchArticleBodyFromBackend(item);
          const nextBody = normalizeArticleBodyText(article?.bodyText || "", 4200);
          const nextSummary = normalizeArticleBodyText(article?.summaryText || "", 600);
          const prevBody = normalizeArticleBodyText(item.__articleBodyText || "", 4200);
          item.__articleBodyText = nextBody;
          item.__articleBodySummary = nextSummary;
          item.__articleBodyError = "";
          return nextBody !== prevBody;
        } catch (e) {
          item.__articleBodyText = "";
          item.__articleBodySummary = "";
          item.__articleBodyError = classifyAiCardError(e) || "unknown";
          return false;
        }
      }

      async function prefetchArticleBodiesForSourceItems(items = [], sourceKey = "", limit = 18) {
        const key = String(sourceKey || "").trim();
        if (!key) return false;
        const pool = dedupeByGuidOrLink(
          (Array.isArray(items) ? items : [])
            .filter((it) => String(it?.sourceFeed || key).trim() === key)
            .filter((it) => shouldFetchArticleBodyForItem({ ...it, sourceFeed: key }))
            .sort((a, b) => {
              const launchDelta = getLaunchPriorityScore(b) - getLaunchPriorityScore(a);
              if (launchDelta !== 0) return launchDelta;
              return toDateMs(b?.pubDate || "") - toDateMs(a?.pubDate || "");
            })
            .slice(0, Math.max(1, Number(limit) || 18)),
        );
        if (!pool.length) return false;

        let changed = false;
        let cursor = 0;
        const concurrency = Math.max(1, Math.min(3, pool.length));
        const worker = async () => {
          while (cursor < pool.length) {
            const idx = cursor++;
            const item = pool[idx];
            if (!item) continue;
            const updated = await ensureArticleBodyTextForItem(item);
            const sourceLang = key === "aitimes_industry" ? "ko" : "en";
            const leadSummary = buildArticleLeadSummaryText(item.__articleBodyText || "", item.title || "", sourceLang);
            if (leadSummary && (!item.summaryText || item.summaryText.length < (sourceLang === "en" ? 140 : 80))) {
              item.summaryText = leadSummary;
              changed = true;
              continue;
            }
            if (updated) changed = true;
          }
        };
        await Promise.allSettled(Array.from({ length: concurrency }, () => worker()));
        return changed;
      }

            `${subject}에서 중요한 것은 발표 사실보다 ${focusKo} 같은 기술 레이어가 실제 제품화 단계로 이동했는지입니다. 결국 경쟁력은 기능 수보다 통합 난이도와 운영 비용을 얼마나 낮추느냐에서 갈립니다.`,
            `핵심은 ${focusKo}가 실제 배포와 채택 속도에 어떤 차이를 만들 수 있느냐입니다. AI 경쟁은 점점 기능 소개보다 운영 가능성과 제품 연결성에서 더 크게 갈릴 가능성이 큽니다.`,
            `${subject}의 함의는 신기한 기능보다 ${focusKo}를 얼마나 빠르게 실사용 환경에 붙일 수 있느냐에 있습니다. 이 과정이 안정화돼야 기술 뉴스가 실제 제품 우위로 이어집니다.`,
          ],
          seedBase,
        );
      }

      async function fetchAiSummaryFromBackend(titleText, summaryText, bodyText = "", lang = currentLang, provider = currentAiProvider, rawKorean = "") {
        const payload = {
          title: decodeHtmlEntitiesText(titleText || "").replace(/\s+/g, " ").trim().slice(0, 240),
          summary: decodeHtmlEntitiesText(summaryText || "").replace(/\s+/g, " ").trim().slice(0, 1200),
          bodyText: normalizeArticleBodyText(bodyText || "", 3600),
          lang: lang === "en" ? "en" : "ko",
          provider: normalizeAiProvider(provider),
          // rawKorean: original Korean source text (it.summaryText) for Groq-powered Korean→English summarization
          rawKorean: decodeHtmlEntitiesText(rawKorean || "").replace(/\s+/g, " ").trim().slice(0, 1800),
        };
        const res = await fetchWithTimeout(
          BACKEND_SUMMARY_API,
          {
            method: "POST",
            cache: "no-store",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          },
          TRANSLATE_FETCH_TIMEOUT_MS,
        );
        if (!res.ok) {
          let details = "";
          try {
            const errJson = await res.json();
            details = String(errJson?.error || "").trim();
          } catch (e) {
            details = await res.text().catch(() => "");
          }
          throw new Error(`SUMMARY_HTTP_${res.status}${details ? `:${details}` : ""}`);
        }
        const json = await res.json();
        const qualityScore = Number(json?.qualityScore);
        return {
          summary: decodeHtmlEntitiesText(json?.summary || "").replace(/\s+/g, " ").trim(),
          qualityScore: Number.isFinite(qualityScore) ? qualityScore : Number.NaN,
          shouldSkip: Boolean(json?.shouldSkip),
          usedFallback: Boolean(json?.usedFallback),
        };
      }

      /**
       * fetchBilingualBundleFromBackend
       * Calls /api/bundle/bilingual with the Korean source text.
       * The backend runs two sequential Groq calls:
       *   Step 1 — Korean source → finalized Korean headline + summary
       *   Step 2 — finalized Korean → English headline + summary
       * Returns { ko: { headline, summary }, en: { headline, summary } }
       * The English is ALWAYS derived from the Korean; the Korean is NEVER
       * regenerated from the English.
       */
      async function fetchBilingualBundleFromBackend(koreanTitle, rawKorean, bodyText = "") {
        const payload = {
          title:      decodeHtmlEntitiesText(koreanTitle  || "").replace(/\s+/g, " ").trim().slice(0, 240),
          rawKorean:  decodeHtmlEntitiesText(rawKorean    || "").replace(/\s+/g, " ").trim().slice(0, 1800),
          bodyText:   normalizeArticleBodyText(bodyText   || "", 3600),
        };
        const res = await fetchWithTimeout(
          BACKEND_BILINGUAL_API,
          {
            method: "POST",
            cache: "no-store",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          },
          TRANSLATE_FETCH_TIMEOUT_MS,
        );
        if (!res.ok) {
          const details = await res.json().then((j) => j?.error || "").catch(() => "");
          throw new Error(`BILINGUAL_HTTP_${res.status}${details ? `:${details}` : ""}`);
        }
        const json = await res.json();
        if (!json?.ok || !json?.ko || !json?.en) throw new Error("BILINGUAL_EMPTY_RESPONSE");
        const clean = (s) => decodeHtmlEntitiesText(s || "").replace(/\s+/g, " ").trim();
        return {
          ko: { headline: clean(json.ko.headline), summary: clean(json.ko.summary) },
          en: { headline: clean(json.en.headline), summary: clean(json.en.summary) },
        };
      }

      async function fetchAiInsightFromBackend(titleText, summaryText, bodyText = "", lang = currentLang, provider = currentAiProvider) {
        const payload = {
          title: decodeHtmlEntitiesText(titleText || "").replace(/\s+/g, " ").trim().slice(0, 240),
          summary: decodeHtmlEntitiesText(summaryText || "").replace(/\s+/g, " ").trim().slice(0, 1200),
          bodyText: normalizeArticleBodyText(bodyText || "", 3600),
          lang: lang === "en" ? "en" : "ko",
          provider: normalizeAiProvider(provider),
        };
        const res = await fetchWithTimeout(
          BACKEND_INSIGHT_API,
          {
            method: "POST",
            cache: "no-store",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          },
          TRANSLATE_FETCH_TIMEOUT_MS,
        );
        if (!res.ok) {
          let details = "";
          try {
            const errJson = await res.json();
            details = String(errJson?.error || "").trim();
          } catch (e) {
            details = await res.text().catch(() => "");
          }
          throw new Error(`INSIGHT_HTTP_${res.status}${details ? `:${details}` : ""}`);
        }
        const json = await res.json();
        return decodeHtmlEntitiesText(json?.insight || "").replace(/\s+/g, " ").trim();
      }

      async function ensureAiCardTextsForItem(item, lang = currentLang, provider = currentAiProvider) {
        if (!item || !USE_BACKEND) return false;
        const requestedProvider = normalizeAiProvider(provider);
        const requestedLang = lang === "en" ? "en" : "ko";
        // Groq(AI)은 항상 영어로 생성, 한국어는 번역
        const fetchLang = "en";
        let changed = false;
        const articleBodyUpdated = await ensureArticleBodyTextForItem(item);
        if (articleBodyUpdated) {
          clearAiCardText(item, "__aiSummary", requestedProvider, "en");
          clearAiCardText(item, "__aiSummary", requestedProvider, "ko");
          clearAiCardText(item, "__aiInsight", requestedProvider, "en");
          clearAiCardText(item, "__aiInsight", requestedProvider, "ko");
          clearAiCardText(item, "__aiSummaryError", requestedProvider, "en");
          clearAiCardText(item, "__aiSummaryError", requestedProvider, "ko");
          clearAiCardText(item, "__aiInsightError", requestedProvider, "en");
          clearAiCardText(item, "__aiInsightError", requestedProvider, "ko");
          clearAiCardText(item, "__aiSummaryQuality", requestedProvider, "en");
          clearAiCardText(item, "__aiSummarySkip", requestedProvider, "en");
          clearAiCardText(item, "__aiSummaryFallbackPreferred", requestedProvider, "en");
          clearAiCardText(item, "__aiSummaryUsedFallback", requestedProvider, "en");
          clearAiCardMetaGlobal(item, "__aiSummaryQuality", requestedProvider);
          clearAiCardMetaGlobal(item, "__aiSummarySkip", requestedProvider);
          clearAiCardMetaGlobal(item, "__aiSummaryFallbackPreferred", requestedProvider);
          clearAiCardMetaGlobal(item, "__aiSummaryUsedFallback", requestedProvider);
          changed = true;
        }
        const { titleText, summaryText, bodyText } = buildAiCardRequestText(item, "en");
        if (!titleText && !summaryText && !bodyText) return false;

        let nextSummary = getAiCardText(item, "__aiSummary", requestedProvider, "en");

        const needsSummary =
          !hasAiCardText(item, "__aiSummary", requestedProvider, "en") ||
          (!hasAiCardText(item, "__aiSummaryQuality", requestedProvider, "en") &&
            !getAiCardMetaGlobal(item, "__aiSummaryQuality", requestedProvider));

        if (needsSummary) {
          // ── Determine whether this item has a Korean source ─────────────────
          const rawKoreanSource = decodeHtmlEntitiesText(item?.summaryText || "").replace(/\s+/g, " ").trim();
          const hasKoreanSource = /[가-힣]/.test(rawKoreanSource) && rawKoreanSource.length >= 30;

          // ── Path A: Korean source → bilingual bundle (Korean first, then English)
          // Implements the editorial workflow:
          //   1. Read Korean source
          //   2. Write Korean headline + summary from Korean
          //   3. Derive English headline + summary from finalized Korean
          //   Korean is NEVER regenerated from English.
          if (hasKoreanSource) {
            try {
              const bundle = await fetchBilingualBundleFromBackend(titleText, rawKoreanSource, bodyText);

              const rawEn = bundle?.en?.summary || "";
              const rawKo = bundle?.ko?.summary || "";

              const validEn = rawEn && isReliableEnglishText(rawEn, 18) && !isWeakGeneratedSummary(rawEn, "en") && !isSummarySameAsTitle(rawEn, titleText);
              const validKo = rawKo && isReliableKoreanText(rawKo, 10);

              if (validEn && validKo) {
                const polishedEn = proofreadEnglishSummaryText(rawEn, titleText) || rawEn;
                const polishedKo = proofreadKoreanSummaryText(stylizeKoreanSummaryText(rawKo, titleText) || rawKo) || rawKo;
                setAiCardText(item, "__aiSummary", polishedEn, requestedProvider, "en");
                setAiCardText(item, "__aiSummary", polishedKo, requestedProvider, "ko");
                setAiCardMeta(item, "__aiSummaryError", "", requestedProvider, "en");
                setAiCardMeta(item, "__aiSummaryQuality", "90", requestedProvider, "en");
                setAiCardMeta(item, "__aiSummarySkip", "", requestedProvider, "en");
                setAiCardMeta(item, "__aiSummaryFallbackPreferred", "", requestedProvider, "en");
                setAiCardMeta(item, "__aiSummaryUsedFallback", "", requestedProvider, "en");
                setAiCardMetaGlobal(item, "__aiSummaryQuality", "90", requestedProvider, false);
                setAiCardMetaGlobal(item, "__aiSummarySkip", "", requestedProvider, false);
                setAiCardMetaGlobal(item, "__aiSummaryFallbackPreferred", "", requestedProvider, false);
                setAiCardMetaGlobal(item, "__aiSummaryUsedFallback", "", requestedProvider, false);
                nextSummary = polishedEn;
                // Also pin the bilingual headlines to the item so Korean and English titles
                // come from the same bundle — preventing title/summary mismatch.
                const rawHeadlineEn = bundle?.en?.headline || "";
                const rawHeadlineKo = bundle?.ko?.headline || "";
                if (rawHeadlineEn && isReliableEnglishText(rawHeadlineEn, 3) && !/[가-힣]/.test(rawHeadlineEn)) {
                  const pinnedEn = proofreadEnglishHeadlineText(rawHeadlineEn) || rawHeadlineEn;
                  item.cardTitleEn = pinnedEn;
                  item.titleEn = pinnedEn;
                }
                if (rawHeadlineKo && isReliableKoreanText(rawHeadlineKo, 2)) {
                  const pinnedKo = proofreadKoreanHeadlineText(stylizeKoreanHeadlineText(rawHeadlineKo) || rawHeadlineKo) || rawHeadlineKo;
                  item.cardTitleKo = pinnedKo;
                  item.titleKo = pinnedKo;
                }
                changed = true;
              } else {
                // Bundle came back but content is unusable — mark as error and fall through
                setAiCardText(item, "__aiSummary", "", requestedProvider, "en");
                setAiCardText(item, "__aiSummary", "", requestedProvider, "ko");
                const errorKind = !rawEn ? "empty" : !validEn ? "offtopic" : "ko_invalid";
                setAiCardMeta(item, "__aiSummaryError", errorKind, requestedProvider, "en");
                changed = true;
              }
            } catch (e) {
              console.warn("[bilingual-bundle fallback]", requestedProvider, String(e?.message || e));
              // Fall through to Path B (English-only)
            }
          }

          // ── Path B: English-only Groq path (non-Korean sources, or bilingual fallback) ──
          if (!hasAiCardText(item, "__aiSummary", requestedProvider, "en")) {
            try {
              const generatedSummaryResult = await fetchAiSummaryFromBackend(titleText, summaryText, bodyText, "en", requestedProvider, "");
              const generatedSummary = decodeHtmlEntitiesText(generatedSummaryResult?.summary || "").replace(/\s+/g, " ").trim();
              const generatedQuality = Number(generatedSummaryResult?.qualityScore);
              const qualityScore = Number.isFinite(generatedQuality) ? generatedQuality : Number.NaN;
              const lowQualitySkip =
                Boolean(generatedSummaryResult?.shouldSkip) || (Number.isFinite(qualityScore) && qualityScore < 40);
              const fallbackPreferred = Number.isFinite(qualityScore) && qualityScore >= 40 && qualityScore < 60;

              setAiCardMeta(item, "__aiSummaryQuality", Number.isFinite(qualityScore) ? String(Math.round(qualityScore)) : "", requestedProvider, "en");
              setAiCardMeta(item, "__aiSummarySkip", lowQualitySkip ? "1" : "", requestedProvider, "en");
              setAiCardMeta(item, "__aiSummaryFallbackPreferred", !lowQualitySkip && fallbackPreferred ? "1" : "", requestedProvider, "en");
              setAiCardMeta(item, "__aiSummaryUsedFallback", generatedSummaryResult?.usedFallback ? "1" : "", requestedProvider, "en");
              setAiCardMetaGlobal(item, "__aiSummaryQuality", Number.isFinite(qualityScore) ? String(Math.round(qualityScore)) : "", requestedProvider, false);
              setAiCardMetaGlobal(item, "__aiSummarySkip", lowQualitySkip ? "1" : "", requestedProvider, false);
              setAiCardMetaGlobal(item, "__aiSummaryFallbackPreferred", !lowQualitySkip && fallbackPreferred ? "1" : "", requestedProvider, false);
              setAiCardMetaGlobal(item, "__aiSummaryUsedFallback", generatedSummaryResult?.usedFallback ? "1" : "", requestedProvider, false);

              if (lowQualitySkip) {
                setAiCardText(item, "__aiSummary", "", requestedProvider, "en");
                setAiCardText(item, "__aiSummary", "", requestedProvider, "ko");
                setAiCardMeta(item, "__aiSummaryError", "skip", requestedProvider, "en");
                changed = true;
                return changed;
              }
              if (fallbackPreferred) {
                setAiCardText(item, "__aiSummary", "", requestedProvider, "en");
                setAiCardText(item, "__aiSummary", "", requestedProvider, "ko");
                setAiCardMeta(item, "__aiSummaryError", "fallback_preferred", requestedProvider, "en");
                changed = true;
                return changed;
              }

              const generatedLooksEnglish =
                !/[가-힣]/.test(generatedSummary || "") &&
                isReliableEnglishText(generatedSummary || "", 18) &&
                !isWeakGeneratedSummary(generatedSummary, "en");

              if (generatedSummary && generatedLooksEnglish && !isSummarySameAsTitle(generatedSummary, titleText)) {
                const polishedEn = proofreadEnglishSummaryText(generatedSummary, titleText) || generatedSummary;
                setAiCardText(item, "__aiSummary", polishedEn, requestedProvider, "en");
                setAiCardMeta(item, "__aiSummaryError", "", requestedProvider, "en");
                nextSummary = polishedEn;
                // Korean: translate from English (only for non-Korean sources; Korean sources use Path A)
                if (!hasKoreanSource) {
                  try {
                    let translatedKo = await translateTextToKo(polishedEn, "summary");
                    if (!translatedKo || !isReliableKoreanText(translatedKo, 10)) {
                      try { translatedKo = await translateTextViaPublicGoogle(polishedEn, "en", "ko"); } catch (_ge) {}
                    }
                    if (translatedKo && isReliableKoreanText(translatedKo, 10)) {
                      const polishedKo = proofreadKoreanSummaryText(stylizeKoreanSummaryText(translatedKo, titleText) || translatedKo) || translatedKo;
                      setAiCardText(item, "__aiSummary", polishedKo, requestedProvider, "ko");
                    }
                  } catch (_e) {}
                }
                changed = true;
              } else {
                setAiCardText(item, "__aiSummary", "", requestedProvider, "en");
                setAiCardText(item, "__aiSummary", "", requestedProvider, "ko");
                const errorKind = !generatedSummary ? "empty" : generatedLooksEnglish ? "short" : "offtopic";
                setAiCardMeta(item, "__aiSummaryError", errorKind, requestedProvider, requestedLang);
                changed = true;
              }
            } catch (e) {
              console.warn("[AI summary fallback]", requestedProvider, requestedLang, String(e?.message || e));
              setAiCardText(item, "__aiSummary", "", requestedProvider, "en");
              setAiCardText(item, "__aiSummary", "", requestedProvider, "ko");
              setAiCardMeta(item, "__aiSummaryError", classifyAiCardError(e), requestedProvider, "en");
              setAiCardMeta(item, "__aiSummaryQuality", "", requestedProvider, "en");
              setAiCardMeta(item, "__aiSummarySkip", "", requestedProvider, "en");
              setAiCardMeta(item, "__aiSummaryFallbackPreferred", "", requestedProvider, "en");
              setAiCardMeta(item, "__aiSummaryUsedFallback", "", requestedProvider, "en");
              changed = true;
            }
          }
        }

        if (DEV_INSIGHT_ENABLED && !hasAiCardText(item, "__aiInsight", requestedProvider, requestedLang)) {
          try {
            const insightSeed = nextSummary || summaryText;
            const generatedInsight = await fetchAiInsightFromBackend(titleText, insightSeed, bodyText, requestedLang, requestedProvider);
            const isUsableInsight =
              generatedInsight &&
              !isWeakGeneratedInsight(generatedInsight, requestedLang) &&
              !isInsightTooSimilarToSummary(generatedInsight, insightSeed, requestedLang) &&
              isInsightRelevantToContext(generatedInsight, item, titleText, insightSeed, requestedLang);
            if (isUsableInsight) {
              setAiCardText(item, "__aiInsight", generatedInsight, requestedProvider, requestedLang);
              setAiCardMeta(item, "__aiInsightError", "", requestedProvider, requestedLang);
              changed = true;
            } else {
              setAiCardText(item, "__aiInsight", "", requestedProvider, requestedLang);
              const errorKind = !generatedInsight
                ? "empty"
                : isWeakGeneratedInsight(generatedInsight, requestedLang)
                  ? "short"
                  : "offtopic";
              setAiCardMeta(item, "__aiInsightError", errorKind, requestedProvider, requestedLang);
              changed = true;
            }
          } catch (e) {
            console.warn("[AI insight fallback]", requestedProvider, requestedLang, String(e?.message || e));
            setAiCardText(item, "__aiInsight", "", requestedProvider, requestedLang);
            setAiCardMeta(item, "__aiInsightError", classifyAiCardError(e), requestedProvider, requestedLang);
            changed = true;
          }
        } else if (!DEV_INSIGHT_ENABLED && !hasAiCardText(item, "__aiInsight", requestedProvider, requestedLang)) {
          setAiCardText(item, "__aiInsight", "", requestedProvider, requestedLang);
          setAiCardMeta(item, "__aiInsightError", "disabled", requestedProvider, requestedLang);
          changed = true;
        }
        return changed;
      }

      function hydrateAiCardTexts(filteredItems, sourceItems) {
        if (aiCardTextRefreshPending || !USE_BACKEND) return;
        const provider = normalizeAiProvider(currentAiProvider);
        const lang = currentLang === "en" ? "en" : "ko";
        const pool = (filteredItems || []).slice(0, HOT_LIMIT);

        // Primary targets: items missing AI summary for current language
        const primaryTargets = pool.filter(
          (it) =>
            !hasAiCardText(it, "__aiSummary", provider, lang) ||
            (!hasAiCardText(it, "__aiSummaryQuality", provider, lang) &&
              !getAiCardMetaGlobal(it, "__aiSummaryQuality", provider)) ||
            (DEV_INSIGHT_ENABLED && !hasAiCardText(it, "__aiInsight", provider, lang)),
        );

        // BILINGUAL_CONTENT_SYNC: also pre-generate Korean AI translation for any item that
        // already has an English AI summary but is missing the Korean one.
        // This ensures the Korean tab shows the Groq AI content instead of just the RSS translation.
        const seenKeys = new Set(primaryTargets.map((it) => it.guid || it.link || it.title || ""));
        const bilingualTargets = BILINGUAL_CONTENT_SYNC
          ? pool.filter((it) => {
              const key = it.guid || it.link || it.title || "";
              if (seenKeys.has(key)) return false; // already in primary
              return (
                hasAiCardText(it, "__aiSummary", provider, "en") &&
                !hasAiCardText(it, "__aiSummary", provider, "ko")
              );
            })
          : [];

        const targets = [...primaryTargets, ...bilingualTargets];
        if (!targets.length) return;
        aiCardTextRefreshPending = true;

        const queue = targets.slice();
        const concurrency = Math.max(1, Math.min(2, queue.length));
        let cursor = 0;

        const worker = async () => {
          let changed = false;
          while (cursor < queue.length) {
            const idx = cursor++;
            const item = queue[idx];
            if (!item) continue;
            const updated = await ensureAiCardTextsForItem(item, lang, provider);
            if (updated) changed = true;
            // If we just generated English AI, immediately queue Korean translation
            if (
              BILINGUAL_CONTENT_SYNC &&
              hasAiCardText(item, "__aiSummary", provider, "en") &&
              !hasAiCardText(item, "__aiSummary", provider, "ko")
            ) {
              const koUpdated = await ensureAiCardTextsForItem(item, "ko", provider);
              if (koUpdated) changed = true;
            }
          }
          return changed;
        };

        Promise.allSettled(Array.from({ length: concurrency }, () => worker()))
          .then(async (results) => {
            const hasChanged = results.some((r) => r.status === "fulfilled" && r.value);
            if (hasChanged) {
              // Re-sync bilingual content for items that now have AI English.
              // synchronizeBilingualCardTexts reads __aiSummary[en] as baseEn source,
              // so running it again ensures cardSummaryKo matches the AI-generated English.
              // This prevents the divergence where English shows Groq AI content but
              // Korean falls back to the pre-AI cardSummaryKo (based on different source).
              if (BILINGUAL_CONTENT_SYNC) {
                const needResync = pool.filter((it) =>
                  hasAiCardText(it, "__aiSummary", provider, "en") &&
                  getAiCardText(it, "__aiSummary", provider, "en") &&
                  !isSummaryEmptyText(getAiCardText(it, "__aiSummary", provider, "en"))
                );
                if (needResync.length) {
                  try { await synchronizeBilingualCardTexts(needResync); } catch (_e) {}
                }
              }
              render(sourceItems);
            }
          })
          .finally(() => {
            aiCardTextRefreshPending = false;
          });
      }

      function loadOgCacheFromStorage() {
        try {
          const raw = localStorage.getItem(OG_CACHE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          const now = Date.now();
          Object.entries(parsed).forEach(([k, v]) => {
            if (!v || !v.url || !v.ts) return;
            if (now - v.ts > OG_CACHE_TTL_MS) return;
            ogImageCache.set(k, v.url);
          });
        } catch (e) {}
      }

      function saveOgCacheToStorage() {
        try {
          const entries = Array.from(ogImageCache.entries()).slice(-OG_CACHE_MAX);
          const obj = {};
          entries.forEach(([k, v]) => {
            obj[k] = { url: v, ts: Date.now() };
          });
          localStorage.setItem(OG_CACHE_KEY, JSON.stringify(obj));
        } catch (e) {}
      }

      function setStatus(kind, text, key) {
        elDot.className = "dot" + (kind ? ` ${kind}` : "");
        elStatusText.textContent = text;
        if (key) lastStatus = { kind, key };
        log("status", { kind, text });
      }

      function getFeedLabelByKey(key) {
        return FEEDS.find((f) => f.key === key)?.label || key;
      }

      function withRequiredAggregateSourceKeys(keys) {
        const prioritized = prioritizeAggregateSourceKeys(keys);
        const next = new Set(prioritized);
        REQUIRED_AGGREGATE_SOURCE_KEYS.forEach((key) => {
          if (AGGREGATE_SOURCE_KEYS.includes(key)) next.add(key);
        });
        return prioritizeAggregateSourceKeys(Array.from(next));
      }

      function loadActiveSourcesFromStorage() {
        try {
          const raw = localStorage.getItem(SOURCE_TOGGLE_STORAGE_KEY);
          if (!raw) {
            activeAggregateSourceKeys = new Set(withRequiredAggregateSourceKeys(AGGREGATE_SOURCE_KEYS.slice()));
            return;
          }
          const arr = JSON.parse(raw);
          if (!Array.isArray(arr)) {
            activeAggregateSourceKeys = new Set(withRequiredAggregateSourceKeys(AGGREGATE_SOURCE_KEYS.slice()));
            return;
          }
          const filtered = AGGREGATE_SOURCE_KEYS.filter((k) => arr.includes(k));
          const normalized = withRequiredAggregateSourceKeys(filtered.length ? filtered : AGGREGATE_SOURCE_KEYS.slice());
          if (normalized.length) activeAggregateSourceKeys = new Set(normalized);
        } catch (e) {}
      }

      function makeKoTranslateCacheKey(text, kind) {
        const safeKind = kind === "title" ? "title" : "summary";
        return `${safeKind}|${decodeHtmlEntitiesText(text)
          .slice(0, KO_TRANSLATE_MAX_TEXT)
          .toLowerCase()}`;
      }

      function makeEnTranslateCacheKey(text, kind) {
        const safeKind = kind === "title" ? "title" : "summary";
        return `${safeKind}|${decodeHtmlEntitiesText(text)
          .slice(0, KO_TRANSLATE_MAX_TEXT)
          .toLowerCase()}`;
      }

      function isReliableEnglishText(value, minLetters = 6) {
        const text = decodeHtmlEntitiesText(value || "").replace(/\s+/g, " ").trim();
        if (!text) return false;
        if (/[가-힣]/.test(text)) return false;
        const letters = (text.match(/[A-Za-z]/g) || []).length;
        if (letters < Math.max(1, minLetters)) return false;
        const compactLen = text.replace(/\s+/g, "").length || 1;
        const ratio = letters / compactLen;
        if (ratio >= 0.18) return true;

      async function fetchWithTimeout(url, options = {}, timeoutMs = NETWORK_FETCH_TIMEOUT_MS) {
        const controller = new AbortController();
        const safeTimeout = Math.max(1000, Number(timeoutMs) || NETWORK_FETCH_TIMEOUT_MS);
        const timer = setTimeout(() => controller.abort(), safeTimeout);
        try {
          const nextOptions = { ...(options || {}), signal: controller.signal };
          return await fetch(url, nextOptions);
        } finally {
          clearTimeout(timer);
        }
      }

      async function translateTextViaPublicGoogle(text, from = "auto", to = "ko") {
        const q = decodeHtmlEntitiesText(text || "")
          .replace(/\s+/g, " ")
          .trim();
        if (!q) return "";
        const params = new URLSearchParams({
          client: "gtx",
          sl: from || "auto",
          tl: to || "ko",
          dt: "t",
          q,
        });
        const url = `https://translate.googleapis.com/translate_a/single?${params.toString()}`;
        const res = await fetchWithTimeout(url, { method: "GET", cache: "no-store" }, TRANSLATE_FETCH_TIMEOUT_MS);
        if (!res.ok) throw new Error(`PUBLIC_TRANSLATE_HTTP_${res.status}`);
        const json = await res.json();
        if (!Array.isArray(json) || !Array.isArray(json[0])) return "";
        const translated = json[0]
          .map((part) => (Array.isArray(part) && typeof part[0] === "string" ? part[0] : ""))
          .join("")
          .trim();
        return decodeHtmlEntitiesText(translated || "");
      }

      async function translateTextToKo(text, kind) {
        const safeKind = kind === "title" ? "title" : "summary";
        const normalized = decodeHtmlEntitiesText(text)
          .replace(/\s+/g, " ")
          .trim();
        if (!normalized) return "";
        const clipped = normalized.slice(0, KO_TRANSLATE_MAX_TEXT);
        if (/[가-힣]/.test(clipped) && !/[A-Za-z]/.test(clipped)) return clipped;
        const from = /[A-Za-z]/.test(clipped) ? "en" : "auto";

        const cacheKey = makeKoTranslateCacheKey(clipped, safeKind);
        const cached = koTranslateCache.get(cacheKey);
        if (cached && cached !== clipped) {
          const hasHangul = /[가-힣]/.test(cached);
          if (hasHangul) return cached;
        }

        try {
          const params = new URLSearchParams({
            text: clipped,
            to: "ko",
            from,
            kind: safeKind,
          });
          const res = await fetchWithTimeout(
            `${BACKEND_TRANSLATE_API}?${params.toString()}`,
            { method: "GET", cache: "no-store" },
            TRANSLATE_FETCH_TIMEOUT_MS,
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const translated = decodeHtmlEntitiesText(json?.translated || clipped) || clipped;
          koTranslateCache.set(cacheKey, translated);
          return translated;
        } catch (e) {
          try {
            const translatedPublic = await translateTextViaPublicGoogle(clipped, from, "ko");
            if (translatedPublic && translatedPublic !== clipped) {
              koTranslateCache.set(cacheKey, translatedPublic);
              return translatedPublic;
            }
          } catch (_fallbackErr) {}
          return clipped;
        }
      }

      async function translateTextToEn(text, kind) {
        const safeKind = kind === "title" ? "title" : "summary";
        const normalized = decodeHtmlEntitiesText(text)
          .replace(/\s+/g, " ")

        if (!normalized) return "";
        const clipped = normalized.slice(0, KO_TRANSLATE_MAX_TEXT);
        if (/[A-Za-z]/.test(clipped) && !/[가-힣]/.test(clipped)) return clipped;
        const from = /[가-힣]/.test(clipped) ? "ko" : "auto";

        const cacheKey = makeEnTranslateCacheKey(clipped, safeKind);
        const cached = enTranslateCache.get(cacheKey);
        if (cached && isReliableEnglishText(cached, safeKind === "title" ? 3 : 12)) return cached;

        try {
          const params = new URLSearchParams({
            text: clipped,
            to: "en",
            from,
            kind: safeKind,
          });
          const res = await fetchWithTimeout(
            `${BACKEND_TRANSLATE_API}?${params.toString()}`,
            { method: "GET", cache: "no-store" },
            TRANSLATE_FETCH_TIMEOUT_MS,
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const translated = decodeHtmlEntitiesText(json?.translated || clipped) || clipped;
          if (isReliableEnglishText(translated, safeKind === "title" ? 3 : 12)) {
            enTranslateCache.set(cacheKey, translated);
            return translated;
          }
        } catch (e) {}

        try {
          const translatedPublic = await translateTextViaPublicGoogle(clipped, from, "en");
          if (isReliableEnglishText(translatedPublic, safeKind === "title" ? 3 : 12)) {
            enTranslateCache.set(cacheKey, translatedPublic);
            return translatedPublic;
          }
        } catch (e) {}
        return clipped;

      function localizeCategoryLabel(label, lang = currentLang) {
        const raw = decodeHtmlEntitiesText(label || "").replace(/\s+/g, " ").trim();
        if (!raw) return "";
        if (lang !== "en") return raw;
        if (KO_CATEGORY_TO_EN[raw]) return KO_CATEGORY_TO_EN[raw];
        const compact = raw.replace(/\s+/g, "").replace(/[·•]/g, "");
        if (KO_CATEGORY_TO_EN[compact]) return KO_CATEGORY_TO_EN[compact];
        if (!/[가-힣]/.test(raw)) return raw;
        const replaced = raw
          .replace(/AI산업일반/gi, "AI Industry")
          .replace(/인공지능산업일반/gi, "AI Industry")
          .replace(/산업일반/gi, "AI Industry")
          .replace(/인공지능산업/gi, "AI Industry")
          .replace(/인공지능/gi, "Artificial Intelligence")
          .replace(/산업/gi, "Industry")
          .replace(/기술/gi, "Technology")
          .replace(/정책/gi, "Policy")
          .replace(/규제/gi, "Regulation")
          .replace(/기업/gi, "Company")
          .replace(/스타트업/gi, "Startup")
          .replace(/제품/gi, "Product")
          .replace(/업데이트/gi, "Update")
          .replace(/출시/gi, "Launch")
          .replace(/발표/gi, "Announcement")
          .replace(/투자/gi, "Investment")
          .replace(/일반/gi, "General");
        return decodeHtmlEntitiesText(replaced)
          .replace(/[가-힣]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function toSafeEnglishLabel(raw, fallback = "AI Industry") {
        const base = decodeHtmlEntitiesText(raw || "").replace(/\s+/g, " ").trim();
        if (!base) return fallback;
        const localized = localizeCategoryLabel(base, "en");
        const cleaned = decodeHtmlEntitiesText(localized || "")
          .replace(/[가-힣]+/g, " ")
          .replace(/[_|/]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        if (!cleaned) return fallback;
        return cleaned;
      }

      function getEnglishTopicHintFromItem(item) {
        const merged = normalizeCompareText(
          `${item?.title || ""} ${item?.summaryText || ""} ${(item?.categories || []).join(" ")}`,
        );
        if (!merged) return "AI industry";
        if (/(chip|gpu|npu|semiconductor|data center|datacenter|cloud|반도체|칩|gpu|npu|데이터센터|클라우드)/i.test(merged)) {
          return "AI infrastructure";
        }
        if (/(model|llm|gpt|gemini|inference|training|모델|파운데이션|추론|학습)/i.test(merged)) {
          return "AI models";
        }
        if (/(api|sdk|platform|service|app|integration|통합|플랫폼|서비스|앱|api|sdk)/i.test(merged)) {
          return "AI platforms";
        }
        if (/(robot|robotics|autonomous|로봇|자율)/i.test(merged)) {
          return "AI robotics";
        }
        if (/(health|medical|healthcare|의료|헬스케어|바이오)/i.test(merged)) {
          return "AI healthcare";
        }
        return "AI industry";
      }

      function getLocalizedCategories(item, lang = currentLang) {
        const src = Array.isArray(item?.categories) ? item.categories : [];
        const localized = src
          .map((c) => localizeCategoryLabel(c, lang))
          .map((c) => decodeHtmlEntitiesText(c || "").trim())
          .filter(Boolean);
        return localized.length ? localized : src.map((c) => decodeHtmlEntitiesText(c || "").trim()).filter(Boolean);
      }

      function buildEnglishFallbackTitleFromItem(item) {
        const sourceTitle = decodeHtmlEntitiesText(item?.title || "").replace(/\s+/g, " ").trim();
        if (sourceTitle && !/[가-힣]/.test(sourceTitle) && isReliableEnglishText(sourceTitle, 3)) {
          const polished = proofreadEnglishHeadlineText(sourceTitle) || sourceTitle;
          if (polished && !isGenericEnglishFallbackTitle(polished)) return polished;
        }
        const localizedCats = getLocalizedCategories(item, "en");
        const categoryHint = toSafeEnglishLabel(localizedCats[0] || item?.categories?.[0] || "", "AI Industry");
        const topicHint = getEnglishTopicHintFromItem(item);
        const categoryNorm = normalizeCompareText(categoryHint);
        const topicNorm = normalizeCompareText(topicHint);
        if (categoryNorm && topicNorm && (categoryNorm.includes(topicNorm) || topicNorm.includes(categoryNorm))) {
          return `${categoryHint} update`;
        }
        return `${categoryHint} ${topicHint} update`;
      }

      function buildEnglishFallbackSummaryFromItem(item, titleEn) {
        const sourceHint =
          String(item?.sourceFeed || "") === "aitimes_industry"
            ? "AI Times"
            : toSafeEnglishLabel(decodeHtmlEntitiesText(item?.sourceFeedTitle || "").trim(), "AI source");
        const categoryHint = toSafeEnglishLabel(getLocalizedCategories(item, "en")[0] || item?.categories?.[0] || "", "AI industry").toLowerCase();
        const topicHint = getEnglishTopicHintFromItem(item);
        const titleHint = toSafeEnglishLabel(decodeHtmlEntitiesText(titleEn || "").trim(), `${topicHint} update`);
        return `${sourceHint} reports a recent ${categoryHint} update involving ${titleHint}.`;
      }

      function getLocalizedCreatorText(item, lang = currentLang) {
        const creatorRaw = decodeHtmlEntitiesText(item?.creator || "").replace(/\s+/g, " ").trim();
        if (!creatorRaw) return "";
        if (lang !== "en") return creatorRaw;

        return toSafeEnglishLabel(sourceHint, "AI Times");

      function resolveEditorialEnglishCardOverride(item, titleText = "", summaryText = "") {
        const corpus = normalizeCompareText([
          item?.title || "",
          item?.summaryText || "",
          item?.cardTitleEn || "",
          item?.cardSummaryEn || "",
          item?.titleEn || "",
          item?.summaryEn || "",
          titleText || "",
          summaryText || "",
          item?.link || "",
          (item?.categories || []).join(" "),
        ].join(" "));
        if (!corpus) return null;

        for (const override of EDITORIAL_EN_CARD_OVERRIDES) {
          const mustTokens = (override.must || []).map((t) => normalizeCompareText(t)).filter(Boolean);
          const mustAnyTokens = (override.mustAny || []).map((t) => normalizeCompareText(t)).filter(Boolean);
          const mustAnyGroups = Array.isArray(override.mustAnyGroups)
            ? override.mustAnyGroups
                .map((group) => (Array.isArray(group) ? group : [group]))
                .map((group) => group.map((t) => normalizeCompareText(t)).filter(Boolean))
                .filter((group) => group.length)
            : [];
          const anyTokens = (override.any || []).map((t) => normalizeCompareText(t)).filter(Boolean);
          if (mustTokens.length && !mustTokens.every((token) => corpus.includes(token))) continue;
          if (mustAnyTokens.length && !mustAnyTokens.some((token) => corpus.includes(token))) continue;
          if (mustAnyGroups.length && !mustAnyGroups.every((group) => group.some((token) => corpus.includes(token)))) continue;
          if (anyTokens.length && !anyTokens.some((token) => corpus.includes(token))) continue;
          return override;
        }
        return null;
      }

      function getEditorialOverrideKeyForItem(item) {
        if (!item) return "";
        const canonical = ensureCanonicalCardText(item);
        const probes = [
          [canonical?.titleEn || "", canonical?.summaryEn || ""],
          [item?.cardTitleEn || item?.titleEn || "", item?.cardSummaryEn || item?.summaryEn || ""],
          [item?.title || "", item?.summaryText || ""],
          [item?.cardTitleKo || item?.titleKo || "", item?.cardSummaryKo || item?.summaryKo || ""],
        ];
        for (const [t, s] of probes) {
          const resolved = resolveEditorialEnglishCardOverride(item, t, s);
          if (resolved?.key) return String(resolved.key);
        }
        return "";
      }

      function getEditorialOverrideByKey(key) {
        const k = String(key || "").trim();
        if (!k) return null;
        return EDITORIAL_EN_CARD_OVERRIDES.find((ov) => String(ov?.key || "").trim() === k) || null;
      }

      function reorderPoolByEditorialTop10(items, limit = HOT_LIMIT) {
        const list = Array.isArray(items) ? items.filter(Boolean) : [];
        if (!list.length) return [];

        const orderKeys = EDITORIAL_EN_CARD_OVERRIDES.map((ov) => String(ov?.key || "").trim()).filter(Boolean);
        const byKey = new Map();
        const withoutKey = [];

        for (const it of list) {
          const ovKey = getEditorialOverrideKeyForItem(it);
          if (!ovKey) {
            withoutKey.push(it);
            continue;
          }
          if (!byKey.has(ovKey)) {
            byKey.set(ovKey, it);
          } else {
            byKey.set(ovKey, pickBetterDuplicateItem(byKey.get(ovKey), it));
          }
        }

        const out = [];
        const seen = new Set();
        for (const key of orderKeys) {
          const it = byKey.get(key);
          if (!it) continue;
          const id = getItemIdentityKey(it);
          if (!id || seen.has(id)) continue;
          seen.add(id);
          out.push(it);
          if (out.length >= limit) return out.slice(0, limit);
        }

        for (const it of [...withoutKey, ...list]) {
          if (out.length >= limit) break;
          const id = getItemIdentityKey(it);
          if (!id || seen.has(id)) continue;
          seen.add(id);
          out.push(it);
        }
        return out.slice(0, limit);
      }

      function getCardTopicLabel(item, titleText = "", summaryText = "") {
        const editorialOverride = resolveEditorialEnglishCardOverride(item, titleText, summaryText);
        if (editorialOverride?.topicLabel) return editorialOverride.topicLabel;
        const merged = normalizeCompareText(
          `${item?.title || ""} ${item?.summaryText || ""} ${titleText || ""} ${summaryText || ""} ${(item?.categories || []).join(" ")}`,
        );
        if (!merged) return "PRODUCT UPDATE";
        if (/(benchmark|swe-bench|state of the art|sota|record|score|달성|최고 점수|기록)/i.test(merged)) return "SOTA MODEL";
        if (/(attention|transformer|architecture|context|memory|latency|inference|throughput|어텐션|트랜스포머|아키텍처|메모리|컨텍스트)/i.test(merged)) return "ARCHITECTURE";
        if (/(api|sdk|agent|workflow|platform|integration|service|앱|서비스|플랫폼|연동|통합|에이전트)/i.test(merged)) return "PLATFORM";
        if (/(gpu|chip|semiconductor|npu|server|data center|infrastructure|infra|칩|반도체|서버|데이터센터|인프라)/i.test(merged)) return "INFRASTRUCTURE";
        if (/(security|privacy|guardrail|safety|보안|프라이버시|안전)/i.test(merged)) return "SECURITY";
        if (/(health|medical|bio|healthcare|의료|헬스케어|바이오)/i.test(merged)) return "APPLIED AI";
        return "PRODUCT UPDATE";
      }

      function buildLooseSourceTopupPool(sourceItems = []) {
        const baseFilter = (it) =>
          !isBlockedCardSourceKey(it?.sourceFeed || "") &&
          !isNewsDigestCard(it) &&
          !isPromotionalSelfPost(it) &&
          !isSubjectiveStyleStory(it) &&
          !isKoreanDomesticArticle(it);
        // launch 신호 있는 기사 우선, 나머지 뒤에
        const withLaunch = (sourceItems || []).filter((it) => baseFilter(it) && isLaunchFocusedItem(it));
        const withoutLaunch = (sourceItems || []).filter((it) => baseFilter(it) && !isLaunchFocusedItem(it));
        const sortedAll = [...withLaunch, ...withoutLaunch].sort((a, b) => getLaunchPriorityScore(b) - getLaunchPriorityScore(a));
        const relaxedPool = dedupeByGuidOrLink(
          sortedAll
            .filter((it) => hasAnyUsableSummary(it) || hasRelaxedArticleSummary(it)),
        );
        const loosePool = dedupeByGuidOrLink(
          sortedAll,
        );
        return dedupeByGuidOrLink([...(relaxedPool || []), ...(loosePool || [])]);
      }

          const arr = withRequiredAggregateSourceKeys(
            AGGREGATE_SOURCE_KEYS.filter((k) => activeAggregateSourceKeys.has(k)),

      }

      function prioritizeAggregateSourceKeys(keys) {
        const uniq = Array.from(new Set((keys || []).map((k) => String(k || "").trim()).filter(Boolean)));
        const valid = uniq.filter((k) => AGGREGATE_SOURCE_KEYS.includes(k));
        return valid.sort((a, b) => getSourcePriorityIndex(a) - getSourcePriorityIndex(b));
      }

      function getSelectedAggregateSourceKeys() {
        const active = AGGREGATE_SOURCE_KEYS.filter((k) => activeAggregateSourceKeys.has(k));
        const base = active.length ? active : AGGREGATE_SOURCE_KEYS.slice();
        return withRequiredAggregateSourceKeys(base);
      }

      function renderSourceToggles() {

      function setMetaText() {

        const ts = now.toLocaleString(getLocale(), { hour12: false });
