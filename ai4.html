            }
          }
        }
        if (consolidatedFinal.length < HOT_LIMIT) {
          const productTechBackfillPool = dedupeByGuidOrLink(
            dedupeItems([...mergedItems, ...fallbackPool]).filter((it) => {
              const ms = toDateMs(it?.pubDate || "");
              const inWindow = ms >= startMs && ms < endExclusiveMs;
              if (!inWindow || isNewsDigestCard(it) || isPromotionalSelfPost(it) || isSubjectiveStyleStory(it)) return false;
              return isProductTechCardCandidate(it, true);
            }),
          ).sort((a, b) => {
            const launchDelta = getLaunchPriorityScore(b) - getLaunchPriorityScore(a);
            if (launchDelta !== 0) return launchDelta;
            return toDateMs(b?.pubDate || "") - toDateMs(a?.pubDate || "");
          });
          consolidatedFinal = topUpItemsByIdentity(consolidatedFinal, productTechBackfillPool, HOT_LIMIT);
        }
        if (consolidatedFinal.length < HOT_LIMIT) {
          const secondarySourceSet = new Set(
            sourceKeys.filter((k) => !PRIMARY_AGGREGATE_SOURCE_KEYS.includes(String(k || "").trim())),
          );
          const secondaryProductPool = dedupeByGuidOrLink(
            dedupeItems([...mergedItems, ...fallbackPool]).filter((it) => {
              const sourceKey = String(it?.sourceFeed || "").trim();
              if (!secondarySourceSet.has(sourceKey)) return false;
              const ms = toDateMs(it?.pubDate || "");
              const inWindow = ms >= startMs && ms < endExclusiveMs;
              if (!inWindow || isNewsDigestCard(it) || isPromotionalSelfPost(it) || isSubjectiveStyleStory(it)) return false;
              return isProductTechCardCandidate(it, true);
            }),
          ).sort((a, b) => {
            const launchDelta = getLaunchPriorityScore(b) - getLaunchPriorityScore(a);
            if (launchDelta !== 0) return launchDelta;
            return toDateMs(b?.pubDate || "") - toDateMs(a?.pubDate || "");
          });
          consolidatedFinal = topUpItemsByIdentity(consolidatedFinal, secondaryProductPool, HOT_LIMIT);
        }
        if (consolidatedFinal.length < HOT_LIMIT) {
          const secondarySourceSet = new Set(
            sourceKeys.filter((k) => !PRIMARY_AGGREGATE_SOURCE_KEYS.includes(String(k || "").trim())),
          );
          const secondaryRelaxedPool = dedupeByGuidOrLink(
            dedupeItems([...mergedItems, ...fallbackPool]).filter((it) => {
              const sourceKey = String(it?.sourceFeed || "").trim();
              if (!secondarySourceSet.has(sourceKey) || isBlockedCardSourceKey(sourceKey)) return false;
              const ms = toDateMs(it?.pubDate || "");
              const inWindow = ms >= startMs && ms < endExclusiveMs;
              if (!inWindow || isNewsDigestCard(it) || isPromotionalSelfPost(it) || isSubjectiveStyleStory(it)) return false;
              return hasAnyUsableSummary(it) || hasRelaxedArticleSummary(it);
            }),
          ).sort((a, b) => {
            const launchDelta = getLaunchPriorityScore(b) - getLaunchPriorityScore(a);
            if (launchDelta !== 0) return launchDelta;
            return toDateMs(b?.pubDate || "") - toDateMs(a?.pubDate || "");
          });
          consolidatedFinal = topUpItemsByIdentity(consolidatedFinal, secondaryRelaxedPool, HOT_LIMIT);
        }
        consolidatedFinal = ensureTopPriorityItems(consolidatedFinal, launchPriorityPool, LAUNCH_TOP_RANK_COUNT, HOT_LIMIT);
        if (consolidatedFinal.length < HOT_LIMIT) {
          const absoluteFallbackPool = dedupeByGuidOrLink(
            dedupeItems([...mergedItems, ...fallbackPool]).filter((it) => {
              if (isBlockedCardSourceKey(it?.sourceFeed || "")) return false;
              const ms = toDateMs(it?.pubDate || "");
              const inWindow = ms >= startMs && ms < endExclusiveMs;
              return inWindow && !isNewsDigestCard(it) && !isPromotionalSelfPost(it) && !isSubjectiveStyleStory(it);
            }),
          ).sort((a, b) => {
            const launchDelta = getLaunchPriorityScore(b) - getLaunchPriorityScore(a);
            if (launchDelta !== 0) return launchDelta;
            return toDateMs(b?.pubDate || "") - toDateMs(a?.pubDate || "");
          });
          consolidatedFinal = topUpItemsByIdentity(consolidatedFinal, absoluteFallbackPool, HOT_LIMIT);
        }
        consolidatedFinal = enforceAggregateSourceMinimums(
          consolidatedFinal,
          {
            aitimes: (
              Array.isArray(lastAiTimesBackfillItems) && lastAiTimesBackfillItems.length
                ? lastAiTimesBackfillItems
                : mergedItems
            ).filter((it) => {
              if (String(it?.sourceFeed || "") !== "aitimes_industry") return false;
              const ms = toDateMs(it?.pubDate || "");
              return ms >= startMs && ms < endExclusiveMs;
            }),
            techcrunch: (mergedItems || []).filter((it) => {
              if (String(it?.sourceFeed || "") !== "tc_ai") return false;
              const ms = toDateMs(it?.pubDate || "");
              return ms >= startMs && ms < endExclusiveMs;
            }),
          },
          HOT_LIMIT,
        );
        return {
          meta: { title: `AI Aggregated (${activeSources.length} sources)`, link: "", updated: "" },
          items: consolidatedFinal,
          windowLabel: windowLabel || bundle.windowLabel,
          weekMeta: bundle.weekMeta || null,
          sortBasis: sortBasis === "views" ? "views" : bundle.sortBasis,
        };
      }

      function render(items) {
        const q = (elQ.value || "").trim().toLowerCase();
        const selectedCategoryKey = String(elCategory?.value || "").trim();
        const provider = normalizeAiProvider(currentAiProvider);
        const lang = currentLang === "en" ? "en" : "ko";
        let filtered = !q
          ? items
          : items.filter((it) => {
              const canonical = ensureCanonicalCardText(it);
              const titleKo = it.cardTitleKo || it.titleKo || "";
              const summaryKo = it.cardSummaryKo || it.summaryKo || "";
              const hay = `${canonical.titleEn} ${canonical.summaryEn} ${titleKo} ${summaryKo} ${it.creator} ${(it.categories || []).join(" ")}`.toLowerCase();
              return hay.includes(q);
            });

        if (!filtered.length && q && Array.isArray(items) && items.length) {
          filtered = items;
          if (elQ) elQ.value = "";
        }

        const useCuratedAllItems = selectedCategoryKey === "all_ai" && !q;
        if (useCuratedAllItems) {
          const curatedPool = dedupeByGuidOrLink(Array.isArray(items) ? items : []);
          filtered = curatedPool.slice(0, HOT_LIMIT);
          if (filtered.length < HOT_LIMIT) {
            filtered = topUpItemsByIdentity(filtered, curatedPool, HOT_LIMIT);
          }
        } else {
          const endDateForRender = parseDateInputToUtc((elDatePick?.value || "").trim());
          const renderEndExclusiveMs = Date.UTC(
            endDateForRender.getUTCFullYear(),
            endDateForRender.getUTCMonth(),
            endDateForRender.getUTCDate() + 1,
          );
          const renderStartMs = renderEndExclusiveMs - HOT_WINDOW_DAYS * 24 * 60 * 60 * 1000;

          const strictFiltered = filtered.filter((it) => {
            const ms = toDateMs(it?.pubDate || "");
            const inWindow = ms >= renderStartMs && ms < renderEndExclusiveMs;
            const sourceKey = String(it?.sourceFeed || "");
            const isAiTimes = sourceKey === "aitimes_industry";
            return inWindow && isSourcePriorityCandidate(it, isAiTimes);
          });
          filtered = strictFiltered;
          if (filtered.length < HOT_LIMIT) {
            const relaxedPool = (items || []).filter((it) => {
              const ms = toDateMs(it?.pubDate || "");
              const inWindow = ms >= renderStartMs && ms < renderEndExclusiveMs;
              return inWindow && isSourcePriorityCandidate(it, true);
            });
            filtered = fillHotItems(filtered, relaxedPool, HOT_LIMIT, { allowRelaxedSummary: true });
          }
          if (filtered.length < HOT_LIMIT) {
            const lastResortPool = (items || []).filter((it) => {
              const ms = toDateMs(it?.pubDate || "");
              const inWindow = ms >= renderStartMs && ms < renderEndExclusiveMs;
              return inWindow && isSourcePriorityCandidate(it, true);
            });
            filtered = fillHotItems(filtered, lastResortPool, HOT_LIMIT, { allowRelaxedSummary: true, allowAnySummary: true });
          }
          if (filtered.length < HOT_LIMIT) {
            const qualityBackfillPool = (items || []).filter((it) => {
              const ms = toDateMs(it?.pubDate || "");
              const inWindow = ms >= renderStartMs && ms < renderEndExclusiveMs;
              return inWindow && isSourcePriorityCandidate(it, true);
            });
            filtered = fillHotItems(filtered, qualityBackfillPool, HOT_LIMIT, {
              allowRelaxedSummary: true,
              allowAnySummary: true,
            });
          }
          if (filtered.length < HOT_LIMIT) {
            const finalBackfillPool = (items || []).filter((it) => {
              const ms = toDateMs(it?.pubDate || "");
              const inWindow = ms >= renderStartMs && ms < renderEndExclusiveMs;
              return inWindow && isSourcePriorityCandidate(it, true);
            });
            filtered = fillHotItems(filtered, finalBackfillPool, HOT_LIMIT, {
              allowRelaxedSummary: true,
              allowAnySummary: true,
            });
          }
        }

        // Keep card membership stable across language toggle.
        const isQualityRenderable = (it) => !shouldSkipCardByAiSummary(it, provider, "en");
        const launchSortScore = (it) => {
          // isLaunchFocusedItem: 제목에 출시·업데이트·협업 키워드 있으면 최우선
          const focusedBoost = isLaunchFocusedItem(it) ? 2400 : 0;
          const launchBoost = isLaunchUpdatePriorityItem(it, false) ? 1200 : 0;
          return (
            focusedBoost +
            launchBoost +
            getLaunchPriorityScore(it) * 4 +
            getProductTechBoost(it) * 2 +
            getSourcePriorityBoost(it?.sourceFeed || "")
          );
        };
        const compareLaunchFirst = (a, b) => {
          const aScore = launchSortScore(a);
          const bScore = launchSortScore(b);
          if (bScore !== aScore) return bScore - aScore;
          return toDateMs(b?.pubDate || "") - toDateMs(a?.pubDate || "");
        };

        filtered = (filtered || []).filter((it) => isQualityRenderable(it));
        const refillPool = dedupeByGuidOrLink([
          ...(Array.isArray(items) ? items : []),
          ...(Array.isArray(lastAiTimesBackfillItems) ? lastAiTimesBackfillItems : []),
          ...(Array.isArray(lastAiTimesCandidateItems) ? lastAiTimesCandidateItems : []),
          ...(Array.isArray(lastAiTimesEmergencyItems) ? lastAiTimesEmergencyItems : []),
        ]);
        if (filtered.length < HOT_LIMIT) {
          filtered = topUpItemsByIdentity(filtered, refillPool, HOT_LIMIT, (it) => isQualityRenderable(it));
        }
        if (filtered.length < HOT_LIMIT) {
          // Emergency refill: keep cards visible even when quality filter is too strict.
          filtered = topUpItemsByIdentity(filtered, refillPool, HOT_LIMIT);
        }
        const absolutePool = [
          ...(Array.isArray(items) ? items : []),
          ...(Array.isArray(lastAiTimesBackfillItems) ? lastAiTimesBackfillItems : []),
          ...(Array.isArray(lastAiTimesCandidateItems) ? lastAiTimesCandidateItems : []),
          ...(Array.isArray(lastAiTimesEmergencyItems) ? lastAiTimesEmergencyItems : []),
        ];
        const finalPool = dedupeByGuidOrLink([...(filtered || []), ...absolutePool]).sort(compareLaunchFirst);
        filtered = dedupeWithAiTimesPriority(finalPool, HOT_LIMIT);
        let renderPool = dedupeByGuidOrLink([...(Array.isArray(filtered) ? filtered : []), ...finalPool]).sort(compareLaunchFirst);
        renderPool = dedupeByEditorialKeyPreserveOrder(renderPool);
        renderPool = dedupeWithAiTimesPriority(renderPool, Math.max(HOT_LIMIT * 4, renderPool.length || HOT_LIMIT));

        elGrid.classList.add("hotList");
        if (!renderPool.length) {
          updateAiNetworkStatus([]);
          updateFooterSources([]);
          elGrid.innerHTML = `<div class="note">${t("no_items")}</div>`;
          return;
        }

        log("render-hot", { total: renderPool.length });

        const cardHtml = [];
        const renderItems = [];
        const exclusionReasons = [];
        const bgAssignments = buildFallbackCardBgAssignments(renderPool);
        for (let idx = 0; idx < renderPool.length; idx++) {
          if (cardHtml.length >= HOT_LIMIT) break;
          const it = renderPool[idx];
          const canonical = ensureCanonicalCardText(it);
          let titleText =
            currentLang === "ko"
              ? decodeHtmlEntitiesText(it.cardTitleKo || it.titleKo || canonical.titleEn)
              : decodeHtmlEntitiesText(canonical.titleEn);
          if (currentLang === "ko") {
            titleText = proofreadKoreanHeadlineText(stylizeKoreanHeadlineText(titleText) || titleText);
          } else {
            titleText = proofreadEnglishHeadlineText(titleText) || titleText;
            if (!titleText || /[가-힣]/.test(titleText)) {
              titleText = buildEnglishFallbackTitleFromItem(it);
            }
            if (isGenericEnglishFallbackTitle(titleText) && canonical.titleEn && !isGenericEnglishFallbackTitle(canonical.titleEn)) {
              titleText = decodeHtmlEntitiesText(canonical.titleEn);
            }
          }
          // Initial summary: always use the language-appropriate source.
          // In BILINGUAL_CONTENT_SYNC mode, cardSummaryKo is a Korean translation of canonical English
          // (set by synchronizeBilingualCardTexts). The Groq AI Korean translation overrides later.
          let summaryText =
            currentLang === "ko"
              ? decodeHtmlEntitiesText(it.cardSummaryKo || it.summaryKo || "")
              : decodeHtmlEntitiesText(canonical.summaryEn);
          if (!summaryText) summaryText = t("summary_empty");
          if (isSummaryEmptyText(summaryText)) {
            if (currentLang === "en") {
              // For English mode: never use Korean source text as fallback — it produces Korean sentences in English cards.
              const isKoreanSource = /[가-힣]/.test(it.summaryText || "");
              const fallbackFromRaw = isKoreanSource ? "" : buildEmergencySummaryText(it.summaryText || "", canonical.titleEn || it.title || "");
              const fallbackFromEn = isSummaryEmptyText(canonical.summaryEn) ? "" : decodeHtmlEntitiesText(canonical.summaryEn || "");
              summaryText = fallbackFromRaw || fallbackFromEn || "";
            } else {
              const fallbackFromRaw = buildEmergencySummaryText(it.summaryText || "", canonical.titleEn || it.title || "");
              summaryText = fallbackFromRaw || "";
            }
          }
          if (currentLang === "en" && summaryText && !isSummaryEmptyText(summaryText)) {
            summaryText = proofreadEnglishSummaryText(summaryText, titleText) || summaryText;
            if (/[가-힣]/.test(summaryText)) {
              summaryText = buildEnglishFallbackSummaryFromItem(it, titleText);
            }
            if (isKeywordFallbackSummary(summaryText)) {
              summaryText = "";
            }
          }
          if (currentLang === "ko" && summaryText && /[가-힣]/.test(summaryText) && !isSummaryEmptyText(summaryText)) {
            summaryText = proofreadKoreanSummaryText(summaryText) || summaryText;
          }
          const articleLeadSummary = buildArticleLeadSummaryText(it.__articleBodyText || "", titleText, currentLang);
          if ((!summaryText || isSummaryEmptyText(summaryText) || isSummaryTooShortForCard(summaryText, currentLang)) && articleLeadSummary) {
            summaryText = articleLeadSummary;
          }
          if (!summaryText || isSummaryEmptyText(summaryText)) {
            // For English mode: don't use Korean source text as emergency fallback — it would show Korean in English cards.
            const isKoreanSrc = currentLang === "en" && /[가-힣]/.test(it.summaryText || "");
            const emergencyRawText = isKoreanSrc ? "" : (it.summaryText || "");
            const emergencySummary = emergencyRawText ? buildEmergencySummaryText(emergencyRawText, canonical.titleEn || it.title || titleText || "") : "";
            if (emergencySummary && !isSummaryEmptyText(emergencySummary)) {
              summaryText =
                currentLang === "ko"
                  ? proofreadKoreanSummaryText(stylizeKoreanSummaryText(emergencySummary, titleText)) || emergencySummary
                  : proofreadEnglishSummaryText(emergencySummary, titleText) || emergencySummary;
            }
          }
          if (!summaryText || isSummaryEmptyText(summaryText)) {
            summaryText = ""; // No link-reference fallback — leave blank rather than mislead
          }
          const generatedSummary = getAiCardText(it, "__aiSummary", currentAiProvider, currentLang);
          const generatedQualityScore = getAiSummaryQualityScore(it, provider, lang);
          const fallbackPreferred = shouldPreferFallbackSummary(it, provider, lang);
          const useGeneratedSummary = !fallbackPreferred && (!Number.isFinite(generatedQualityScore) || generatedQualityScore >= 60);
          if (generatedSummary && useGeneratedSummary) {
            const generatedHasHangul = /[가-힣]/.test(generatedSummary);
            const generatedLooksEnglish =
              !generatedHasHangul &&
              isReliableEnglishText(generatedSummary, 18) &&
              !isSummaryTooShortForCard(generatedSummary, "en") &&
              !isKeywordFallbackSummary(generatedSummary);
            const generatedLooksKorean = generatedHasHangul && isReliableKoreanText(generatedSummary, 10) && !isSummaryTooShortForCard(generatedSummary, "ko");
            if (
              (currentLang === "ko" && !generatedLooksKorean) ||
              (currentLang === "en" && !generatedLooksEnglish)
            ) {
              clearAiCardText(it, "__aiSummary", currentAiProvider, currentLang);
              setAiCardMeta(
                it,
                "__aiSummaryError",
                generatedSummary ? "offtopic" : "empty",
                currentAiProvider,
                currentLang,
              );
            } else {
              summaryText = generatedSummary;
            }
          }
          if (currentLang === "ko" && summaryText && !isSummaryEmptyText(summaryText) && !/[가-힣]/.test(summaryText)) {
            if (!BILINGUAL_CONTENT_SYNC) {
              // Non-sync mode: try to find a Korean version from the raw feed
              const koRaw = decodeHtmlEntitiesText(it.cardSummaryKo || it.summaryKo || "").trim();
              if (koRaw && /[가-힣]/.test(koRaw)) {
                summaryText = proofreadKoreanSummaryText(koRaw) || koRaw;
              } else {
                const emergencyRaw = buildEmergencySummaryText(it.summaryText || "", canonical.titleEn || it.title || titleText || "");
                const emergencyKo = proofreadKoreanSummaryText(stylizeKoreanSummaryText(emergencyRaw, titleText) || emergencyRaw) || emergencyRaw;
                if (emergencyKo && /[가-힣]/.test(emergencyKo)) {
                  summaryText = emergencyKo;
                }
                // No "원문 링크" fallback — leave summaryText as English rather than show a bad placeholder
              }
            }
            // BILINGUAL_CONTENT_SYNC=true: keep English AI content as-is.
            // It is the authoritative summary; Korean translation will override on next render cycle.
          }
          if (!BILINGUAL_CONTENT_SYNC && currentLang === "ko" && isSummaryTooShortForCard(summaryText, "ko")) {
            const expandedKo = expandKoreanCardSummary(it, titleText, summaryText);
            if (expandedKo) summaryText = expandedKo;
          }
          if (!BILINGUAL_CONTENT_SYNC && currentLang === "ko" && isSummaryTooShortForCard(summaryText, "ko")) {
            const paddedKo = `${decodeHtmlEntitiesText(summaryText || "").replace(/\s+/g, " ").trim().replace(/[.!?]+$/g, ".")} 세부 기능 및 적용 범위에 관한 업데이트입니다.`;
            summaryText = proofreadKoreanSummaryText(paddedKo) || paddedKo;
          }
          summaryText = ensureCardSummaryDisplayLines(summaryText, it, currentLang, titleText);
          summaryText =
            currentLang === "ko"
              ? proofreadKoreanSummaryText(summaryText) || summaryText
              : proofreadEnglishSummaryText(summaryText, titleText) || summaryText;
          if (currentLang === "en" && isKeywordFallbackSummary(summaryText)) {
            const repairedSummary =
              buildArticleLeadSummaryText(it.__articleBodyText || "", titleText, "en") ||
              decodeHtmlEntitiesText(canonical.summaryEn || "");
            if (repairedSummary && !isKeywordFallbackSummary(repairedSummary)) {
              summaryText = proofreadEnglishSummaryText(repairedSummary, titleText) || repairedSummary;
            }
          }
          const editorialOverrideKey = getEditorialOverrideKeyForItem(it);
          const editorialOverride = getEditorialOverrideByKey(editorialOverrideKey) || resolveEditorialEnglishCardOverride(it, titleText, summaryText);
          if (editorialOverride) {
            if (currentLang === "ko") {
              titleText = decodeHtmlEntitiesText(editorialOverride.titleKo || titleText);
              summaryText = decodeHtmlEntitiesText(editorialOverride.summaryKo || summaryText);
            } else {
              titleText = decodeHtmlEntitiesText(editorialOverride.titleEn || titleText);
              summaryText = decodeHtmlEntitiesText(editorialOverride.summaryEn || summaryText);
            }
          }
          if (currentLang === "en") {
            const repaired = regenerateEnglishCardText(it, canonical, titleText, summaryText);
            titleText = repaired.titleText;
            summaryText = repaired.summaryText;
            const issue = repaired.issue;
            if (issue) {
              const fallbackTitle =
                proofreadEnglishHeadlineText(buildHeadlineText(it?.title || "", it?.summaryText || "")) ||
                buildEnglishFallbackTitleFromItem(it) ||
                decodeHtmlEntitiesText(canonical.titleEn || "") ||
                "AI update";
              const fallbackSummary =
                proofreadEnglishSummaryText(
                  buildArticleLeadSummaryText(it?.__articleBodyText || it?.summaryText || "", fallbackTitle, "en") ||
                    buildEnglishFallbackSummaryFromItem(it, fallbackTitle) ||
                    decodeHtmlEntitiesText(canonical.summaryEn || "") ||
                    "",
                  fallbackTitle,
                ) ||
                decodeHtmlEntitiesText(canonical.summaryEn || "") ||
                "No summary available.";
              titleText = decodeHtmlEntitiesText(fallbackTitle).replace(/\s+/g, " ").trim();
              summaryText = decodeHtmlEntitiesText(fallbackSummary).replace(/\s+/g, " ").trim();
              const label = decodeHtmlEntitiesText(titleText || it?.title || it?.link || "item").slice(0, 100);
              exclusionReasons.push(`review-fixed (${issue}): ${label}`);
            }
          }
          const creatorText = getLocalizedCreatorText(it, currentLang);
          const date = it.pubDate ? new Date(it.pubDate) : null;
          const dateText =
            date && !Number.isNaN(date.valueOf())
              ? date.toLocaleDateString(getLocale(), { year: "numeric", month: "2-digit", day: "2-digit" })
              : "";
          const rank = cardHtml.length + 1;
          const sourceText = getArticleSource(it.link || it.creator);
          const sourceMarkup = it.link
            ? `<a class="hotSourceLink" href="${escapeHtml(it.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(sourceText)}</a>`
            : `<span class="hotSourceText">${escapeHtml(sourceText)}</span>`;
          const topicLabel = editorialOverride?.topicLabel || getCardTopicLabel(it, titleText, summaryText);
          let devInsightText = "";
          if (DEV_INSIGHT_ENABLED) {
            const aiInsightText = getAiCardText(it, "__aiInsight", currentAiProvider, currentLang);
            const aiInsightErrorType = getAiCardMeta(it, "__aiInsightError", currentAiProvider, currentLang);
            const hasAiInsightAttempt = hasAiCardText(it, "__aiInsight", currentAiProvider, currentLang);
            const aiInsightUsable =
              aiInsightText &&
              !isInsightTooSimilarToSummary(aiInsightText, summaryText, currentLang) &&
              isInsightRelevantToContext(aiInsightText, it, titleText, summaryText, currentLang);
            const fallbackInsightText = !USE_BACKEND ? buildLocalInsightText(it, titleText, summaryText, currentLang) : "";
            if (aiInsightUsable) {
              devInsightText = aiInsightText;
            } else if (!USE_BACKEND) {
              devInsightText = fallbackInsightText;
            } else if (!hasAiInsightAttempt) {
              devInsightText = t("dev_insight_loading");
            } else if (aiInsightErrorType === "network") {
              devInsightText = t("dev_insight_network");
            } else {
              devInsightText = "";
            }
          }
          const shouldRenderInsight = DEV_INSIGHT_ENABLED && !!devInsightText;
          const bgInfo = bgAssignments[idx] || {
            hasSourceImage: false,
            primaryCardBg: "",
            fallbackCardBg: "./HUMAN-AI.jpg",
            fallbackCardBgSecondary: "./HUMAN-AI.jpg",
            fallbackCardBgTertiary: "./HUMAN-AI.jpg",
            fallbackCardBgQuaternary: "./HUMAN-AI.jpg",
            fallbackCardBgQuinary: "./HUMAN-AI.jpg",
          };
          const primaryCardBg = bgInfo.primaryCardBg;
          const fallbackCardBg = bgInfo.fallbackCardBg;
          const fallbackCardBgSecondary = bgInfo.fallbackCardBgSecondary;
          const fallbackCardBgTertiary = bgInfo.fallbackCardBgTertiary;
          const fallbackCardBgQuaternary = bgInfo.fallbackCardBgQuaternary;
          const fallbackCardBgQuinary = bgInfo.fallbackCardBgQuinary;
          const fallbackLayers = [fallbackCardBg, fallbackCardBgSecondary, fallbackCardBgTertiary, fallbackCardBgQuaternary, fallbackCardBgQuinary]
            .filter(Boolean)
            .map((url) => `url('${escapeHtml(url)}')`)
            .join(", ");
          const baseLayers = fallbackLayers || `url('./HUMAN-AI.jpg')`;
          const cardBgLayer = primaryCardBg ? `url('${escapeHtml(primaryCardBg)}')` : baseLayers;
          const bgStyle = `--card-bg:${cardBgLayer};`;
          const cardClass = bgInfo.hasSourceImage ? "hotCard hotCardBg hasImage" : "hotCard hotCardBg noImage";
          cardHtml.push(`
            <article class="${cardClass}" style="--delay:${idx * 70}ms;${bgStyle}">
              <div class="hotCardOverlay"></div>
              <div class="hotBody">
                <div class="hotTopline">
                  <span class="hotRank">${t("hot_rank")} ${rank}</span>
                  <span class="hotTopicPill">${escapeHtml(topicLabel)}</span>
                </div>
                <h3 class="hotHeadline">
                  <a href="${escapeHtml(it.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(titleText)}</a>
                </h3>
                <div class="hotMeta">
                  ${creatorText ? `<span>${escapeHtml(creatorText)}</span>` : ""}
                  ${dateText ? `<span>${escapeHtml(dateText)}</span>` : ""}
                </div>
                <p class="summaryLabel">${t("summary_label")}</p>
                <p class="hotDesc">${escapeHtml(summaryText)}</p>
                ${shouldRenderInsight
                  ? `<div class="hotInsight">
                      <p class="hotInsightLabel">${t("dev_insight_label")}</p>

      async function fetchFeedJson(cat, dateStr) {
        const params = new URLSearchParams({ cat });
        if (dateStr) params.set("date", dateStr);
        const url = `${BACKEND_API}?${params.toString()}`;
        log("fetch-feed", { url });
        const res = await fetchWithTimeout(url, { method: "GET", cache: "no-store" }, NETWORK_FETCH_TIMEOUT_MS);
        if (res.status === 404) {
          log("fetch-feed-404", { url });
          return { meta: { title: "", link: "", updated: "" }, items: [] };
        }
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        return await res.json();
      }

        // 브라우저 CORS 문제를 피하기 위해 프록시 사용

      function toAbsoluteUrl(url, baseUrl) {
        const raw = String(url || "").trim();
        if (!raw) return "";
        try {
          return new URL(raw, baseUrl || location.href).href;
        } catch (e) {
          return raw;
        }
      }

      function normalizeAiTimesPubDate(rawDateText) {
        const raw = decodeHtmlEntitiesText(rawDateText || "");
        if (!raw) return "";

        const full = raw.match(/^(\d{4})[.-](\d{2})[.-](\d{2})(?:\s+(\d{2}):(\d{2}))?$/);
        if (full) {
          const y = Number(full[1]);
          const m = Number(full[2]);
          const d = Number(full[3]);
          const hh = Number(full[4] || "0");
          const mm = Number(full[5] || "0");
          const utcMs = Date.UTC(y, m - 1, d, hh - 9, mm, 0);
          if (!Number.isNaN(utcMs)) return new Date(utcMs).toISOString();
          return "";
        }

        const md = raw.match(/^(\d{2})-(\d{2})\s+(\d{2}):(\d{2})$/);
        if (md) {
          const now = new Date();
          let y = now.getFullYear();
          const m = Number(md[1]);
          const d = Number(md[2]);
          const hh = Number(md[3]);
          const mm = Number(md[4]);
          let utcMs = Date.UTC(y, m - 1, d, hh - 9, mm, 0);
          if (utcMs - Date.now() > 36 * 60 * 60 * 1000) {
            y -= 1;
            utcMs = Date.UTC(y, m - 1, d, hh - 9, mm, 0);
          }
          if (!Number.isNaN(utcMs)) return new Date(utcMs).toISOString();
        }
        return "";
      }

      function parseAiTimesList(htmlText, source) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(String(htmlText || ""), "text/html");
        const feedUrl = String(source?.url || "");
        const feedLabel = String(source?.label || "AI Times - AI Industry");

        const titleNode = doc.querySelector(".altlist-title");
        const titleRaw = titleNode?.childNodes?.[0]?.textContent || titleNode?.textContent || "";
        const feedTitle = decodeHtmlEntitiesText(titleRaw).replace(/\s+/g, " ").trim() || feedLabel;
        lastFeedMeta = { title: feedTitle, link: feedUrl, updated: "" };

        const rows = Array.from(doc.querySelectorAll("li.altlist-webzine-item"));
        const mapped = rows
          .map((row) => {
            const subjectLink =
              row.querySelector("h2.altlist-subject a") ||
              row.querySelector(".altlist-subject a") ||
              row.querySelector("a[href*='articleView.html']");
            const href = toAbsoluteUrl(subjectLink?.getAttribute("href") || "", feedUrl);
            const titleText = decodeHtmlEntitiesText(subjectLink?.textContent || "");
            const summaryText = decodeHtmlEntitiesText(row.querySelector(".altlist-summary")?.textContent || "");
            const imgNode = row.querySelector("a.altlist-image img, .altlist-image img");
            const imgRaw = toAbsoluteUrl(
              imgNode?.getAttribute("src") || imgNode?.getAttribute("data-src") || imgNode?.getAttribute("data-original") || "",
              feedUrl,
            );
            const info = Array.from(row.querySelectorAll(".altlist-info .altlist-info-item")).map((n) =>
              decodeHtmlEntitiesText(n?.textContent || ""),
            );
            const category = info[0] || "AI산업";
            const creator = info[1] || "AI Times";
            const pubDate = normalizeAiTimesPubDate(info[2] || "") || new Date().toISOString();
            const idxMatch = href.match(/[?&]idxno=(\d+)/i);
            const guid = idxMatch?.[1] ? `aitimes-${idxMatch[1]}` : href || titleText;
            if (!href || !titleText) return null;
            return {
              title: titleText,
              link: href,
              guid,
              pubDate,
              creator,
              categories: category ? [category] : ["AI산업"],
              summaryText,
              imgUrl: normalizeImageUrl(imgRaw),
            };
          })
          .filter(Boolean);

        const dedupe = (items) => {
          const seen = new Set();
          const out = [];
          for (const it of items || []) {
            const key = String(it?.guid || it?.link || it?.title || "").trim();
            if (!key || seen.has(key)) continue;
            seen.add(key);
            out.push(it);
          }
          return out;
        };

        const strictItems = dedupe(mapped);
        if (strictItems.length) return strictItems;

        // Fallback parser: recover list when AI Times markup classes change.
        const fallback = [];
        const fallbackSeen = new Set();
        const anchors = Array.from(doc.querySelectorAll("a[href*='articleView.html']"));
        anchors.forEach((anchor) => {
          if (fallback.length >= 120) return;
          const href = toAbsoluteUrl(anchor.getAttribute("href") || "", feedUrl);
          if (!href || !/[?&]idxno=\d+/i.test(href)) return;
          const idxMatch = href.match(/[?&]idxno=(\d+)/i);
          const guid = idxMatch?.[1] ? `aitimes-${idxMatch[1]}` : href;
          if (!guid || fallbackSeen.has(guid)) return;

          const titleText = decodeHtmlEntitiesText(anchor.textContent || "").replace(/\s+/g, " ").trim();
          if (!titleText || titleText.length < 10) return;

          const block = anchor.closest("li,article,section,div") || anchor.parentElement || anchor;
          const blockText = decodeHtmlEntitiesText(block?.textContent || "").replace(/\s+/g, " ").trim();
          let summaryText =
            decodeHtmlEntitiesText(
              block?.querySelector(".altlist-summary, .summary, .article-summary, .list-summary, p")?.textContent || "",
            )
              .replace(/\s+/g, " ")
              .trim() || "";
          if (!summaryText && blockText) {
            summaryText = blockText.replace(titleText, " ").replace(/\s+/g, " ").trim();
          }

          const imgNode = block?.querySelector("img");
          const imgRaw = toAbsoluteUrl(
            imgNode?.getAttribute("src") || imgNode?.getAttribute("data-src") || imgNode?.getAttribute("data-original") || "",
            feedUrl,
          );

          const dateMatch = blockText.match(/(\d{4}[./-]\d{1,2}[./-]\d{1,2}\s+\d{1,2}:\d{2})|(\d{2}[./-]\d{2}\s+\d{1,2}:\d{2})/);
          const creatorMatch = blockText.match(/([가-힣]{2,4}\s*기자)/);
          const categoryMatch = blockText.match(/(산업일반|메타버스|AI 기업|AI기업|영어뉴스|English News|기타|정책|AI산업)/i);
          const creator = decodeHtmlEntitiesText(creatorMatch?.[1] || "AI Times").replace(/\s+/g, " ").trim();
          const category = decodeHtmlEntitiesText(categoryMatch?.[1] || "AI산업").replace(/\s+/g, " ").trim();
          const pubDate =
            normalizeAiTimesPubDate(dateMatch?.[0] || "") ||
            normalizeLooseHtmlPubDate(dateMatch?.[0] || "") ||
            new Date().toISOString();

          fallbackSeen.add(guid);
          fallback.push({
            title: titleText,
            link: href,
            guid,
            pubDate,
            creator,
            categories: category ? [category] : ["AI산업"],
            summaryText,
            imgUrl: normalizeImageUrl(imgRaw),
          });
        });

        return dedupe(fallback);
      }

      function normalizeLooseHtmlPubDate(rawDateText) {
        const raw = decodeHtmlEntitiesText(rawDateText || "").replace(/\s+/g, " ").trim();
        if (!raw) return "";
        const parsed = new Date(raw);
        if (!Number.isNaN(parsed.valueOf())) return parsed.toISOString();
        const ymd = raw.match(/(\d{4})[./-](\d{1,2})[./-](\d{1,2})/);
        if (ymd) {
          const utcMs = Date.UTC(Number(ymd[1]), Number(ymd[2]) - 1, Number(ymd[3]), 0, 0, 0);
          if (!Number.isNaN(utcMs)) return new Date(utcMs).toISOString();
        }
        return "";
      }

      function parseGenericAnchorFeed(htmlText, source, options = {}) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(String(htmlText || ""), "text/html");
        const feedUrl = String(source?.url || "");
        const titleNode = doc.querySelector("title");
        lastFeedMeta = {
          title: decodeHtmlEntitiesText(titleNode?.textContent || source?.label || source?.key || "").replace(/\s+/g, " ").trim(),
          link: feedUrl,
          updated: "",
        };

        const hrefPattern = options.hrefPattern instanceof RegExp ? options.hrefPattern : /.*/i;
        const anchors = Array.from(doc.querySelectorAll("a[href]"));
        const items = [];
        const seen = new Set();

        for (const anchor of anchors) {
          const href = toAbsoluteUrl(anchor.getAttribute("href") || "", feedUrl);
          const titleText = decodeHtmlEntitiesText(anchor.textContent || "").replace(/\s+/g, " ").trim();
          if (!href || !titleText || titleText.length < 14) continue;
          if (!hrefPattern.test(href)) continue;
          if (options.excludePattern && options.excludePattern.test(href)) continue;

          const key = href.toLowerCase();
          if (seen.has(key)) continue;
          seen.add(key);

          const container = anchor.closest("article, li, section, div") || anchor.parentElement || anchor;
          const summaryText = decodeHtmlEntitiesText(
            container?.querySelector("p")?.textContent ||
              container?.querySelector("[class*='summary'], [class*='excerpt'], [class*='dek']")?.textContent ||
              "",
          )
            .replace(/\s+/g, " ")
            .trim();
          const timeNode = container?.querySelector("time");
          const pubDate =
            normalizeLooseHtmlPubDate(timeNode?.getAttribute("datetime") || timeNode?.textContent || "") || new Date().toISOString();
          const imgNode = container?.querySelector("img");
          const imgRaw = toAbsoluteUrl(
            imgNode?.getAttribute("src") || imgNode?.getAttribute("data-src") || imgNode?.getAttribute("srcset")?.split(",")?.[0]?.trim()?.split(" ")?.[0] || "",
            feedUrl,
          );
          items.push({
            title: titleText,
            link: href,
            guid: href,
            pubDate,
            creator: source?.label || "",
            categories: options.category ? [options.category] : [],
            summaryText,
            imgUrl: normalizeImageUrl(imgRaw),
          });
          if (items.length >= 60) break;
        }

        return dedupeByGuidOrLink(items);
      }

      function parseTldrAiDigest(htmlText, source) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(String(htmlText || ""), "text/html");

      function parseFeedPayloadForSource(source, payloadText) {
        const parserType = String(source?.parser || "");
        if (parserType === "aitimes_list" || source?.key === "aitimes_industry") {
          return parseAiTimesList(payloadText, source);
        }
        if (parserType === "rundown_ai") {
          return parseGenericAnchorFeed(payloadText, source, {
            hrefPattern: /\/p\/[^/?#]+/i,
            category: "Newsletter",
          });
        }
        if (parserType === "superhuman_ai") {
          return parseGenericAnchorFeed(payloadText, source, {
            hrefPattern: /\/p\/[^/?#]+/i,
            category: "Newsletter",
          });
        }
        if (parserType === "tldr_ai_digest") {
          return parseTldrAiDigest(payloadText, source);
        }
        if (parserType === "anthropic_news") {
          return parseGenericAnchorFeed(payloadText, source, {
            hrefPattern: /\/news\/[^/]+/i,
            category: "Company",
          });
        }
        if (parserType === "meta_ai_blog") {
          return parseGenericAnchorFeed(payloadText, source, {
            hrefPattern: /\/blog\/[^/]+/i,
            excludePattern: /\/blog\/?$/i,
            category: "Technology",
          });
        }
        if (parserType === "anandtech_ai") {
          return parseGenericAnchorFeed(payloadText, source, {
            hrefPattern: /\/show\/\d+/i,
            category: "Hardware",
          });
        }
        return parseRss(payloadText);
      }

      function buildAiTimesPagedUrl(baseUrl, page) {
        const safePage = Math.max(1, Number(page) || 1);
        try {
          const u = new URL(String(baseUrl || ""), location.href);
          if (safePage <= 1) {
            u.searchParams.delete("page");
            u.searchParams.delete("pageNo");
            return u.href;
          }
          u.searchParams.set("page", String(safePage));
          return u.href;
        } catch (e) {
          const raw = String(baseUrl || "").trim();
          if (!raw || safePage <= 1) return raw;
          return `${raw}${raw.includes("?") ? "&" : "?"}page=${safePage}`;
        }
      }

      async function fetchAiTimesPagedItems(source, maxPages = AITIMES_MAX_PAGES) {
        if (!source?.url) return [];
        const rawPages = Number(maxPages);
        const pages = Number.isFinite(rawPages) ? Math.max(1, rawPages) : Number.POSITIVE_INFINITY;
        const seen = new Set();
        const out = [];
        const startedAt = Date.now();

        for (let page = 1; page <= pages; page++) {
          if (Date.now() - startedAt > AITIMES_FETCH_SOFT_TIMEOUT_MS) break;
          const pageUrl = buildAiTimesPagedUrl(source.url, page);
          let payloadText = "";
          try {
            payloadText = await fetchRssXml(pageUrl);
          } catch (e) {
            if (page === 1) throw e;
            break;
          }

          const parsed = parseAiTimesList(payloadText, { ...source, url: pageUrl });
          if (!Array.isArray(parsed) || !parsed.length) break;
          let added = 0;
          for (const it of parsed || []) {
            const key = String(it?.guid || it?.link || it?.title || "").trim();
            if (!key || seen.has(key)) continue;
            seen.add(key);
            out.push(it);
            added++;
          }
          if (page > 1 && added === 0) break;
        }

        return out;
      }

      async function fetchSourceItemsWithParser(source) {
        if (!source?.url) return [];
        const parserType = String(source?.parser || "");
        if (parserType === "aitimes_list" || source?.key === "aitimes_industry") {
          return await fetchAiTimesPagedItems(source);
        }
        const payloadText = await fetchRssXml(source.url);
        return parseFeedPayloadForSource(source, payloadText);
      }

      function parseRss(xmlText) {
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");

        // 파서 체크
        const parserError = xml.querySelector("parsererror");
        if (parserError) {
          throw new Error("RSS XML 파싱 실패 (parsererror)");
        }

        const channel = xml.querySelector("channel");
        const feedTitle = channel?.querySelector("title")?.textContent?.trim?.() ?? "";
        const feedLink = channel?.querySelector("link")?.textContent?.trim?.() ?? "";
        const updated = channel?.querySelector("lastBuildDate")?.textContent?.trim?.() ?? "";
        lastFeedMeta = { title: feedTitle, link: feedLink, updated };

        const items = Array.from(xml.querySelectorAll("item")).map(mapItem);

        // 중복 제거(guid 기준)
        const seen = new Set();
        const deduped = [];
        for (const it of items) {
          if (seen.has(it.guid)) continue;
          seen.add(it.guid);
          deduped.push(it);
        }
        return deduped;
      }

            <div class="note" style="grid-column: 1 / -1;">
              <div style="font-weight:600; color: rgba(255,255,255,0.92);">${t("err_title")}</div>
              <div style="margin-top:6px;">${t("err_label")} <code>${escapeHtml(String(err?.message || err))}</code></div>
              <div style="margin-top:8px;">
                <ul style="margin: 0; padding-left: 18px;">
                  <li>${t("err_tip1")}</li>
                  <li>${t("err_tip2")}</li>
                  <li>${t("err_tip3")}</li>
                </ul>
              </div>
            </div>
          `;
        }
      }

      function init() {
        loadOgCacheFromStorage();
        loadKoTranslateCacheFromStorage();
        loadEnTranslateCacheFromStorage();
        loadActiveSourcesFromStorage();
        loadAiProviderFromStorage();
        // Restore last-used language (default "en"); fall back to "en" for any unrecognised value
        try {
          const savedLang = localStorage.getItem("lang");
          if (savedLang === "ko" || savedLang === "en") currentLang = savedLang;
        } catch (e) {}
        applyI18n();
        // Options
        elCategory.innerHTML = FEEDS.map((f) => `<option value="${f.key}">${f.label}</option>`).join("");
        elCategory.value = "all_ai";
        elDatePick.value = new Date().toISOString().slice(0, 10);
        elQ.value = "";
        renderSourceToggles();

        elCategory.addEventListener("change", () => {
          renderSourceToggles();
          setMetaText();
          loadCurrentFeed();
        });
        elDatePick.addEventListener("change", loadCurrentFeed);
        elReload.addEventListener("click", loadCurrentFeed);
        elQ.addEventListener("input", () => render(lastItems));
        elAiProviderSelect?.addEventListener("change", () => {
          currentAiProvider = normalizeAiProvider(elAiProviderSelect.value);
          saveAiProviderToStorage();
          setMetaText();
          if (lastItems.length) render(lastItems);
        });
        elSourceToggles?.addEventListener("click", (e) => {
          const btn = e.target && e.target.closest ? e.target.closest(".sourceChip") : null;
          if (!btn) return;
          const key = btn.getAttribute("data-source-key") || "";
          if (!AGGREGATE_SOURCE_KEYS.includes(key)) return;
          const isRequiredSource = REQUIRED_AGGREGATE_SOURCE_KEYS.includes(key);

          const next = new Set(activeAggregateSourceKeys);
          if (next.has(key)) {
            if (isRequiredSource) return;
            if (next.size === 1) return;
            next.delete(key);
          } else {
            next.add(key);
          }

          activeAggregateSourceKeys = new Set(withRequiredAggregateSourceKeys(Array.from(next)));
          saveActiveSourcesToStorage();
          renderSourceToggles();
          setMetaText();
          loadCurrentFeed();
        });
        elLangToggle?.addEventListener("click", async () => {
          const prevStatus = { ...lastStatus };
          currentLang = currentLang === "ko" ? "en" : "ko";
          try {
            localStorage.setItem("lang", currentLang);
          } catch (e) {}
          applyI18n();
          renderSourceToggles();
          setMetaText();
          if (lastItems.length) {
            lastItems.forEach((it) => ensureCanonicalCardText(it));
          }
          if (currentLang === "en" && lastItems.length) {
            setStatus("warn", t("status_loading"), "status_loading");
            await localizeItemsToEnglish(lastItems);
          }
          if (currentLang === "ko" && lastItems.length) {
            setStatus("warn", t("status_loading"), "status_loading");
            await localizeItemsToKorean(lastItems);
          }
          if (lastItems.length) {
            await synchronizeBilingualCardTexts(lastItems);
          }
          setStatus(prevStatus.kind, t(prevStatus.key), prevStatus.key);
          render(lastItems);
        });
        elGrid.addEventListener(
          "click",
          (e) => {
            const btn = e.target && e.target.closest ? e.target.closest(".navBtn") : null;
            if (!btn) return;
            if (btn.id === "navPrev") {
              if (navHandlers.prev) navHandlers.prev();
              else log("nav-miss", { dir: "prev" });
            } else if (btn.id === "navNext") {
              if (navHandlers.next) navHandlers.next();
              else log("nav-miss", { dir: "next" });
            }
          },
          true,
        );

        setStatus("", t("status_idle"), "status_idle");
        setMetaText();
        loadCurrentFeed();
      }

init();
    </script>
  </body>
</html>
