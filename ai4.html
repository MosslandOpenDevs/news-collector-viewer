      function getHotTitleText() {
        if (!hotWeekMeta) return t("hot_title");
        const weekLabel = formatMonthWeekLabel(hotWeekMeta);
        return currentLang === "ko" ? `${weekLabel} AI HOT TOP ${HOT_LIMIT}` : `AI HOT TOP ${HOT_LIMIT} - ${weekLabel}`;
      }

      function formatHeroWeekLabel(meta) {
        if (!meta) return "";
        return `${meta.year}-${String(meta.month).padStart(2, "0")} Week ${meta.week}`;
      }

      function setHeroWeekLabel() {
        if (!elHeroWeekLabel) return;
        const fallbackMeta = buildMonthWeekMeta(parseDateInputToUtc((elDatePick?.value || "").trim()));
        const meta = hotWeekMeta || fallbackMeta;
        elHeroWeekLabel.textContent = formatHeroWeekLabel(meta);
      }

      function escapeHtml(s) {
        return (s ?? "").replace(
          /[&<>"]/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
            })[c],
        );
      }

      function stripHtml(html) {
        const div = document.createElement("div");
        div.innerHTML = html || "";
        return (div.textContent || "").trim();
      }

      function firstImageUrlFromHtml(html) {
        if (!html) return "";
        // 단순 img src/data-src/srcset 추출
        const src = html.match(/<img[^>]+src=["']([^"']+)["']/i);
        if (src && src[1]) return src[1];
        const dataSrc = html.match(/<img[^>]+data-src=["']([^"']+)["']/i);
        if (dataSrc && dataSrc[1]) return dataSrc[1];
        const dataOrig = html.match(/<img[^>]+data-original=["']([^"']+)["']/i);
        if (dataOrig && dataOrig[1]) return dataOrig[1];
        const srcset = html.match(/<img[^>]+srcset=["']([^"']+)["']/i);
        if (srcset && srcset[1]) {
          const first = srcset[1].split(",")[0]?.trim()?.split(" ")[0];
          if (first) return first;
        }
        return "";
      }

      function normalizeImageUrl(url) {
        if (!url) return "";
        let u = url.trim();
        if (u.startsWith("//")) u = "https:" + u;
        if (!/^https?:\/\//i.test(u)) return "";
        return u;
      }

      function buildPexelsPhotoUrl(photoId, width = 1800, height = 1100) {
        const id = String(photoId || "").replace(/[^\d]/g, "");
        if (!id) return "";
        return `https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=${width}&h=${height}&fit=crop`;
      }

      function buildProxyImageUrl(rawUrl, quality = "high", useAlt = false) {
        const normalized = normalizeImageUrl(rawUrl);
        if (!normalized) return "";
        const baseProxy = useAlt ? IMG_PROXY_ALT : IMG_PROXY;
        const width = quality === "low" ? IMG_LOW_W : IMG_HIGH_W;
        const imageQuality = quality === "low" ? IMG_QUALITY_LOW : IMG_QUALITY_HIGH;
        return `${baseProxy}${encodeURIComponent(normalized)}&w=${width}&q=${imageQuality}&fit=cover`;
      }

      function buildImageCandidateUrls(rawUrl, quality = "high") {
        const normalized = normalizeImageUrl(rawUrl);
        if (!normalized) return [];
        return Array.from(new Set([normalized, buildProxyImageUrl(normalized, quality, false), buildProxyImageUrl(normalized, quality, true)].filter(Boolean)));
      }

      function buildImageUrl(rawUrl, quality) {
        return buildImageCandidateUrls(rawUrl, quality)[0] || "";
      }

      function shouldLoadHighRes() {
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (!conn || !conn.effectiveType) return true;
        const type = conn.effectiveType;
        return type === "4g";
      }

      async function fetchTextWithProxyRetry(url, timeoutMs = 12000) {
        const attempts = [];
        for (const makeProxyUrl of CORS_PROXIES) {
          const target = makeProxyUrl(url);
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), timeoutMs);
          try {
            const res = await fetch(target, { method: "GET", cache: "no-store", signal: controller.signal });
            clearTimeout(timer);
            if (!res.ok) {
              attempts.push(`${res.status} ${target}`);
              continue;
            }
            if (target.includes("/get?url=")) {
              const j = await res.json();
              const body = j?.contents || "";
              if (body) return body;
              attempts.push(`empty-body ${target}`);
              continue;
            }
            return await res.text();
          } catch (e) {
            clearTimeout(timer);
            attempts.push(`${String(e?.message || e)} ${target}`);
          }
        }
        throw new Error(`proxy_fetch_failed: ${attempts.slice(0, 3).join(" | ") || "unknown"}`);
      }

      function setStageBg(bgEl, url) {
        if (!bgEl || !url) return;
        bgEl.style.backgroundImage = `url('${url}')`;
      }

      function upgradeStageBg(bgEl, rawUrl) {
        if (!bgEl || !rawUrl) return;
        setStageBg(bgEl, buildImageUrl(rawUrl, "low"));
        if (shouldLoadHighRes()) {
          preloadImage(buildImageUrl(rawUrl, "high")).then(() => {
            setStageBg(bgEl, buildImageUrl(rawUrl, "high"));
          });
        }
      }

      async function fetchOgImageUrl(pageUrl) {
        if (!pageUrl) return "";
        if (ogImageCache.has(pageUrl)) {
          const cached = ogImageCache.get(pageUrl) || "";
          if (cached) return cached;
        }
        try {
          const html = await fetchTextWithProxyRetry(pageUrl);
          const m =
            html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i) ||
            html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
          const url = m && m[1] ? normalizeImageUrl(m[1]) : "";
          ogImageCache.set(pageUrl, url);
          saveOgCacheToStorage();
          return url;
        } catch (e) {
          ogImageCache.delete(pageUrl);
          return "";
        }
      }

      function preloadImage(url) {
        if (!url) return Promise.resolve(false);
        const cached = imagePreloadCache.get(url);
        if (cached && cached !== "loading" && cached !== "error") return Promise.resolve(cached);
        if (imagePreloadCache.get(url) === "loading") return Promise.resolve(false);
        imagePreloadCache.set(url, "loading");
        const normalized = normalizeImageUrl(url);
        const candidates = normalized ? buildImageCandidateUrls(normalized, "high") : [String(url || "").trim()].filter(Boolean);
        const load = (candidateIndex) =>
          new Promise((resolve) => {
            const u = candidates[candidateIndex] || "";
            if (!u) {
              imagePreloadCache.set(url, "error");
              resolve(false);
              return;
            }
            const img = new Image();
            img.onload = () => {
              imagePreloadCache.set(url, u);
              resolve(u);
            };
            img.onerror = () => {
              if (candidateIndex + 1 < candidates.length) {
                load(candidateIndex + 1).then(resolve);
                return;
              }
              imagePreloadCache.set(url, "error");
              resolve("");
            };
            img.src = u;
          });
        return load(0);
      }

      async function ensureImageForItem(item) {
        if (!item) return "";
        if (item.imgUrl) {
          const lowOk = await preloadImage(buildImageUrl(item.imgUrl, "low"));
          let highOk = true;
          if (shouldLoadHighRes()) {
            highOk = await preloadImage(buildImageUrl(item.imgUrl, "high"));
          }
          const resolvedUrl = highOk || lowOk || item.imgUrl;
          if (resolvedUrl) {
            item.displayImgUrl = normalizeImageUrl(String(resolvedUrl || "").trim()) || item.imgUrl;
            return item.displayImgUrl;
          }
          item.imgUrl = "";
        }
        if (!item.link) return "";
        const ogUrl = await fetchOgImageUrl(item.link);
        if (ogUrl) {
          item.imgUrl = ogUrl;
          const lowOk = await preloadImage(buildImageUrl(ogUrl, "low"));
          let highOk = true;
          if (shouldLoadHighRes()) {
            highOk = await preloadImage(buildImageUrl(ogUrl, "high"));
          }
          const resolvedUrl = highOk || lowOk || ogUrl;
          if (resolvedUrl) {
            item.displayImgUrl = normalizeImageUrl(String(resolvedUrl || "").trim()) || ogUrl;
            return item.displayImgUrl;
          }
          item.imgUrl = "";
        }
        return "";
      }

      async function preloadAllImagesInOrder(items, startIndex) {
        if (!items.length) return;
        if (preloadQueueRunning) return;
        preloadQueueRunning = true;
        const total = items.length;
        let cursor = startIndex;
        let inFlight = 0;

        const nextIndex = () => {
          const idx = cursor;
          cursor = (cursor + 1) % total;
          return idx;
        };

        const runOne = async () => {
          const idx = nextIndex();
          const item = items[idx];
          await ensureImageForItem(item);
        };

        const runners = [];
        for (let i = 0; i < Math.min(IMG_PRELOAD_CONCURRENCY, total); i++) {
          runners.push(
            (async function loop() {
              while (true) {
                await runOne();
                if (cursor === startIndex) break;
              }
            })(),
          );
        }

        await Promise.all(runners);
        preloadQueueRunning = false;
      }

      function hydrateMissingImages(filteredItems, sourceItems) {
        if (imageRefreshPending) return;
        const targets = (filteredItems || []).filter((it) => !it.imgUrl && it.link).slice(0, OG_FETCH_LIMIT);
        if (!targets.length) return;
        imageRefreshPending = true;
        Promise.allSettled(targets.map((it) => ensureImageForItem(it)))
          .then(() => {
            const hasFilled = targets.some((it) => !!it.imgUrl);
            if (hasFilled) render(sourceItems);
          })
          .finally(() => {
            imageRefreshPending = false;
          });
      }

      function textFromNode(parent, selector) {
        const n = parent.querySelector(selector);
        return n?.textContent?.trim?.() ?? "";
      }

      function attrFromNode(parent, selector, attr) {
        const n = parent.querySelector(selector);
        return n?.getAttribute?.(attr) ?? "";
      }

      function mapItem(itemEl) {
        const title = textFromNode(itemEl, "title") || "(No title)";
        const link = textFromNode(itemEl, "link");
        const guid = textFromNode(itemEl, "guid") || link || title;
        const pubDate = textFromNode(itemEl, "pubDate");

        // author: dc:creator / author
        const creator = textFromNode(itemEl, "dc\\:creator") || textFromNode(itemEl, "creator") || textFromNode(itemEl, "author");

        // categories
        const categories = Array.from(itemEl.querySelectorAll("category"))
          .map((x) => x.textContent.trim())
          .filter(Boolean);

        // description / content
        const descHtml = textFromNode(itemEl, "description");
        const contentHtml = textFromNode(itemEl, "content\\:encoded");
        const summaryHtml = contentHtml || descHtml;
        const summaryText = stripHtml(summaryHtml);

        // image
        // RSS 사례: enclosure / media:content / media:thumbnail / img in html
        const enclosureUrl = attrFromNode(itemEl, "enclosure", "url");
        const mediaUrl = attrFromNode(itemEl, "media\\:content", "url") || attrFromNode(itemEl, "media\\:thumbnail", "url");
        const imgUrl = mediaUrl || enclosureUrl || firstImageUrlFromHtml(summaryHtml);

        return { title, link, guid, pubDate, creator, categories, summaryText, imgUrl: normalizeImageUrl(imgUrl) };
      }

      function utcDateKey(date) {
        if (!(date instanceof Date) || Number.isNaN(date.valueOf())) return "";
        return date.toISOString().slice(0, 10);
      }

      function parseDateInputToUtc(dateStr) {
        const raw = (dateStr || "").trim();
        if (!raw) return new Date();
        const parsed = new Date(`${raw}T00:00:00Z`);
        return Number.isNaN(parsed.valueOf()) ? new Date() : parsed;
      }

      function getWeekOfMonthUtc(date) {
        const d = date instanceof Date ? date : new Date(date || Date.now());
        // Calendar-correct week of month: count which Monday-starting week the date falls in.
        // e.g. if April 1 is Wednesday, April 6 (first Monday) starts week 2, April 13 starts week 3.
        const firstOfMonth = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
        // Monday = 0, ..., Sunday = 6
        const firstDayOffset = (firstOfMonth.getUTCDay() + 6) % 7;
        return Math.ceil((d.getUTCDate() + firstDayOffset) / 7);
      }

      function buildMonthWeekMeta(date) {
        const d = date instanceof Date ? date : new Date(date || Date.now());
        return {
          year: d.getUTCFullYear(),
          month: d.getUTCMonth() + 1,
          week: getWeekOfMonthUtc(d),
        };
      }

      function formatMonthWeekLabel(meta) {
        if (!meta) return "";
        if (currentLang === "ko") return `${meta.year}년 ${meta.month}월 ${meta.week}주차`;
        const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const monthName = monthNames[(meta.month - 1)] || String(meta.month);
        return `${monthName} ${meta.year}, Week ${meta.week}`;
      }

      function buildWindowDates(endDate, days) {
        const d = endDate instanceof Date ? endDate : new Date();
        const baseUtc = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
        const out = [];
        for (let i = 0; i < days; i++) {
          out.push(utcDateKey(new Date(baseUtc - i * 24 * 60 * 60 * 1000)));
        }
        return out;
      }

      function toMetricNumber(value) {
        if (typeof value === "number" && Number.isFinite(value)) return value;
        if (typeof value === "string") {
          const n = Number(value.replace(/[^\d.-]/g, ""));
          return Number.isFinite(n) ? n : null;
        }
        return null;
      }

      function getMetricByAliases(item, aliases) {
        if (!item || typeof item !== "object") return null;
        const aliasSet = new Set((aliases || []).map((k) => String(k).toLowerCase()));
        const containers = [item, item.metrics, item.stats, item.engagement, item.social, item.meta];
        for (const obj of containers) {
          if (!obj || typeof obj !== "object") continue;
          for (const alias of aliases || []) {
            const direct = toMetricNumber(obj[alias]);
            if (direct !== null) return direct;
          }
          for (const [k, v] of Object.entries(obj)) {
            if (!aliasSet.has(String(k).toLowerCase())) continue;
            const n = toMetricNumber(v);
            if (n !== null) return n;
          }
        }
        return null;
      }

      function getItemViewCount(item) {
        return getMetricByAliases(item, ["viewCount", "views", "hits", "readCount", "impressions", "popularity", "score"]);
      }

      function getItemLikeCount(item) {
        return getMetricByAliases(item, ["likes", "likeCount", "hearts", "applause", "applauds", "claps", "upvotes"]);
      }

      function getItemCommentCount(item) {
        return getMetricByAliases(item, ["comments", "commentCount", "replies", "replyCount"]);
      }

      function getItemShareCount(item) {
        return getMetricByAliases(item, ["shares", "shareCount", "reposts", "repostCount", "retweets"]);
      }

      function buildIssueTokens(item) {
        const raw = `${item?.title || ""} ${item?.summaryText || ""} ${((item?.categories || []).join(" ") || "").toLowerCase()}`.toLowerCase();
        const normalized = raw.replace(/[^0-9a-zA-Z\u00C0-\u024F\uAC00-\uD7A3]+/g, " ");
        const tokens = normalized
          .split(/\s+/)
          .filter((tok) => tok.length >= ISSUE_TOKEN_MIN_LEN && !ISSUE_STOPWORDS.has(tok));
        return Array.from(new Set(tokens)).slice(0, 18);
      }

      function buildIssueTokenFrequency(items) {
        const freq = new Map();
        for (const it of items || []) {
          const tokens = buildIssueTokens(it);
          tokens.forEach((tok) => {
            freq.set(tok, (freq.get(tok) || 0) + 1);
          });
        }
        return freq;
      }

      function getEngagementScore(item) {
        const views = getItemViewCount(item) || 0;
        const likes = getItemLikeCount(item) || 0;
        const comments = getItemCommentCount(item) || 0;
        const shares = getItemShareCount(item) || 0;
        const v = views > 0 ? Math.log10(views + 1) * 100 : 0;
        const l = likes > 0 ? Math.log10(likes + 1) * 78 : 0;
        const c = comments > 0 ? Math.log10(comments + 1) * 88 : 0;
        const s = shares > 0 ? Math.log10(shares + 1) * 92 : 0;
        return v + l + c + s;
      }

      function getIssueFrequencyScore(item, tokenFreq) {
        const tokens = buildIssueTokens(item);
        if (!tokens.length) return 0;
        let score = 0;
        for (const tok of tokens) {
          const f = tokenFreq.get(tok) || 0;
          if (f > 1) score += (f - 1) * 9;
        }
        const categoryBoost = Math.min(8, (item?.categories || []).length * 1.2);
        return score + categoryBoost;
      }

      function countKeywordHits(text, keywords) {
        const t = String(text || "");
        if (!t) return 0;
        let hits = 0;
        for (const kw of keywords || []) {
          const token = String(kw || "").trim().toLowerCase();
          if (!token) continue;
          const normalizedText = t.toLowerCase();
          if (/[^\x00-\x7F]/.test(token)) {
            if (normalizedText.includes(token)) hits++;
            continue;
          }
          if (kw.includes(" ")) {
            if (t.includes(kw)) hits++;
            continue;
          }
          const re = new RegExp(`\\b${kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\b`, "i");
          if (re.test(t)) hits++;
        }
        return hits;
      }

      function getProductTechBoost(item) {
        const text = normalizeCompareText(`${item?.title || ""} ${item?.summaryText || ""} ${(item?.categories || []).join(" ")}`);
        if (!text) return 0;
        const productHits = countKeywordHits(text, PRODUCT_NEWS_KEYWORDS);
        const techHits = countKeywordHits(text, TECH_DEPTH_KEYWORDS);
        const nonProductHits = countKeywordHits(text, NON_PRODUCT_NEWS_KEYWORDS);
        const productBoost = Math.min(180, productHits * 42);
        const techBoost = Math.min(130, techHits * 24);
        const sourceBoost = (OFFICIAL_TECH_SOURCES.has(item?.sourceFeed || "") ? 18 : 0) + getSourcePriorityBoost(item?.sourceFeed || "");
        const nonProductPenalty = Math.min(96, nonProductHits * 24);
        return productBoost + techBoost + sourceBoost - nonProductPenalty;
      }

      function getLaunchSignalMetrics(item) {
        const titleText = normalizeCompareText(item?.title || "");
        const bodyText = getProductSignalCorpus(item);
        if (!bodyText) {
          return {
            launchHits: 0,
            titleLaunchHits: 0,
            techHits: 0,
            nonProductHits: 0,
          };
        }
        const launchHits = countKeywordHits(bodyText, LAUNCH_PRIORITY_KEYWORDS);
        const titleLaunchHits = countKeywordHits(titleText, LAUNCH_PRIORITY_KEYWORDS);
        const techHits = countKeywordHits(bodyText, TECH_DEPTH_KEYWORDS);
        const nonProductHits = countKeywordHits(bodyText, NON_PRODUCT_NEWS_KEYWORDS);
        return { launchHits, titleLaunchHits, techHits, nonProductHits };
      }

      function getLaunchPriorityScore(item) {
        const { launchHits, titleLaunchHits, techHits, nonProductHits } = getLaunchSignalMetrics(item);
        const officialBoost = (OFFICIAL_TECH_SOURCES.has(item?.sourceFeed || "") ? 16 : 0) + Math.round(getSourcePriorityBoost(item?.sourceFeed || "") * 0.45);
        const detailBoost = hasProductDetailCard(item, true) ? 34 : 0;
        const techNewsBoost = isProductTechNews(item) ? 26 : 0;

        const pubMs = toDateMs(item?.pubDate || "");
        const ageDays = pubMs > 0 ? Math.max(0, (Date.now() - pubMs) / (24 * 60 * 60 * 1000)) : 30;
        const recencyBoost = Math.max(0, 84 - ageDays * 12);

        // 협업/파트너십/공개 추가 가산점
        const titleNorm = (item?.title || "").toLowerCase();
        const summaryNorm = (item?.summaryText || "").toLowerCase();
        const corpus = `${titleNorm} ${summaryNorm}`;
        const collabBoost = /\b(?:partner(?:ship)?|collaboration|collaborat|deal|agreement|integrat|제휴|협업|협력|파트너)\b/.test(corpus) ? 120 : 0;
        const updateBoost = /\b(?:update[sd]?|upgrade[sd]?|new\s+version|v\d+\.\d+|업데이트|새\s*버전|신규\s*기능)\b/.test(titleNorm) ? 100 : 0;
        const announcementBoost = /\b(?:announc|reveal[sed]?|공개|발표|출시|런칭|launch)\b/.test(titleNorm) ? 90 : 0;

        // 해외 기술 기사 부스트 / 국내 단독 기사 감점 (aitimes 소스 한정)
        const isAiTimes = String(item?.sourceFeed || "") === "aitimes_industry";
        const globalTechBoost = isAiTimes && GLOBAL_AI_COMPANY_PATTERNS.some((re) => re.test(corpus)) ? 160 : 0;
        const domesticPenalty = isAiTimes && !globalTechBoost && KR_DOMESTIC_COMPANY_PATTERNS.some((re) => re.test(corpus)) ? -80 : 0;

        const score =
          launchHits * 72 +
          titleLaunchHits * 96 +
          techHits * 28 +
          detailBoost +
          techNewsBoost +
          officialBoost +
          recencyBoost +
          collabBoost +
          updateBoost +
          announcementBoost +
          globalTechBoost +
          domesticPenalty -
          Math.min(120, nonProductHits * 18);
        return Math.max(0, score);
      }

      function isLaunchUpdatePriorityItem(item, strict = true) {
        const { launchHits, titleLaunchHits, techHits } = getLaunchSignalMetrics(item);
        const hasLaunchSignal = titleLaunchHits > 0 || launchHits > 0;
        const techQualified = hasProductDetailCard(item, true) || isProductTechNews(item) || techHits >= 2;
        if (strict) return hasLaunchSignal && techQualified;
        return (hasLaunchSignal && techQualified) || (getLaunchPriorityScore(item) >= 240 && techQualified);
      }

      function isProductTechNews(item) {
        const text = getProductSignalCorpus(item);
        if (!text) return false;
        const productHits = countKeywordHits(text, PRODUCT_NEWS_KEYWORDS);
        const techHits = countKeywordHits(text, TECH_DEPTH_KEYWORDS);
        const { launchHits, titleLaunchHits, nonProductHits } = getLaunchSignalMetrics(item);
        const hasLaunchSignal = launchHits > 0 || titleLaunchHits > 0;
        const fromOfficial = OFFICIAL_TECH_SOURCES.has(item?.sourceFeed || "");
        if (nonProductHits >= 3 && !hasLaunchSignal) return false;
        if (String(item?.sourceFeed || "") === "aitimes_industry") {
          if (hasLaunchSignal && (productHits >= 1 || techHits >= 1)) return true;
          if (productHits >= 2) return true;
        }
        if (fromOfficial) {
          if (hasLaunchSignal && (productHits >= 1 || techHits >= 2)) return true;
          return (productHits >= 1 && techHits >= 1) || techHits >= 3;
        }
        if (hasLaunchSignal && (productHits >= 1 || techHits >= 2)) return true;
        return (productHits >= 1 && techHits >= 1) || techHits >= 3;
      }

      function getLowSignalPenalty(item) {
        const text = normalizeCompareText(`${item?.title || ""} ${item?.summaryText || ""} ${(item?.categories || []).join(" ")}`);
        if (!text) return 0;

        const lowSignalHits = countKeywordHits(text, LOW_SIGNAL_CONTENT_KEYWORDS);
        let penalty = Math.min(180, lowSignalHits * 34);
        if (isSubjectiveStyleStory(item)) penalty += 240;
        if (isNewsDigestCard(item)) penalty += 360;  // 다이제스트/오프토픽은 강한 패널티

        const summary = getNormalizedSummaryForItem(item);
        if (isSummaryEmptyText(summary)) penalty += 64;
        if (isKeywordFallbackSummary(summary)) penalty += 52;
        if (isSummarySameAsTitle(summary, item?.title || "")) penalty += 38;

        if (isProductTechNews(item)) penalty = Math.max(0, penalty - 56);
        return penalty;

        if (!title) return false;
        if (DIGEST_ROUNDUP_TITLE_PATTERNS.some((re) => re.test(title))) return true;

        // 비AI기술 콘텐츠: 제목에 오프토픽 패턴이 있고, 제품/기술 신호가 약할 때
        if (OFFTOPIC_CONTENT_PATTERNS.some((re) => re.test(title) || re.test(summary))) {
          const corpus = `${title} ${summary}`;
          const productHits = countKeywordHits(corpus, PRODUCT_NEWS_KEYWORDS);
          const techHits = countKeywordHits(corpus, TECH_DEPTH_KEYWORDS);
          // 제품/기술 신호가 충분하면 통과 (예: AI 모델로 두뇌 훈련 제품 뉴스)
          if (productHits >= 2 && techHits >= 1) return false;

      function isKoreanDomesticArticle(item) {

      function isPromotionalSelfPost(item) {
        if (String(item?.sourceFeed || "") === "aitimes_industry") return false;
        const title = stripHtml(decodeHtmlEntitiesText(item?.title || ""));
        const summary = stripHtml(decodeHtmlEntitiesText(item?.summaryText || ""));
        const cats = (item?.categories || []).map((c) => decodeHtmlEntitiesText(c)).join(" ");
        const link = String(item?.link || "");
        const merged = `${title} ${summary} ${cats}`.replace(/\s+/g, " ").trim();
        if (!merged) return false;

        if (PROMO_SELF_PATTERNS.some((re) => re.test(merged))) return true;

        const isTechCrunch = /(?:^|\/\/)(?:www\.)?techcrunch\.com/i.test(link);
        if (!isTechCrunch) return false;

        const tcPromoSignals = [/\bdisrupt\b/i, /\bsessions?\b/i, /\bevent\b/i, /\bconference\b/i, /\btickets?\b/i, /\bregister\b/i];

      function isSubjectiveStyleStory(item) {
        if (String(item?.sourceFeed || "") === "aitimes_industry") return false;

        const cats = Array.isArray(item?.categories) ? item.categories.map((c) => decodeHtmlEntitiesText(c)).join(" ") : "";
        const merged = `${title} ${summary} ${cats}`.replace(/\s+/g, " ").trim();
        if (!merged) return false;
        const normalized = normalizeCompareText(merged);
        const keywordHits = countKeywordHits(normalized, SUBJECTIVE_STYLE_KEYWORDS);
        const softHits = countKeywordHits(normalized, SUBJECTIVE_SOFT_KEYWORDS);
        const productSignalHits = countKeywordHits(normalized, PRODUCT_NEWS_KEYWORDS) + countKeywordHits(normalized, TECH_DEPTH_KEYWORDS);
        const weakProductSignal = productSignalHits < 2;
        const hasCommentaryHeadline =

      function decodeHtmlEntitiesText(input) {
        const raw = String(input || "");
        if (!raw) return "";
        const ta = document.createElement("textarea");
        let out = raw;
        for (let i = 0; i < 2; i++) {
          ta.innerHTML = out;
          const next = ta.value || ta.textContent || "";
          if (next === out) break;
          out = next;
        }
        return out.replace(/\s+/g, " ").trim();
      }

      function normalizeCompareText(input) {
        return decodeHtmlEntitiesText(input)
          .toLowerCase()
          .replace(/https?:\/\/\S+/gi, " ")
          .replace(/[^0-9a-z\u00C0-\u024F\uAC00-\uD7A3]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function stableHashNumber(input) {
        const text = String(input || "");
        let hash = 2166136261 >>> 0;
        for (let i = 0; i < text.length; i++) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(hash, 16777619) >>> 0;
        }
        return hash >>> 0;
      }

      function seededShuffle(list, seedInput) {
        const out = Array.isArray(list) ? list.slice() : [];
        let seed = stableHashNumber(seedInput) || 1;
        const nextRand = () => {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(nextRand() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      }

              !ISSUE_STOPWORDS.has(v) &&
              !TITLE_CLUSTER_EXCLUDE.has(v) &&
              !IMAGE_PROMPT_STOPWORDS.has(v),
          );
        const freq = new Map();
        tokens.forEach((tok) => freq.set(tok, (freq.get(tok) || 0) + 1));
        return Array.from(freq.entries())
          .sort((a, b) => {
            if (b[1] !== a[1]) return b[1] - a[1];

          .slice(0, Math.max(1, Number(max) || 6))

      function pickUniqueFallbackCardBg(pool, usedKeys, avoidKeys, cursor) {
        if (!Array.isArray(pool) || !pool.length) return { rawUrl: "", nextCursor: cursor };
        const start = Math.max(0, Number(cursor) || 0) % pool.length;
        const avoidSet = new Set((avoidKeys || []).map((v) => normalizeImageCompareKey(v)).filter(Boolean));
        for (let offset = 0; offset < pool.length; offset++) {
          const index = (start + offset) % pool.length;
          const raw = String(pool[index] || "").trim();
          const key = normalizeImageCompareKey(raw);
          if (!key) continue;
          if (avoidSet.has(key)) continue;
          if (usedKeys.has(key)) continue;
          usedKeys.add(key);
          return { rawUrl: raw, nextCursor: (index + 1) % pool.length };
        }
        return { rawUrl: "", nextCursor: start };

              primaryCardBg: buildImageUrl(sourceRaw, "high"),

              fallbackCardBgSecondary: "",
            };
          }

          const topicKey = detectCardVisualTopic(it);
          const promptSeed = extractCardPromptKeywords(it, 4).join("|");
          const topicPool = seededShuffle(
            getTopicRealPhotoPool(topicKey),
            `${FALLBACK_SESSION_SEED}|${topicKey}|${it?.guid || ""}|${it?.link || ""}|${promptSeed}`,
          );
          let topicCursor = topicCursorMap.get(topicKey) || 0;
          const primaryPick = pickUniqueFallbackCardBg(topicPool, usedKeys, [sourceRaw], topicCursor);
          topicCursorMap.set(topicKey, primaryPick.nextCursor);
          topicCursor = topicCursorMap.get(topicKey) || 0;
          const secondaryPick = pickUniqueFallbackCardBg(
            topicPool,
            usedKeys,
            [sourceRaw, primaryPick.rawUrl],
            topicCursor,
          );
          topicCursorMap.set(topicKey, secondaryPick.nextCursor);
          const staticPick = pickUniqueFallbackCardBg(
            CARD_BG_FALLBACKS,
            usedKeys,
            [sourceRaw, primaryPick.rawUrl, secondaryPick.rawUrl],
            fallbackCursor,
          );
          fallbackCursor = staticPick.nextCursor;
          const localRaw = pickLocalAiFallback(it, idx + 1) || defaultRaw;
          const fallbackPrimaryRaw =
            primaryPick.rawUrl ||
            buildTopicMatchedPhotoFallback(it, idx * 3 + 1) ||
            staticPick.rawUrl ||
            localRaw;
          const fallbackSecondaryRaw =
            secondaryPick.rawUrl ||
            buildTopicMatchedPhotoFallback(it, idx * 3 + 2) ||
            staticPick.rawUrl ||
            primaryPick.rawUrl ||
            localRaw;
          const fallbackTertiaryRaw =
            secondaryPick.rawUrl ||
            staticPick.rawUrl ||
            buildTopicMatchedPhotoFallback(it, idx * 3 + 3) ||
            primaryPick.rawUrl ||
            localRaw;
          const fallbackQuaternaryRaw = staticPick.rawUrl || secondaryPick.rawUrl || primaryPick.rawUrl || localRaw;
          const fallbackQuinaryRaw = localRaw;
          [fallbackPrimaryRaw, fallbackSecondaryRaw, fallbackTertiaryRaw, fallbackQuaternaryRaw, fallbackQuinaryRaw].forEach((raw) => {
            const k = normalizeImageCompareKey(raw);
            if (k) usedKeys.add(k);
          });

          return {
            hasSourceImage: false,
            primaryCardBg: "",
            fallbackCardBg: buildCardBgImageUrl(fallbackPrimaryRaw),
            fallbackCardBgSecondary: buildCardBgImageUrl(fallbackSecondaryRaw),
            fallbackCardBgTertiary: buildCardBgImageUrl(fallbackTertiaryRaw),
            fallbackCardBgQuaternary: buildCardBgImageUrl(fallbackQuaternaryRaw),
            fallbackCardBgQuinary: buildCardBgImageUrl(fallbackQuinaryRaw),
          };
        });
      }

      function tokenSetFromNormalizedText(text) {
        return new Set(
          String(text || "")
            .split(/\s+/)
            .filter((tok) => tok && tok.length >= 3 && !ISSUE_STOPWORDS.has(tok)),
        );
      }

      function contentTokenSet(item) {
        const merged = normalizeCompareText(`${item?.title || ""} ${item?.summaryText || ""} ${(item?.categories || []).join(" ")}`);
        return new Set(
          String(merged || "")
            .split(/\s+/)
            .filter((tok) => tok && tok.length >= 4 && !ISSUE_STOPWORDS.has(tok)),
        );
      }

      function titleTokenSet(item) {
        const t = normalizeCompareText(item?.title || "");
        return new Set(
          String(t || "")
            .split(/\s+/)
            .filter((tok) => tok && tok.length >= 3 && !ISSUE_STOPWORDS.has(tok)),
        );
      }

      function jaccardSimilarity(setA, setB) {
        if (!setA.size || !setB.size) return 0;
        let inter = 0;
        setA.forEach((v) => {
          if (setB.has(v)) inter++;
        });
        const union = setA.size + setB.size - inter;
        return union ? inter / union : 0;
      }

      function isNearDuplicateByTitle(a, b) {
        const ta = normalizeCompareText(a?.title || "");
        const tb = normalizeCompareText(b?.title || "");
        if (!ta || !tb) return false;
        if (ta === tb) return true;
        if (ta.length >= 24 && tb.length >= 24 && (ta.includes(tb) || tb.includes(ta))) return true;

        const sa = tokenSetFromNormalizedText(ta);
        const sb = tokenSetFromNormalizedText(tb);
        let inter = 0;
        sa.forEach((v) => {
          if (sb.has(v)) inter++;
        });
        const j = jaccardSimilarity(sa, sb);
        return inter >= 3 && j >= 0.54;
      }

      function isNearDuplicateByContent(a, b) {
        const sa = contentTokenSet(a);
        const sb = contentTokenSet(b);
        if (!sa.size || !sb.size) return false;
        let inter = 0;
        sa.forEach((v) => {
          if (sb.has(v)) inter++;
        });
        const j = jaccardSimilarity(sa, sb);
        if (inter >= 7) return true;
        return inter >= 4 && j >= 0.4;
      }

      function canonicalLinkKey(link) {
        if (!link) return "";
        try {
          const u = new URL(String(link));
          u.hash = "";
          const drop = [];
          u.searchParams.forEach((_v, k) => {
            if (/^(utm_|fbclid|gclid|mc_|ref$)/i.test(k)) drop.push(k);
          });
          drop.forEach((k) => u.searchParams.delete(k));
          return `${u.hostname}${u.pathname}`.toLowerCase().replace(/\/+$/g, "");
        } catch (e) {
          return String(link || "").toLowerCase().trim();
        }
      }

      function isSummarySameAsTitle(summary, title) {
        const s = normalizeCompareText(summary);
        const t0 = normalizeCompareText(title);
        if (!s || !t0) return false;
        if (s === t0) return true;
        if (s.length >= 28 && (t0.includes(s) || s.includes(t0))) return true;
        return false;
      }

      function isKeywordFallbackSummary(summary) {
        const s = decodeHtmlEntitiesText(summary);
        if (s.startsWith("핵심 키워드:") || s.startsWith("Key topics:")) return true;
        const n = normalizeCompareText(s);
        if (!n) return false;
        return (
          n.includes("this update introduces concrete changes to") ||
          n.includes("affecting its target scope and capabilities")
        );
      }

      function isGenericEnglishFallbackTitle(text) {
        const n = normalizeCompareText(text || "");
        if (!n) return false;
        return /^ai (company|industry|models|platforms|infrastructure|healthcare)( ai (company|industry|models|platforms|infrastructure|healthcare))? update$/.test(n);
      }

      function isLikelyTruncatedEnglishHeadline(text) {
        const s = decodeHtmlEntitiesText(text || "").replace(/\s+/g, " ").trim();
        if (!s) return true;
        if (/\.\.\.$/.test(s)) return true;
        if (/[,:;'"]$/.test(s)) return true;
        if (/\bNo\.?$/i.test(s)) return true;
        if (/\bto No\.?$/i.test(s)) return true;
        return false;
      }

      function isLikelyTruncatedEnglishSummary(text) {
        const s = decodeHtmlEntitiesText(text || "").replace(/\s+/g, " ").trim();
        if (!s) return true;
        if (/\.\.\.$/.test(s)) return true;
        if (/[,:;'"]$/.test(s)) return true;
        if (/\b(?:to|from)\s+No\.?$/i.test(s)) return true;
        return false;
      }

      function getEnglishRenderIssue(titleText, summaryText) {
        const title = decodeHtmlEntitiesText(titleText || "").replace(/\s+/g, " ").trim();
        const summary = decodeHtmlEntitiesText(summaryText || "").replace(/\s+/g, " ").trim();
        if (!title) return "missing headline";
        if (!summary) return "missing summary";
        if (/[가-힣]/.test(`${title} ${summary}`)) return "contains Korean text";
        if (isGenericEnglishFallbackTitle(title)) return "placeholder headline";
        if (isKeywordFallbackSummary(summary)) return "placeholder summary";
        if (isLikelyTruncatedEnglishHeadline(title)) return "truncated headline";
        if (isLikelyTruncatedEnglishSummary(summary)) return "truncated summary";
        if (isSummarySameAsTitle(summary, title)) return "summary duplicates headline";
        return "";
      }

      function regenerateEnglishCardText(item, canonical, titleText, summaryText) {
        let nextTitle = decodeHtmlEntitiesText(titleText || "").replace(/\s+/g, " ").trim();
        let nextSummary = decodeHtmlEntitiesText(summaryText || "").replace(/\s+/g, " ").trim();
        const editorialOverride =
          resolveEditorialEnglishCardOverride(item, nextTitle, nextSummary) ||
          resolveEditorialEnglishCardOverride(item, decodeHtmlEntitiesText(item?.title || ""), decodeHtmlEntitiesText(item?.summaryText || ""));

        const isBadTitle = (v) => {
          const t = decodeHtmlEntitiesText(v || "").replace(/\s+/g, " ").trim();
          return !t || /[가-힣]/.test(t) || isGenericEnglishFallbackTitle(t);
        };
        const isBadSummary = (v) => {
          const s = decodeHtmlEntitiesText(v || "").replace(/\s+/g, " ").trim();
          return !s || /[가-힣]/.test(s) || isKeywordFallbackSummary(s);
        };

        // 0) Editorial source-of-truth override
        if (editorialOverride?.titleEn && !isBadTitle(editorialOverride.titleEn) && !isLikelyTruncatedEnglishHeadline(editorialOverride.titleEn)) {
          nextTitle = decodeHtmlEntitiesText(editorialOverride.titleEn).replace(/\s+/g, " ").trim();
        }
        if (editorialOverride?.summaryEn && !isBadSummary(editorialOverride.summaryEn) && !isLikelyTruncatedEnglishSummary(editorialOverride.summaryEn)) {
          nextSummary = decodeHtmlEntitiesText(editorialOverride.summaryEn).replace(/\s+/g, " ").trim();
        }

        // 1) Canonical English generated from the source item
        if (isBadTitle(nextTitle) || isBadSummary(nextSummary) || isLikelyTruncatedEnglishHeadline(nextTitle) || isLikelyTruncatedEnglishSummary(nextSummary)) {
          const canonicalTitle = decodeHtmlEntitiesText(canonical?.titleEn || "").replace(/\s+/g, " ").trim();
          const canonicalSummary = decodeHtmlEntitiesText(canonical?.summaryEn || "").replace(/\s+/g, " ").trim();
          if (!isBadTitle(canonicalTitle) && !isLikelyTruncatedEnglishHeadline(canonicalTitle)) nextTitle = canonicalTitle;
          if (!isBadSummary(canonicalSummary) && !isLikelyTruncatedEnglishSummary(canonicalSummary)) nextSummary = canonicalSummary;
        }

        // 2) English AI summary cache as an additional repair source
        if (isBadSummary(nextSummary) || isLikelyTruncatedEnglishSummary(nextSummary)) {
          const aiSummaryEn = decodeHtmlEntitiesText(getAiCardText(item, "__aiSummary", currentAiProvider, "en") || "")
            .replace(/\s+/g, " ")
            .trim();
          if (!isBadSummary(aiSummaryEn) && !isLikelyTruncatedEnglishSummary(aiSummaryEn)) nextSummary = aiSummaryEn;
        }

        // 3) Emergency English summary derived from raw source text (if still needed)
        if ((isBadSummary(nextSummary) || isLikelyTruncatedEnglishSummary(nextSummary)) && !isBadTitle(nextTitle)) {
          const leadSummary = decodeHtmlEntitiesText(
            buildArticleLeadSummaryText(item?.__articleBodyText || item?.summaryText || "", nextTitle, "en"),
          ).replace(/\s+/g, " ").trim();
          if (!isBadSummary(leadSummary) && !isLikelyTruncatedEnglishSummary(leadSummary)) {
            nextSummary = leadSummary;
          }
        }
        if ((isBadSummary(nextSummary) || isLikelyTruncatedEnglishSummary(nextSummary)) && !isBadTitle(nextTitle)) {
          const emergency = decodeHtmlEntitiesText(
            buildEmergencySummaryText(item?.summaryText || item?.__articleBodyText || "", nextTitle),
          ).replace(/\s+/g, " ").trim();
          if (!isBadSummary(emergency) && !isLikelyTruncatedEnglishSummary(emergency)) nextSummary = emergency;
        }

        // 4) Last resort headline/summary without placeholders
        if (isBadTitle(nextTitle) || isLikelyTruncatedEnglishHeadline(nextTitle)) {
          const rebuiltTitle = proofreadEnglishHeadlineText(buildHeadlineText(item?.title || nextTitle, item?.summaryText || nextSummary)) || "";
          if (rebuiltTitle && !isBadTitle(rebuiltTitle) && !isLikelyTruncatedEnglishHeadline(rebuiltTitle)) {
            nextTitle = rebuiltTitle;
          }
        }
        if ((isBadSummary(nextSummary) || isLikelyTruncatedEnglishSummary(nextSummary)) && !isBadTitle(nextTitle)) {
          const genericSummary = decodeHtmlEntitiesText(buildEnglishFallbackSummaryFromItem(item, nextTitle)).replace(/\s+/g, " ").trim();
          if (!isBadSummary(genericSummary) && !isLikelyTruncatedEnglishSummary(genericSummary)) nextSummary = genericSummary;
        }

        if (!isBadTitle(nextTitle)) {
          nextTitle = proofreadEnglishHeadlineText(nextTitle) || nextTitle;
        }
        if (!isBadSummary(nextSummary) && !isBadTitle(nextTitle)) {
          nextSummary = proofreadEnglishSummaryText(nextSummary, nextTitle) || nextSummary;
        }

        const issue = getEnglishRenderIssue(nextTitle, nextSummary);
        return {
          ok: !issue,
          titleText: nextTitle,
          summaryText: nextSummary,
          issue,
        };
      }

      function isSummaryEmptyText(summary) {
        const s = decodeHtmlEntitiesText(summary || "").trim();
        if (!s) return true;
        return s === I18N.ko.summary_empty || s === I18N.en.summary_empty;
      }

      function getNormalizedSummaryForItem(item, scoringLang = "en") {
        const titleText = decodeHtmlEntitiesText(item?.title || "");
        const prevLang = currentLang;
        if (scoringLang && prevLang !== scoringLang) currentLang = scoringLang;
        try {
          return buildSummaryText(item?.summaryText, titleText, item?.categories || []);
        } finally {
          if (currentLang !== prevLang) currentLang = prevLang;
        }
      }

      function isGoodSummaryItem(item) {
        const summary = getNormalizedSummaryForItem(item);
        if (isSummaryEmptyText(summary)) return false;
        if (isKeywordFallbackSummary(summary)) return false;
        return normalizeCompareText(summary).length >= 48;
      }

      function buildSummaryText(raw, titleText, categories) {
        const txt = decodeHtmlEntitiesText(raw);
        if (!txt) return t("summary_empty");

        const stripTitlePrefix = (summary, title) => {
          let out = String(summary || "").trim();
          const cleanTitle = decodeHtmlEntitiesText(title || "")
            .replace(/\s+/g, " ")
            .replace(/[.?!]+$/g, "")
            .trim();
          if (!out || !cleanTitle || cleanTitle.length < 10) return out;

          const escapeRegExp = (value) => String(value || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const pref = new RegExp(`^${escapeRegExp(cleanTitle)}\\s*[:：\\-–—,]\\s*`, "i");
          if (pref.test(out)) {
            const stripped = out.replace(pref, "").trim();
            if (stripped.length >= 34) out = stripped;
          }

          const normTitle = normalizeCompareText(cleanTitle);
          const sentences = out.split(/(?<=[.!?。！？])\s+/).filter(Boolean);
          if (sentences.length > 1) {
            const first = sentences[0];
            const normFirst = normalizeCompareText(first);
            const overlap =
              normFirst &&
              normTitle &&
              (normFirst === normTitle ||
                normFirst.startsWith(normTitle.slice(0, Math.min(34, normTitle.length))) ||
                normTitle.startsWith(normFirst.slice(0, Math.min(26, normFirst.length))));
            if (overlap) {
              const rest = sentences.slice(1).join(" ").trim();
              if (rest.length >= 34) out = rest;
            }
          }

          return out.trim();
        };

        const hasProductSignal = (text) => {
          const merged = normalizeCompareText(String(text || ""));
          if (!merged) return false;
          const productHits = countKeywordHits(merged, PRODUCT_NEWS_KEYWORDS);
          const techHits = countKeywordHits(merged, TECH_DEPTH_KEYWORDS);
          if (productHits >= 1 || techHits >= 1) return true;
          return /(?:출시|공개|발표|업데이트|기능|모델|버전|api|sdk|앱|서비스|칩|gpu|도입|추가|개선|강화|연동|통합|배포)/i.test(
            String(text || ""),
          );
        };

        const captionLikePatterns = [
          /\b(?:photo|pictured|image|images|screenshot|render(?:ing)?|illustration|visual)\b/i,
          /\b(?:on the left|on the right|left side|right side|in the background|foreground)\b/i,
          /\b(?:wearing|poses?|standing|sitting|smiling|looks? at|holding)\b/i,
          /\b(?:is shown|shown on|displayed on|can be seen|features? a person)\b/i,
          /(?:왼쪽|오른쪽|배경|전경|사진에는|이미지에는|포즈|입은|착용|화면에는|표시되어 있습니다|보입니다|보여줍니다)/,
        ];

        const sanitizeSummarySentences = (inputText) => {
          const source = String(inputText || "").trim();
          if (!source) return [];
          const parts = source.split(/(?<=[.!?。！？])\s+/).map((s) => s.trim()).filter(Boolean);
          const sanitized = [];
          for (const sentence of parts) {
            const plain = decodeHtmlEntitiesText(sentence).replace(/\s+/g, " ").trim();
            if (!plain || plain.length < 18) continue;
            const isCaptionLike = captionLikePatterns.some((re) => re.test(plain));
            const sentenceHasProductSignal = hasProductSignal(plain);
            if (isCaptionLike && !sentenceHasProductSignal) continue;
            if (!sentenceHasProductSignal && plain.length < 52) continue;
            sanitized.push(plain);
          }
          return sanitized;
        };

        // Remove RSS trailing ellipsis and keep a compact, image-friendly summary.
        const cleaned = txt
          .replace(/https?:\/\/\S+/gi, " ")
          .replace(/\b\S+\.(png|jpe?g|gif|webp|svg)\b/gi, " ")
          .replace(/\b\d{2,4}x\d{2,4}\b/g, " ")
          .replace(/\[\s*(?:\.\.\.|…)\s*\]/g, " ")
          .replace(/\(\s*(?:\.\.\.|…)\s*\)/g, " ")
          .replace(/\s*(\.\.\.|…)+\s*$/g, "")
          .replace(/\s+/g, " ")
          .trim();
        if (!cleaned || !/[A-Za-z0-9\uAC00-\uD7A3]/.test(cleaned)) return t("summary_empty");
        const sanitizedSentences = sanitizeSummarySentences(cleaned);
        const filteredCleaned = sanitizedSentences.join(" ").trim();
        if (!filteredCleaned || !/[A-Za-z0-9\uAC00-\uD7A3]/.test(filteredCleaned)) return t("summary_empty");

        const titleSignalsText = normalizeCompareText(`${titleText || ""} ${(categories || []).join(" ")}`);
        const titleSignalScore = countKeywordHits(titleSignalsText, PRODUCT_NEWS_KEYWORDS) + countKeywordHits(titleSignalsText, TECH_DEPTH_KEYWORDS);

        const mergedForDetail = normalizeCompareText(`${titleText || ""} ${filteredCleaned} ${(categories || []).join(" ")}`);
        const productHits = countKeywordHits(mergedForDetail, PRODUCT_NEWS_KEYWORDS);
        const techHits = countKeywordHits(mergedForDetail, TECH_DEPTH_KEYWORDS);
        const isProductDetail = productHits >= 1 || techHits >= 2 || titleSignalScore >= 1;
        if (!isProductDetail) return t("summary_empty");
        const MAX_SUMMARY_CHARS = isProductDetail
          ? currentLang === "ko"
            ? 780
            : 920
          : currentLang === "ko"
            ? 520
            : 620;
        let result = filteredCleaned;
        if (filteredCleaned.length > MAX_SUMMARY_CHARS) {
          // Prefer full sentences that fit within the target length.
          const sentences = sanitizedSentences.length ? sanitizedSentences : filteredCleaned.split(/(?<=[.!?。！？])\s+/).filter(Boolean);
          let compact = "";
          for (const s of sentences) {
            const next = compact ? `${compact} ${s}` : s;
            if (next.length > MAX_SUMMARY_CHARS) break;
            compact = next;
          }
          if (compact) result = compact.replace(/\s*(\.\.\.|…)+\s*$/g, "").trim();
          else {
            const sliced = filteredCleaned.slice(0, MAX_SUMMARY_CHARS);
            const cutAt = sliced.lastIndexOf(" ");
            const safe = (cutAt > 120 ? sliced.slice(0, cutAt) : sliced).trim();
            result = safe.replace(/\s*(\.\.\.|…)+\s*$/g, "").trim();
          }
        }

        result = stripTitlePrefix(result, titleText);
        if (currentLang === "ko") {
          result = result.replace(/\s+/g, " ").trim();
          if (result && !/[.!?]$/.test(result)) result += ".";
        } else {
          result = result.replace(/\s+/g, " ").trim();
          if (result && !/[.!?]$/.test(result)) result += ".";
        }

        if (isSummarySameAsTitle(result, titleText)) {
          const sentences = sanitizedSentences.length ? sanitizedSentences : filteredCleaned.split(/(?<=[.!?。！？])\s+/).filter(Boolean);
          if (sentences.length > 1) {
            const alt = sentences.slice(1).join(" ").trim();
            if (alt && normalizeCompareText(alt).length >= 24) {
              return alt;
            }
          }
          return t("summary_empty");
        }
        return result;
      }

      function buildEmergencySummaryText(raw, titleText = "") {
        const txt = decodeHtmlEntitiesText(raw || "")
          .replace(/https?:\/\/\S+/gi, " ")
          .replace(/\b\S+\.(png|jpe?g|gif|webp|svg)\b/gi, " ")
          .replace(/\b\d{2,4}x\d{2,4}\b/g, " ")
          .replace(/\[\s*(?:\.\.\.|…)\s*\]/g, " ")
          .replace(/\(\s*(?:\.\.\.|…)\s*\)/g, " ")
          .replace(/\s*(\.\.\.|…)+\s*$/g, "")
          .replace(/\s+/g, " ")
          .trim();
        if (!txt) return "";

        const titleNorm = normalizeCompareText(titleText || "");
        const captionLikePatterns = [
          /(?:왼쪽|오른쪽|배경|전경|사진에는|이미지에는|포즈|입은|착용|화면에는|표시되어 있습니다|보입니다|보여줍니다)/,
          /\b(?:photo|pictured|image|images|screenshot|render(?:ing)?|illustration|on the left|on the right|background)\b/i,
        ];

        const sentences = txt.split(/(?<=[.!?。！？])\s+/).filter(Boolean);
        const picked = [];
        for (const sentence of sentences) {
          const s = decodeHtmlEntitiesText(sentence || "").replace(/\s+/g, " ").trim();
          if (!s || s.length < 28) continue;
          if (captionLikePatterns.some((re) => re.test(s))) continue;
          if (titleNorm && normalizeCompareText(s) === titleNorm) continue;
          picked.push(s);
          if (picked.length >= 5) break;
        }

        const outBase = picked.length ? picked.join(" ") : txt;
        const clipped = outBase.length > 900 ? outBase.slice(0, 900).trim() : outBase;
        const normalized = clipped.replace(/\s*(\.\.\.|…)+\s*$/g, "").trim();
        if (!normalized) return "";
        return /[.!?]$/.test(normalized) ? normalized : `${normalized}.`;
      }

      function buildDetailSupplementText(raw, titleText = "") {
        const txt = decodeHtmlEntitiesText(raw || "")
          .replace(/https?:\/\/\S+/gi, " ")
          .replace(/\b\S+\.(png|jpe?g|gif|webp|svg)\b/gi, " ")
          .replace(/\b\d{2,4}x\d{2,4}\b/g, " ")
          .replace(/\[\s*(?:\.\.\.|…)\s*\]/g, " ")
          .replace(/\(\s*(?:\.\.\.|…)\s*\)/g, " ")
          .replace(/\s*(\.\.\.|…)+\s*$/g, "")
          .replace(/\s+/g, " ")
          .trim();
        if (!txt) return "";

        const titleNorm = normalizeCompareText(titleText || "");
        const titleSentence = decodeHtmlEntitiesText(titleText || "")
          .replace(/\s+/g, " ")
          .replace(/[.?!]+$/g, "")
          .trim();
        const captionLikePatterns = [
          /(?:왼쪽|오른쪽|배경|전경|사진에는|이미지에는|포즈|입은|착용|화면에는|표시되어 있습니다|보입니다|보여줍니다)/,
          /\b(?:photo|pictured|image|images|screenshot|render(?:ing)?|illustration|on the left|on the right|background)\b/i,
        ];

        const hasProductSignal = (text) => {
          const s = String(text || "");
          return /(?:출시|공개|발표|업데이트|기능|모델|버전|api|sdk|앱|서비스|칩|gpu|도입|추가|개선|강화|연동|통합|배포|성능|launch|release|unveil|introduc|announce|rollout|beta|preview|feature|model|api|sdk|app)/i.test(
            s,
          );
        };

        const sentences = txt.split(/(?<=[.!?。！？])\s+/).filter(Boolean);
        const picked = [];
        const seen = new Set();
        const candidates = [titleSentence, ...sentences].filter(Boolean);
        for (const sentence of candidates) {
          const s = decodeHtmlEntitiesText(sentence || "").replace(/\s+/g, " ").trim();
          if (!s || s.length < 20) continue;
          if (captionLikePatterns.some((re) => re.test(s)) && !hasProductSignal(s)) continue;
          const norm = normalizeCompareText(s);
          if (!norm) continue;

      function ensureCardSummaryDisplayLines(summaryText, item, lang = currentLang, titleText = "") {

            .split(/(?<=[.!?。！？])\s+|\n+/)

        pushFromText(buildDetailSupplementText(item?.summaryText || "", titleText || item?.title || ""));

            .slice(cursor, cursor + take)

            .replace(/\s+/g, " ")

          .replace(/(?:\s|\n)+(특히|또한|그리고|다만|한편)\.\s*$/g, "")
          .replace(/(?:\s|\n)+(especially|also|and|but|however)\.\s*$/gi, "")
          .trim();

      function buildExpandedEnglishSummary(baseSummary, rawSummary, titleText = "") {
        const MIN_CHARS = 260;
        const MAX_CHARS = 480;

        const cleanText = (value) =>
          decodeHtmlEntitiesText(value || "")
            .replace(/https?:\/\/\S+/gi, " ")
            .replace(/\b\S+\.(png|jpe?g|gif|webp|svg)\b/gi, " ")
            .replace(/\b\d{2,4}x\d{2,4}\b/g, " ")

          cleanText(value)
            .split(/(?<=[.!?。！？])\s+/)
            .map((s) => s.replace(/\s+/g, " ").trim())
            .filter(Boolean);

        const titleNorm = normalizeCompareText(titleText || "");
        const candidates = [...toSentences(baseSummary), ...toSentences(rawSummary)];
        const seen = new Set();
        const uniq = [];
        for (const s of candidates) {
          const norm = normalizeCompareText(s);
          if (!norm || norm.length < 24) continue;
          if (titleNorm && (norm === titleNorm || norm.startsWith(titleNorm.slice(0, Math.min(34, titleNorm.length))))) continue;
          if (seen.has(norm)) continue;
          seen.add(norm);
          uniq.push(/[.!?]$/.test(s) ? s : `${s}.`);
        }
        if (!uniq.length) return cleanText(baseSummary || rawSummary || "");

        let out = "";
        for (const s of uniq) {
          const next = out ? `${out} ${s}` : s;
          const nextLen = normalizeCompareText(next).length;
          if (nextLen > MAX_CHARS && normalizeCompareText(out).length >= MIN_CHARS) break;
          if (nextLen > MAX_CHARS && !out) {
            out = s;
            break;
          }
          out = next;
        }

        if (normalizeCompareText(out).length < MIN_CHARS) {
          for (const s of uniq) {
            if (out.includes(s)) continue;
            const next = `${out} ${s}`.replace(/\s+/g, " ").trim();
            out = next;
            if (normalizeCompareText(out).length >= MIN_CHARS) break;
            if (normalizeCompareText(out).length >= MAX_CHARS + 40) break;
          }
        }

        if (!out) out = uniq[0];
        if (normalizeCompareText(out).length > MAX_CHARS + 40) {
          const sentenceParts = out.split(/(?<=[.!?])\s+/).filter(Boolean);
          let compact = "";
          for (const part of sentenceParts) {
            const next = compact ? `${compact} ${part}` : part;
            if (normalizeCompareText(next).length > MAX_CHARS + 30) break;
            compact = next;
          }
          if (compact) {
            out = compact.replace(/\s*(\.\.\.|…)+\s*$/g, "").trim();

            const sliced = out.slice(0, MAX_CHARS + 40);
            const cut = sliced.lastIndexOf(" ");
            out = (cut > 120 ? sliced.slice(0, cut) : sliced).trim();
            out = out.replace(/\s*(\.\.\.|…)+\s*$/g, "").trim();
          }
          if (out && !/[.!?]$/.test(out)) out += ".";
        }
        return out.replace(/\s+/g, " ").trim();
      }

      function enrichProductLaunchSummaryEn(baseSummary, rawSummary, rawTitle = "", categories = []) {

            if (normalizeCompareText(next).length > MAX_TARGET + 40) break;
            out = next;
            if (normalizeCompareText(out).length >= MIN_TARGET) break;
          }
        }

        const parts = out.split(/(?<=[.!?])\s+/).filter(Boolean);
        let compact = "";
        for (const p of parts) {
          const next = compact ? `${compact} ${p}` : p;
          if (normalizeCompareText(next).length > MAX_TARGET) break;
          compact = next;
        }
        out = (compact || out).replace(/\s+/g, " ").trim();
        const dedupParts = out.split(/(?<=[.!?])\s+/).filter(Boolean);
        const deduped = [];
        for (const sentence of dedupParts) {
          const candNorm = normalizeCompareText(sentence);
          if (!candNorm) continue;
          const candSet = tokenSetFromNormalizedText(candNorm);
          const tooClose = deduped.some((prev) => {
            const prevNorm = normalizeCompareText(prev);
            if (!prevNorm) return false;
            if (prevNorm.includes(candNorm) || candNorm.includes(prevNorm)) return true;
            const prevSet = tokenSetFromNormalizedText(prevNorm);
            if (candSet.size >= 4 && prevSet.size >= 4) {
              return jaccardSimilarity(candSet, prevSet) >= 0.78;
            }
            return false;
          });
          if (!tooClose) deduped.push(sentence);
        }
        if (deduped.length) out = deduped.join(" ").replace(/\s+/g, " ").trim();
        if (out && !/[.!?]$/.test(out)) out += ".";
        return out;
      }

      function ensureLongSummaryEn(item, baseSummary, rawSummary = "", titleText = "", categories = []) {
        const cleanText = (value) =>
          decodeHtmlEntitiesText(value || "")
            .replace(/\s*(\.\.\.|…)+\s*$/g, "")
            .replace(/\s+/g, " ")
            .trim();

        const toSentences = (value) =>
          cleanText(value)
            .split(/(?<=[.!?。！？])\s+|\n+/)
            .map((s) => s.replace(/\s+/g, " ").trim())
            .filter(Boolean);

        const normalizeSentence = (value) => normalizeCompareText(cleanText(value || "").replace(/[.!?]+$/g, ""));
        const targetLen = Math.max(260, Number(TARGET_CARD_SUMMARY_EN_CHARS) || 340);
        const hardMax = 760;
        let out = cleanText(baseSummary || "");
        if (!out || isSummaryEmptyText(out)) return out;
        if (!/[.!?]$/.test(out)) out += ".";

        const seen = new Set();
        toSentences(out).forEach((s) => {
          const n = normalizeSentence(s);
          if (n) seen.add(n);
        });

        const appendCandidate = (candidateText) => {
          const lines = toSentences(candidateText);
          for (const line of lines) {
            const plain = cleanText(line).replace(/[.!?]+$/g, "").trim();
            if (!plain || plain.length < 24) continue;
            const norm = normalizeSentence(plain);
            if (!norm || seen.has(norm)) continue;

            const currentNorm = normalizeCompareText(out);
            if (currentNorm && (currentNorm.includes(norm) || norm.includes(currentNorm))) continue;

            const next = `${out} ${plain}.`.replace(/\s+/g, " ").trim();
            const nextLen = normalizeCompareText(next).length;
            if (nextLen > hardMax && normalizeCompareText(out).length >= targetLen) break;
            out = next;
            seen.add(norm);
            if (normalizeCompareText(out).length >= targetLen) break;
          }
        };

        const rawBase = cleanText(rawSummary || item?.summaryText || "");
        if (rawBase) {
          const rawSentencePool = toSentences(rawBase).join(" ");
          const expandedFromRaw = buildExpandedEnglishSummary(rawBase, rawBase, "");
          const detailSupplement = buildDetailSupplementText(rawBase, "");
          const emergencySupplement = buildEmergencySummaryText(rawBase, "");

          if (normalizeCompareText(out).length < targetLen) appendCandidate(rawSentencePool);
          if (normalizeCompareText(out).length < targetLen) appendCandidate(expandedFromRaw);
          if (normalizeCompareText(out).length < targetLen) appendCandidate(detailSupplement);
          if (normalizeCompareText(out).length < targetLen) appendCandidate(emergencySupplement);
        }

        const parts = toSentences(out);
        let compact = "";
        for (const part of parts) {
          const next = compact ? `${compact} ${part}` : part;
          if (normalizeCompareText(next).length > hardMax) break;
          compact = next;
        }
        out = (compact || out).replace(/\s+/g, " ").trim();
        out = proofreadEnglishSummaryText(out, titleText || item?.title || "") || out;
        if (out && !/[.!?]$/.test(out)) out += ".";
        return out.replace(/\s+/g, " ").trim();
      }

      function buildHeadlineText(rawTitle, fallbackText = "") {
        const original = decodeHtmlEntitiesText(rawTitle || "")
          .replace(/\s+/g, " ")
          .trim();
        if (!original) return "";

        const trimByWord = (input, maxChars) => {
          const src = String(input || "").trim();
          if (src.length <= maxChars) return src;
          const sliced = src.slice(0, maxChars + 1);
          const cut = sliced.lastIndexOf(" ");
          return (cut > Math.floor(maxChars * 0.62) ? sliced.slice(0, cut) : sliced.slice(0, maxChars)).trim();
        };

        const clean = (value) =>
          decodeHtmlEntitiesText(value || "")
            .replace(/&#\d+;?/g, " ")
            .replace(/&#x[0-9a-f]+;?/gi, " ")
            .replace(/&[a-z]+;/gi, " ")
            .replace(/https?:\/\/\S+/gi, " ")
            .replace(/\b\S+\.(?:png|jpe?g|gif|webp|svg)\b/gi, " ")
            .replace(/\s+/g, " ")
            .trim();

        const stripSourceSuffix = (value) =>
          String(value || "")
            .replace(
              /\s+[|｜]\s+(techcrunch|the verge|mit technology review|openai|google ai|google deepmind|deepmind|microsoft research|nvidia blog)\b.*$/i,
              "",
            )
            .replace(
              /\s+-\s+(techcrunch|the verge|mit technology review|openai|google ai|google deepmind|deepmind|microsoft research|nvidia blog)\b.*$/i,
              "",
            )
            .replace(
              /\s*\((techcrunch|the verge|mit technology review|openai|google ai|google deepmind|deepmind|microsoft research|nvidia blog)[^)]*\)\s*$/i,
              "",
            )
            .trim();

        const stripSentenceEnding = (value) =>
          String(value || "")
            .replace(/\s*(?:입니다|합니다|했습니다|하였다|했다|한다|됩니다|됐다|되었다|밝혔다|설명했다|전했다)\s*$/g, "")
            .replace(/\s*(?:라고|라며)\s+.*$/g, "")
            .replace(/[.?!]+$/g, "")
            .replace(/\s+/g, " ")
            .trim();

        let base = stripSourceSuffix(clean(original));
        if (!base) base = clean(original);

        const firstSentence = base.split(/(?<=[.!?。！？])\s+/).filter(Boolean)[0] || base;
        let headline = stripSentenceEnding(firstSentence);
        const shortEnglishLead = normalizeCompareText(headline).length > 0 && normalizeCompareText(headline).length < 20;
        const looksLikeAbbrevTail = /\b(?:vs|vs\.|u\.s|e\.u|mr|mrs|ms|dr|prof)\s*$/i.test(String(headline || "").trim());
        if ((shortEnglishLead || looksLikeAbbrevTail) && normalizeCompareText(base).length > normalizeCompareText(headline).length + 14) {
          headline = stripSentenceEnding(base);
        }

        if (!headline || headline.length < 8) {
          const fb = stripSourceSuffix(clean(fallbackText || ""));
          const fbFirst = fb.split(/(?<=[.!?。！？])\s+/).filter(Boolean)[0] || fb;
          headline = stripSentenceEnding(fbFirst) || stripSentenceEnding(base) || original;
        }

        const maxChars = currentLang === "ko" ? 86 : 120;
        return trimByWord(headline, maxChars);
      }

      /**
       * Normalize AI/tech company and product names in English text.
       * Fixes typos (Antropic→Anthropic), spacing (Open AI→OpenAI),
       * and stray punctuation (e.g. "Paper Orchestra, " → "Paper Orchestra").
       */
      function normalizeEnglishProperNames(text) {
        if (!text) return text;
        let out = text;
        const nameMap = [
          // Anthropic
          [/\bAntropic\b/gi, "Anthropic"],
          [/\bAntrhopic\b/gi, "Anthropic"],
          [/\bAnthroppic\b/gi, "Anthropic"],
          [/\bAnthropics\b/gi, "Anthropic"],
          // OpenAI
          [/\bOpen\s+AI\b/g, "OpenAI"],
          [/\bOPENAI\b/g, "OpenAI"],
          [/\bOpen-AI\b/gi, "OpenAI"],
          // Google DeepMind / Google Cloud
          [/\bGoogle\s+DeepMind\b/gi, "Google DeepMind"],
          [/\bGoogleDeepMind\b/gi, "Google DeepMind"],
          [/\bGoogle\s+Cloud\b/gi, "Google Cloud"],
          [/\bGoogel\b/gi, "Google"],
          // Microsoft
          [/\bMicorsoft\b/gi, "Microsoft"],
          [/\bMicrosft\b/gi, "Microsoft"],
          // Meta AI
          [/\bMetaAI\b/g, "Meta AI"],
          // NVIDIA
          [/\bNVidia\b/g, "NVIDIA"],
          [/\bNvidea\b/gi, "NVIDIA"],
          [/\bNvida\b/gi, "NVIDIA"],
          // Hugging Face
          [/\bHuggingface\b/gi, "Hugging Face"],
          [/\bHugging\s*face\b/gi, "Hugging Face"],
          // ChatGPT / GPT
          [/\bChat\s*GPT\b/gi, "ChatGPT"],
          [/\bGPT-?4o\b/gi, "GPT-4o"],
          // Gemini
          [/\bGemeni\b/gi, "Gemini"],
          // Claude
          [/\bClaud\b(?!e)/gi, "Claude"],
          // LLaMA / Llama
          [/\bLLAMA\b/g, "Llama"],
          [/\bLLaMa\b/g, "Llama"],
          // GitHub
          [/\bGithub\b/g, "GitHub"],
          [/\bGIT\s*HUB\b/gi, "GitHub"],
          // YouTube
          [/\bYoutube\b/g, "YouTube"],
          // LinkedIn
          [/\bLinkedin\b/g, "LinkedIn"],
          // Mistral AI
          [/\bMistral\s+AI\b/gi, "Mistral AI"],
          // xAI
          [/\bx\.AI\b/gi, "xAI"],
        ];
        for (const [re, replacement] of nameMap) {
          out = out.replace(re, replacement);
        }
        // Strip a trailing comma that is the last character before end-of-string
        // or before a sentence-end mark — e.g. "Paper Orchestra," → "Paper Orchestra"
        // (Intentionally narrow: do NOT strip commas inside sentences.)
        out = out
          .replace(/,\s*(?=[.!?]\s*$|$)/g, "")
          .replace(/\s{2,}/g, " ")
          .trim();
        return out;
      }

      function proofreadEnglishHeadlineText(input) {
        const trimByWord = (value, maxChars = 120) => {
          const src = String(value || "").trim();
          if (src.length <= maxChars) return src;
          const sliced = src.slice(0, maxChars + 1);
          const cut = sliced.lastIndexOf(" ");
          return (cut > Math.floor(maxChars * 0.62) ? sliced.slice(0, cut) : sliced.slice(0, maxChars)).trim();
        };

        let out = decodeHtmlEntitiesText(input || "")
          .replace(/[“”"]/g, '"')
          .replace(/[‘’']/g, "'")
          .replace(/\s+/g, " ")
          // Normalize quote/punctuation spacing: “Paper Orchestra, ” → "Paper Orchestra,"
          .replace(/\s+([,.;:!?])(?=["'])/g, "$1")
          .replace(/([,.;:!?])\s+(?=["'])/g, "$1")
          // "Company, Verb" → "Company Verb"
          // Only strip comma when it is directly between a proper-name subject and a verb.
          // We target specific action verbs so we don't accidentally remove list commas
          // ("Google, Apple, and Microsoft…") or appositive commas ("Sam Altman, CEO of…").
          .replace(
            /([A-Z][A-Za-z0-9]+(?:\s+[A-Z][A-Za-z0-9]+)*),\s+(?=(?:announce|launch|release|unveil|introduce|present|reveal|debut|partner|acqui|secure|sign|raise|fund|invest|deploy|expand|open|close|join|bring|offer|plan|target|report|reach|hit|set|win|cut|add|build|make|take|get|push|roll|kick|pull|develop|create|design|update|upgrade|advance|scale|grow|merge|hire|appoint|sue|gain|top|enter|exit|return|halt|resume|delay|compete|buy|sell|back|warn|confirm|share|patent|file|claim|deny|drop|boost|double|slash|surpass|exceed)\w*\b)/gi,
            "$1 "
          )
          .replace(/\s+([,:;!?])/g, "$1")
          .replace(/([,:;!?])(?!\s|$)/g, "$1 ")
          .replace(/\b([A-Za-z][A-Za-z0-9'-]{1,})\s+\1\b/gi, "$1")
          // Strip trailing punctuation: commas, pipes, colons, semicolons, ellipsis
          .replace(/\s*[,|:;\u2026]+\s*$/g, "")
          .replace(/[.?!]+$/g, "")
          .replace(/\s{2,}/g, " ")
          .trim();

        if (!out) return "";

        const stopWords = new Set([
          "to",
          "for",
          "with",
          "and",
          "or",
          "of",
          "in",
          "on",
          "at",
          "by",
          "from",
          "into",
          "about",
          "across",
          "between",
          "through",
          "without",
          "within",
          "can",
          "will",
          "is",
          "are",
        ]);
        const words = out.split(/\s+/).filter(Boolean);
        if (words.length > 6) {
          const lastWord = words[words.length - 1];
          const lw = String(lastWord || "")
            .replace(/[^A-Za-z]/g, "")
            .toLowerCase();
          if (lw && stopWords.has(lw)) {
            words.pop();
            out = words.join(" ").trim();
          }
        }

        out = normalizeEnglishProperNames(out);
        return trimByWord(out, 120);
      }

      function proofreadEnglishSummaryText(input, titleHint = "") {
        const cleanText = (value) =>
          decodeHtmlEntitiesText(value || "")
            .replace(/\s*(\.\.\.|…)+\s*$/g, "")
            .replace(/\s+/g, " ")
            .trim();
        const sentenceEnd = (value) => (/[.!?]$/.test(value) ? value : `${value}.`);
        const titleNorm = normalizeCompareText(titleHint || "");
        const captionLikePatterns = [
          /\b(?:photo|pictured|image|images|screenshot|render(?:ing)?|illustration|on the left|on the right|background)\b/i,
          /\b(?:wearing|poses?|standing|sitting|smiling|looks? at|holding)\b/i,
        ];
        // 메타 안내문·필러 문장 — 카드에 절대 노출 금지
        const metaInstructionPatterns = [
          /\bcheck\s+(?:the\s+)?(?:original\s+)?source\s+link\b/i,
          /\bsee\s+(?:the\s+)?(?:full|original|source)\s+(?:article|story|post|link|details?)\b/i,
          /\bvisit\s+(?:the\s+)?(?:link|source|website|site|page)\s+for\b/i,
          /\bread\s+(?:more|the\s+full)\s+(?:article|story|post)?\s+(?:at|on|here)\b/i,
          /\bfor\s+(?:more|full|further|implementation|additional)\s+(?:details?|information|info|context|coverage)\b/i,
          /\bfor\s+(?:rollout|deployment|implementation)\s+(?:details?|boundaries?|scope)\b/i,
          /\b(?:click|tap)\s+(?:here|the\s+link)\s+(?:to\s+)?(?:read|view|learn)\b/i,
          /\bthe\s+(?:key\s+point|main\s+point|bottom\s+line|takeaway)\s+is\b/i,
          /\bit(?:'s|\s+is)\s+worth\s+noting\s+that\b/i,
          /\bstay\s+tuned\b/i,
          /\bmore\s+details?\s+(?:to\s+follow|coming\s+soon|available\s+at)\b/i,
          /\bsource\s*:\s*https?:\/\//i,
          /\bvia\s+https?:\/\//i,
        ];

        const raw = cleanText(input);
        if (!raw || isSummaryEmptyText(raw)) return raw;

        const lines = raw
          .split(/(?<=[.!?])\s+|\n+/)
          .map((s) => {
            let cleaned = cleanText(s)
              .replace(/\b([A-Za-z][A-Za-z0-9'-]{1,})\s+\1\b/gi, "$1")
              // Only strip bare conjunctions when they appear alone at start with no content value
              // ("And the" → keep; "And, " → strip the comma stub only)
              .replace(/^\s*(?:And|But|So|Also),\s+/i, "")
              .trim();
            cleaned = cleaned.replace(/^([a-z])/, (m) => m.toUpperCase());
            return cleaned;
          })
          .filter((s) => {
            if (!s || s.length < 22) return false;
            // 메타 안내문·필러 문장 제거
            if (metaInstructionPatterns.some((re) => re.test(s))) return false;
            // 단어 1~2개짜리 파편 문장 제거 (e.g. "Launches.")
            if (s.replace(/[^A-Za-z\s가-힣]/g, "").trim().split(/\s+/).length <= 2) return false;
            // Korean sentences must never appear in English output
            const koCharCount = (s.match(/[가-힣]/g) || []).length;
            if (koCharCount > 3) return false;
            return true;
          })
          .map((s) => sentenceEnd(s));

        if (!lines.length) return sentenceEnd(raw);

        const uniq = [];
        const seen = new Set();
        for (const line of lines) {
          const norm = normalizeCompareText(line);
          if (!norm || seen.has(norm)) continue;
          if (titleNorm && (norm === titleNorm || norm.startsWith(titleNorm.slice(0, Math.min(38, titleNorm.length))))) continue;
          if (captionLikePatterns.some((re) => re.test(line)) && line.length < 70) continue;
          seen.add(norm);
          uniq.push(line);
        }

        if (!uniq.length) return sentenceEnd(raw);

        // Detect repeated leading subject (company name) across consecutive sentences
        // e.g. "Google unveiled Gemma 4. Google released four variants..." → replace 2nd subject
        if (uniq.length >= 2) {
          const getLeadWord = (s) => {
            const m = s.match(/^([A-Z][A-Za-z]{1,18}(?:\s+[A-Z][A-Za-z]{1,14}){0,2})\s+(?:has\s+)?(?:announced|unveiled|launched|released|introduced|published|open[- ]?sourced|deployed|rolled?\s*out|debuted)/i);
            return m ? m[1].toLowerCase() : null;
          };
          const subj0 = getLeadWord(uniq[0]);
          if (subj0) {
            for (let i = 1; i < uniq.length; i++) {
              const subjI = getLeadWord(uniq[i]);
              if (subjI && subjI === subj0) {
                // Replace repeated subject + announcement verb with "The model" pivot
                uniq[i] = uniq[i]
                  .replace(
                    /^[A-Z][A-Za-z]{1,18}(?:\s+[A-Z][A-Za-z]{1,14}){0,2}\s+(?:has\s+)?(?:announced|unveiled|launched|released|introduced|published|open[- ]?sourced|deployed|rolled?\s*out|debuted)\s+/i,
                    "The release includes ",
                  );
                uniq[i] = uniq[i].replace(/^([a-z])/, (m) => m.toUpperCase());
              }
            }
          }
        }

        const MIN_CHARS = 260;
        const MAX_CHARS = 560;
        let out = "";
        for (const sentence of uniq) {
          const next = out ? `${out} ${sentence}` : sentence;
          const len = normalizeCompareText(next).length;
          if (len > MAX_CHARS && normalizeCompareText(out).length >= MIN_CHARS) break;
          out = next;
          if (normalizeCompareText(out).length >= MIN_CHARS && out.split(/(?<=[.!?])\s+/).length >= 2) break;
        }

        if (!out) out = uniq[0];
        if (normalizeCompareText(out).length < 190 && uniq.length >= 2) out = `${uniq[0]} ${uniq[1]}`;
        out = out.replace(/\s+/g, " ").trim();
        out = normalizeEnglishProperNames(out);
        if (out && !/[.!?]$/.test(out)) out += ".";
        return out;
      }

      function proofreadKoreanHeadlineText(input) {

          .replace(/\s+/g, " ")
          .replace(/\s+([,:;!?])/g, "$1")

          .replace(/\s{2,}/g, " ")

      function proofreadKoreanSummaryText(input) {
        const cleanText = (value) =>
          decodeHtmlEntitiesText(value || "")
            .replace(/\s*(\.\.\.|…)+\s*$/g, "")
            .replace(/\s+/g, " ")
            .trim();
        const sentenceEnd = (value) => {
          const s = String(value || "").trim();
          if (!s) return "";
          return /[.!?]$/.test(s) ? s : `${s}.`;
        };
        const actionTokenSet = (value) =>
          new Set(String(value || "").match(/(?:출시|공개|발표|도입|추가|업데이트|파트너십|협력|투자|계약|유치|조달|지원|제공|확장|강화|개선|통합|배포|성능|베타|프리뷰)/g) || []);
        const stemmedTokenSet = (value) =>
          new Set(
            normalizeCompareText(value || "")
              .split(/\s+/)
              .map((tok) =>
                String(tok || "")
                  .replace(/(?:은|는|이|가|을|를|와|과|의|에|에서|에게|으로|로|도|만|부터|까지|처럼|보다)$/g, "")
                  .trim(),
              )
              .filter((tok) => tok && tok.length >= 2 && !ISSUE_STOPWORDS.has(tok)),
          );

        const raw = cleanText(input);
        if (!raw || isSummaryEmptyText(raw)) return raw;

        const isNearDuplicateSentence = (a, b) => {
          const na = normalizeCompareText(a);
          const nb = normalizeCompareText(b);
          if (!na || !nb) return false;
          if (na === nb) return true;
          if (na.length >= 18 && nb.length >= 18 && (na.includes(nb) || nb.includes(na))) return true;
          const sa = tokenSetFromNormalizedText(na);
          const sb = tokenSetFromNormalizedText(nb);
          if (!sa.size || !sb.size) return false;
          let inter = 0;
          sa.forEach((v) => {
            if (sb.has(v)) inter++;
          });
          const j = jaccardSimilarity(sa, sb);
          if (inter >= 7) return true;
          if (inter >= 5 && j >= 0.58) return true;

          const ssa = stemmedTokenSet(a);
          const ssb = stemmedTokenSet(b);
          if (!ssa.size || !ssb.size) return false;
          let interStem = 0;
          ssa.forEach((v) => {
            if (ssb.has(v)) interStem++;
          });
          const smaller = Math.min(ssa.size, ssb.size);
          if (!smaller) return false;
          const coverage = interStem / smaller;

          const aa = actionTokenSet(a);
          const ab = actionTokenSet(b);
          let sharedAction = false;
          aa.forEach((v) => {
            if (ab.has(v)) sharedAction = true;
          });

          if (smaller >= 4 && coverage >= 0.75 && (sharedAction || interStem >= 6)) return true;
